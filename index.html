  if (!it.file || !it.file.blob) return '';
  if (!urlCache.has(it.id)) urlCache.set(it.id, URL.createObjectURL(it.file.blob));
  return urlCache.get(it.id);
};
const dropUrl = id => { if (urlCache.has(id)) { URL.revokeObjectURL(urlCache.get(id)); urlCache.delete(id); } };
const VSECTIONS = [
  { id: 'all', label: 'Alle Einträge', short: 'Alle', icon: 'all' }, { id: 'doc', label: 'Dokumente', short: 'Dokumente', icon: 'doc' },
  { id: 'data', label: 'Daten', short: 'Daten', icon: 'data' }, { id: 'fav', label: 'Favoriten', short: 'Favoriten', icon: 'star' },
  { id: 'trash', label: 'Papierkorb', short: 'Papierkorb', icon: 'trash' }
];

function ensureVault() {
  const v = $('#v-vault');
  if (v.dataset.ready) return;
  v.dataset.ready = '1';
  v.innerHTML = `<div class="h-row"><h1 id="vTitle">Tresor</h1><span class="sub" id="vCount"></span><div class="sp"></div><button class="pill danger" id="vTrash" hidden>Papierkorb leeren</button></div>
    <div class="toolbar glass">
      <label class="search"><span>${icon('search')}</span><input id="vq" type="search" placeholder="Suchen in Titeln, Feldern, Notizen, Tags" autocomplete="off"><kbd>/</kbd></label>
      <select class="sel" id="vsort" aria-label="Sortierung"><option value="updated">Zuletzt geändert</option><option value="created">Zuletzt hinzugefügt</option><option value="name">Name A–Z</option><option value="size">Größe</option></select>
      <div class="seg" role="group" aria-label="Ansicht"><button id="vgrid" aria-label="Kacheln">${icon('all')}</button><button id="vlist" aria-label="Liste">${icon('list')}</button></div>
      <button class="round" id="vmore" aria-label="Backup">${icon('dots')}</button>
      <button class="pill primary" id="vnew">${icon('plus')}Neu</button></div>
    <div class="vault-bar" id="vBar"></div>
    <div class="vault-scroll"><div id="vcontent"></div></div>`;
  $('#vsort').value = V.sort;
  $('#vgrid').classList.toggle('on', V.layout === 'grid'); $('#vlist').classList.toggle('on', V.layout === 'list');
  bindVault(v);
}

function vMatches(it, q) {
  if (!q) return true;
  const hay = [it.title, it.notes, (it.tags || []).join(' '), it.file ? it.file.name : '', (it.fields || []).map(f => f.k + ' ' + f.v).join(' ')].join(' ').toLowerCase();
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(w => hay.includes(w));
}
function vVisible() {
  const list = V.items.filter(it => {
    if (V.section === 'trash') return it.trashed;
    if (it.trashed) return false;
    if (V.section === 'doc' && it.kind !== 'doc') return false;
    if (V.section === 'data' && it.kind !== 'data') return false;
    if (V.section === 'fav' && !it.fav) return false;
    if (V.tag && !(it.tags || []).includes(V.tag)) return false;
    return true;
  }).filter(it => vMatches(it, V.q));
  const cmp = {
    updated: (a, b) => b.updated - a.updated, created: (a, b) => b.created - a.created,
    name: (a, b) => a.title.localeCompare(b.title, 'de', { sensitivity: 'base' }),
    size: (a, b) => ((b.file && b.file.size) || 0) - ((a.file && a.file.size) || 0)
  }[V.sort];
  return list.sort(cmp);
}
function vCardHTML(it, i) {
  const isDoc = it.kind === 'doc';
  const isImg = isDoc && it.file && /^image\//.test(it.file.type);
  const thumb = isImg ? `<div class="thumb"><img src="${urlFor(it)}" alt="" loading="lazy"></div>`
    : `<div class="thumb"><div class="badge ${isDoc ? 'b-doc' : 'b-data'}">${isDoc ? esc(ext(it.file && it.file.name)) : icon('data')}</div></div>`;
  let sub;
  if (isDoc) sub = `${fmtSize(it.file ? it.file.size : 0)} · ${new Intl.DateTimeFormat('de-DE', { dateStyle: 'medium' }).format(it.updated)}`;
  else sub = (it.fields || []).filter(f => f.v).slice(0, 2).map(f => f.v).join(' · ') || `${(it.fields || []).length} Felder`;
  const chips = (it.tags || []).slice(0, 3).map(t => `<span class="chip">${esc(t)}</span>`).join('');
  const star = it.trashed ? '' : `<button class="star ${it.fav ? 'on' : ''}" data-act="fav" aria-label="Favorit">${icon('star')}</button>`;
  return `<div class="card glass" data-id="${it.id}" tabindex="0" style="animation-delay:${Math.min(i, 14) * 25}ms">${thumb}${star}<div class="txt"><h3>${esc(it.title || 'Ohne Titel')}</h3><p>${esc(sub)}</p>${chips ? `<div class="chips">${chips}</div>` : ''}</div></div>`;
}
function renderVault() {
  ensureVault();
  const live = V.items.filter(i => !i.trashed);
  const counts = { all: live.length, doc: live.filter(i => i.kind === 'doc').length, data: live.filter(i => i.kind === 'data').length, fav: live.filter(i => i.fav).length, trash: V.items.filter(i => i.trashed).length };
  const tagCount = {}; live.forEach(i => (i.tags || []).forEach(t => { tagCount[t] = (tagCount[t] || 0) + 1; }));
  const tags = Object.keys(tagCount).sort((a, b) => tagCount[b] - tagCount[a] || a.localeCompare(b, 'de'));
  $('#vBar').innerHTML = VSECTIONS.map(s => `<button class="vchip ${V.section === s.id && !V.tag ? 'on' : ''}" data-sec="${s.id}">${icon(s.icon)}${esc(s.short)} <span class="n">${counts[s.id]}</span></button>`).join('')
    + tags.map(t => `<button class="vchip ${V.tag === t ? 'on' : ''}" data-tag="${esc(t)}">${icon('tag')}${esc(t)} <span class="n">${tagCount[t]}</span></button>`).join('');
  const items = vVisible(), sec = VSECTIONS.find(s => s.id === V.section);
  $('#vTitle').textContent = V.tag ? `# ${V.tag}` : sec.id === 'all' ? 'Tresor' : sec.label;
  $('#vCount').textContent = items.length + (items.length === 1 ? ' Eintrag' : ' Einträge');
  $('#vTrash').hidden = !(V.section === 'trash' && items.length);
  const c = $('#vcontent');
  if (!items.length) {
    let h, p, btns = '';
    if (V.q) { h = 'Nichts gefunden'; p = 'Versuche einen anderen Suchbegriff.'; }
    else if (V.section === 'trash') { h = 'Papierkorb ist leer'; p = 'Gelöschte Einträge landen zuerst hier.'; }
    else if (V.section === 'fav') { h = 'Noch keine Favoriten'; p = 'Tippe auf den Stern an einem Eintrag.'; }
    else if (V.tag) { h = 'Keine Einträge mit diesem Tag'; p = ''; }
    else { h = 'Dein Tresor ist leer'; p = 'Lege Dokumente ab oder erfasse Daten wie Verträge, Kontakte und Konten. Dein Zwilling kann sie später durchsuchen. Alles bleibt lokal in deinem Browser.';
      btns = `<div class="row"><button class="pill primary" data-act="upload">${icon('upload')}Dokument hochladen</button><button class="pill" data-act="newdata">${icon('data')}Datensatz anlegen</button></div>`; }
    c.className = '';
    c.innerHTML = `<div class="empty glass"><div class="badge b-data">${icon(V.section === 'trash' ? 'trash' : 'shield')}</div><h2>${esc(h)}</h2><p>${esc(p)}</p>${btns}</div>`;
    return;
  }
  c.className = V.layout === 'grid' ? 'grid' : 'list';
  c.innerHTML = items.map(vCardHTML).join('');
}
renderers.vault = renderVault;

/* ---------- Speichern ---------- */
let vSaveTimer = null;
async function vPersist(it) {
  it.updated = Date.now();
  try {
    await dbPut(it);
    if (!V.persistAsked && navigator.storage && navigator.storage.persist) { V.persistAsked = true; navigator.storage.persist().catch(() => {}); }
  } catch (e) {
    toast(e && e.name === 'QuotaExceededError' ? 'Speicher voll – bitte Platz schaffen.' : 'Speichern fehlgeschlagen.');
    throw e;
  }
}
function newItem(kind, extra) {
  const now = Date.now();
  return Object.assign({ id: uid(), kind, title: '', notes: '', tags: [], fields: [], fav: false, trashed: false, created: now, updated: now }, extra || {});
}
async function addFiles(files) {
  const list = Array.from(files || []); if (!list.length) return;
  ensureVault();
  let n = 0, last = null;
  for (const f of list) {
    const it = newItem('doc', { title: baseName(f.name), file: { name: f.name, type: f.type || 'application/octet-stream', size: f.size, blob: f } });
    try { await vPersist(it); V.items.push(it); last = it; n++; } catch (e) { break; }
  }
  if (n) {
    if (V.section === 'data' || V.section === 'trash') V.section = 'all';
    if (currentView !== 'vault') go('vault'); else renderVault();
    toast(n === 1 ? 'Dokument gespeichert' : `${n} Dokumente gespeichert`);
    addXP(Math.min(30, n * 10), 'wissen', n === 1 ? 'Dokument abgelegt' : `${n} Dokumente abgelegt`);
    refreshAll();
    if (n === 1 && last) openDetail(last.id);
  }
}
async function addData(tplId) {
  const t = TEMPLATES.find(x => x.id === tplId) || TEMPLATES[0];
  const it = newItem('data', { title: t.title, fields: t.fields.map(k => ({ k, v: '' })) });
  try { await vPersist(it); } catch (e) { return; }
  V.items.push(it);
  if (V.section === 'doc' || V.section === 'trash') V.section = 'all';
  addXP(10, t.area, 'Datensatz angelegt: ' + t.label);
  if (currentView !== 'vault') go('vault'); else renderVault();
  refreshAll();
  openDetail(it.id, true);
}

/* ---------- Detail ---------- */
function collectDetail() {
  const it = vById(V.openId); if (!it) return null;
  const d = $('#detail');
  const title = $('.d-title', d); if (title) it.title = title.value.trim() || 'Ohne Titel';
  const notes = $('.ta', d); if (notes) it.notes = notes.value;
  it.fields = $$('.frow', d).map(r => ({ k: $('.fk', r).value, v: $('.fv', r).value }));
  return it;
}
function queueVSave() {
  clearTimeout(vSaveTimer);
  vSaveTimer = setTimeout(async () => { vSaveTimer = null; const it = collectDetail(); if (!it) return; try { await vPersist(it); } catch (e) { return; } renderVault(); }, 350);
}
async function flushVSave() {
  if (!vSaveTimer) return;
  clearTimeout(vSaveTimer); vSaveTimer = null;
  const it = collectDetail(); if (it) { try { await vPersist(it); } catch (e) { /* Meldung kam bereits */ } }
}
async function previewHTML(it) {
  if (it.kind !== 'doc' || !it.file) return '';
  const f = it.file, type = f.type || '';
  if (/^image\//.test(type)) return `<div class="preview"><img src="${urlFor(it)}" alt="${esc(f.name)}"></div>`;
  if (type === 'application/pdf') return `<div class="preview"><iframe src="${urlFor(it)}" title="${esc(f.name)}"></iframe></div>`;
  if (/^text\//.test(type) || /json|xml|csv|markdown/.test(type) || /\.(txt|md|csv|json|log|xml)$/i.test(f.name)) {
    try { const txt = await f.blob.slice(0, 20000).text(); return `<div class="preview"><pre>${esc(txt)}${f.size > 20000 ? '\n…' : ''}</pre></div>`; } catch (e) { /* weiter */ }
  }
  return `<div class="preview"><div class="badge b-doc">${esc(ext(f.name))}</div></div>`;
}
const fieldRow = f => `<div class="frow"><input class="inp fk" placeholder="Feld" value="${esc(f.k)}"><input class="inp fv" placeholder="Wert" value="${esc(f.v)}">
  <button class="mini" data-d="copy" aria-label="Kopieren">${icon('copy')}</button><button class="mini" data-d="rmfield" aria-label="Feld entfernen">${icon('close')}</button></div>`;
async function openDetail(id, focusTitle) {
  await flushVSave();
  const it = vById(id); if (!it) return;
  V.openId = id;
  const d = $('#detail'), prev = await previewHTML(it);
  const meta = [it.kind === 'doc' && it.file ? `${esc(it.file.name)} · ${fmtSize(it.file.size)}` : 'Datensatz', `Erstellt ${fmtDate(it.created)}`, `Geändert ${fmtDate(it.updated)}`].join('<br>');
  d.innerHTML = `<div class="d-head"><input class="d-title" value="${esc(it.title)}" aria-label="Titel"><button class="round" data-d="close" aria-label="Schließen">${icon('close')}</button></div>
    <div class="d-body">${prev}<div class="meta">${meta}</div>
      <div class="sec"><h4>Tags</h4><div class="tagbox">${(it.tags || []).map(t => `<span class="chip">${esc(t)}<button data-d="rmtag" data-t="${esc(t)}" aria-label="Tag entfernen">${icon('close')}</button></span>`).join('')}<input id="tagIn" placeholder="Tag hinzufügen…" maxlength="30"></div></div>
      <div class="sec"><h4>Felder<button data-d="addfield">${icon('plus')}Feld</button></h4><div id="fields">${(it.fields || []).map(fieldRow).join('')}</div></div>
      <div class="sec"><h4>Notizen</h4><textarea class="ta" placeholder="Notizen…">${esc(it.notes)}</textarea></div></div>
    <div class="d-foot">${it.trashed
      ? `<button class="pill" data-d="restore">${icon('restore')}Wiederherstellen</button><button class="pill danger" data-d="purge">${icon('trash')}Endgültig löschen</button>`
      : `<button class="pill" data-d="fav">${icon('star')}${it.fav ? 'Entfernen' : 'Favorit'}</button>${it.kind === 'doc' ? `<button class="pill" data-d="download">${icon('download')}Laden</button>` : ''}<button class="pill danger" data-d="trash">${icon('trash')}Löschen</button>`}</div>`;
  d.classList.add('open'); d.setAttribute('aria-hidden', 'false'); $('#scrim').classList.add('open');
  if (focusTitle) { const t = $('.d-title', d); t.focus(); t.select(); }
}
async function closeDetail() {
  await flushVSave();
  V.openId = null;
  const d = $('#detail'); d.classList.remove('open'); d.setAttribute('aria-hidden', 'true'); $('#scrim').classList.remove('open');
  if (currentView === 'vault') renderVault();
  refreshAll();
}
function downloadBlob(blob, name) {
  const u = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 4000);
}
async function detailAction(act, el) {
  const it = collectDetail(); if (!it) return;
  if (act === 'close') return closeDetail();
  if (act === 'copy') { try { await navigator.clipboard.writeText(el.closest('.frow').querySelector('.fv').value); toast('Kopiert'); } catch (e) { toast('Kopieren nicht möglich'); } return; }
  if (act === 'rmfield') { el.closest('.frow').remove(); collectDetail(); queueVSave(); return; }
  if (act === 'addfield') { $('#fields').insertAdjacentHTML('beforeend', fieldRow({ k: '', v: '' })); const r = $$('#fields .fk'); r[r.length - 1].focus(); return; }
  if (act === 'rmtag') { it.tags = it.tags.filter(t => t !== el.dataset.t); await vPersist(it); await openDetail(it.id); renderVault(); return; }
  if (act === 'fav') { it.fav = !it.fav; await vPersist(it); await openDetail(it.id); renderVault(); return; }
  if (act === 'download') { downloadBlob(it.file.blob, it.file.name); return; }
  if (act === 'trash') { it.trashed = true; await vPersist(it); toast('In den Papierkorb verschoben'); await closeDetail(); return; }
  if (act === 'restore') { it.trashed = false; await vPersist(it); toast('Wiederhergestellt'); await closeDetail(); return; }
  if (act === 'purge') {
    if (!(await askConfirm('Endgültig löschen?', `„${it.title}“ wird unwiderruflich entfernt.`))) return;
    clearTimeout(vSaveTimer); vSaveTimer = null;
    await dbDel(it.id); dropUrl(it.id); V.items = V.items.filter(x => x.id !== it.id);
    toast('Endgültig gelöscht'); V.openId = null; await closeDetail();
  }
}

/* ---------- Menüs ---------- */
function showMenu(anchor, html) {
  const m = $('#menu'); m.innerHTML = html;
  const r = anchor.getBoundingClientRect();
  m.style.top = Math.min(r.bottom + 8, window.innerHeight - 330) + 'px';
  m.style.right = Math.max(12, window.innerWidth - r.right) + 'px'; m.style.left = 'auto';
  m.classList.add('open');
}
const hideMenu = () => $('#menu').classList.remove('open');
const newMenu = a => showMenu(a, `<button data-m="upload">${icon('upload')}Dokument hochladen…</button><hr><div class="lab">Neuer Datensatz</div>` + TEMPLATES.map(t => `<button data-m="tpl" data-t="${t.id}">${icon(t.icon)}${esc(t.label)}</button>`).join(''));
const moreMenu = a => showMenu(a, `<button data-m="export">${icon('download')}Backup exportieren</button><button data-m="import">${icon('upload')}Backup importieren</button>`);

function bindVault(v) {
  $('#vq').addEventListener('input', e => { V.q = e.target.value.trim(); renderVault(); });
  $('#vsort').addEventListener('change', e => { V.sort = e.target.value; lsSet('yai-sort', V.sort); renderVault(); });
  $('#vgrid').addEventListener('click', () => setVLayout('grid'));
  $('#vlist').addEventListener('click', () => setVLayout('list'));
  $('#vnew').addEventListener('click', e => { e.stopPropagation(); newMenu(e.currentTarget); });
  $('#vmore').addEventListener('click', e => { e.stopPropagation(); moreMenu(e.currentTarget); });
  $('#vTrash').addEventListener('click', async () => {
    const tr = V.items.filter(i => i.trashed);
    if (!tr.length || !(await askConfirm('Papierkorb leeren?', `${tr.length} Einträge werden endgültig gelöscht.`, 'Leeren'))) return;
    for (const it of tr) { await dbDel(it.id); dropUrl(it.id); }
    V.items = V.items.filter(i => !i.trashed); renderVault(); refreshAll(); toast('Papierkorb geleert');
  });
  $('#vBar').addEventListener('click', e => {
    const b = e.target.closest('.vchip'); if (!b) return;
    if (b.dataset.tag !== undefined) { V.tag = V.tag === b.dataset.tag ? null : b.dataset.tag; V.section = 'all'; } else { V.section = b.dataset.sec; V.tag = null; }
    renderVault();
  });
  $('#vcontent').addEventListener('click', e => {
    const act = e.target.closest('[data-act]');
    if (act) {
      const a = act.dataset.act;
      if (a === 'upload') return $('#fileIn').click();
      if (a === 'newdata') return addData('blank');
      if (a === 'fav') { e.stopPropagation(); const it = vById(act.closest('.card').dataset.id); if (it) { it.fav = !it.fav; vPersist(it).then(renderVault).catch(() => {}); } return; }
    }
    const card = e.target.closest('.card'); if (card) openDetail(card.dataset.id);
  });
  $('#vcontent').addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('card')) { e.preventDefault(); openDetail(e.target.dataset.id); } });
}
function setVLayout(l) {
  V.layout = l; lsSet('yai-layout', l);
  $('#vgrid').classList.toggle('on', l === 'grid'); $('#vlist').classList.toggle('on', l === 'list');
  renderVault();
}
function bindVaultGlobal() {
  $('#menu').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    hideMenu();
    const m = b.dataset.m;
    if (m === 'upload') $('#fileIn').click();
    if (m === 'tpl') addData(b.dataset.t);
    if (m === 'export') exportBackup();
    if (m === 'import') $('#importIn').click();
  });
  document.addEventListener('click', e => { if (!e.target.closest('#menu')) hideMenu(); });
  $('#fileIn').addEventListener('change', e => { addFiles(e.target.files); e.target.value = ''; });
  $('#importIn').addEventListener('change', e => { importBackup(e.target.files[0]); e.target.value = ''; });
  const d = $('#detail');
  d.addEventListener('click', e => { const b = e.target.closest('[data-d]'); if (b) detailAction(b.dataset.d, b); });
  d.addEventListener('input', e => { if (e.target.matches('.d-title, .ta, .fk, .fv')) queueVSave(); });
  d.addEventListener('keydown', async e => {
    if (e.target.id !== 'tagIn') return;
    if (e.key === 'Enter' || e.key === ',') {
      e.preventDefault();
      const val = e.target.value.trim().replace(/,/g, ''), it = collectDetail();
      if (val && it && !it.tags.includes(val)) { it.tags.push(val); await vPersist(it); await openDetail(it.id); renderVault(); $('#tagIn').focus(); }
    } else if (e.key === 'Backspace' && !e.target.value) {
      const it = collectDetail();
      if (it && it.tags.length) { it.tags.pop(); await vPersist(it); await openDetail(it.id); renderVault(); $('#tagIn').focus(); }
    }
  });
  $('#scrim').addEventListener('click', closeDetail);
  let depth = 0;
  const hasFiles = e => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
  window.addEventListener('dragenter', e => { if (hasFiles(e)) { depth++; $('#drop').classList.add('on'); } });
  window.addEventListener('dragleave', e => { if (hasFiles(e) && --depth <= 0) { depth = 0; $('#drop').classList.remove('on'); } });
  window.addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
  window.addEventListener('drop', e => { if (!hasFiles(e)) return; e.preventDefault(); depth = 0; $('#drop').classList.remove('on'); addFiles(e.dataTransfer.files); });
}

/* ---------- Backup (Tresor + Spielstand) ---------- */
const blobToDataURL = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(b); });
async function exportBackup() {
  toast('Backup wird erstellt…');
  const out = [];
  for (const it of V.items) {
    const copy = Object.assign({}, it);
    if (it.file && it.file.blob) copy.file = { name: it.file.name, type: it.file.type, size: it.file.size, data: await blobToDataURL(it.file.blob) };
    out.push(copy);
  }
  const json = JSON.stringify({ app: 'yannickai', version: 2, exported: new Date().toISOString(), game: G, items: out });
  downloadBlob(new Blob([json], { type: 'application/json' }), `yannickai-backup-${dayKey()}.json`);
  toast('Backup gespeichert');
}
async function importBackup(file) {
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!data || !Array.isArray(data.items) || !(data.app === 'yannickai' || data.app === 'tresor-glass')) throw new Error('format');
    if (data.game && typeof data.game === 'object') {
      if (!(await askConfirm('Spielstand ersetzen?', 'Das Backup enthält einen Spielstand. Dein aktueller Spielstand (Level, Gewohnheiten, Erinnerungen) wird dadurch ersetzt.', 'Ersetzen'))) return;
      G = Object.assign(defaultGame(), data.game); G.look = Object.assign(defaultGame().look, data.game.look || {});
      await saveGameNow();
    }
    let n = 0;
    for (const raw of data.items) {
      if (!raw || !raw.id || !raw.kind) continue;
      const it = Object.assign(newItem(raw.kind), raw);
      if (raw.file && raw.file.data) { const blob = await (await fetch(raw.file.data)).blob(); it.file = { name: raw.file.name, type: raw.file.type, size: raw.file.size, blob }; }
      await dbPut(it); dropUrl(it.id);
      const idx = V.items.findIndex(x => x.id === it.id); if (idx >= 0) V.items[idx] = it; else V.items.push(it);
      n++;
    }
    applyLook(); refreshAll();
    toast(`${n} Einträge importiert`);
  } catch (e) { toast('Datei konnte nicht importiert werden'); }
}

/* =====================================================================
   START: Theme, Onboarding, globale Events, Initialisierung
   ===================================================================== */
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.content = t === 'dark' ? '#0b0d1c' : '#cfe0ff';
  const b = $('#themeBtn'); if (b) b.innerHTML = icon(t === 'dark' ? 'sun' : 'moon');
}
function setTheme(pref) {
  lsSet('yai-theme', pref);
  const dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(pref === 'auto' ? (dark ? 'dark' : 'light') : pref);
}

function refreshAll() {
  renderNav(); renderSide();
  if (renderers[currentView]) renderers[currentView]();
  if (homeStage) homeStage.setMood(moodValue());
}

/* ---------- Onboarding ---------- */
function runOnboarding() {
  openModal(`<h2>Willkommen bei YannickAI</h2>
    <p class="lead">Dein digitaler Zwilling lernt dich kennen: deine Themen, Ziele und Gewohnheiten. Du sammelst XP, steigst im Level auf und schaltest neue Looks frei.</p>
    <label class="field">Wie soll dein Zwilling heißen?<input class="inp" id="obName" maxlength="24" value="${esc(G.name)}"></label>
    <p class="muted" style="margin-top:14px">Alles bleibt lokal in diesem Browser. Es gibt keine Cloud und keine Anmeldung.</p>
    <div class="m-actions"><button class="pill primary" data-mc="next">Weiter</button></div>`,
  m => m.addEventListener('click', e => {
    const b = e.target.closest('[data-mc]'); if (!b) return;
    G.name = $('#obName', m).value.trim().slice(0, 24) || 'Yannick';
    G.onboarded = true; saveGame(); closeModal(); refreshAll();
    addXP(20, '', 'Willkommen!');
    setTimeout(() => openStarterModal(() => { go('home'); setTimeout(() => { if (homeStage) homeStage.play('wave'); say(`${greeting()} Mach als Erstes einen Check-in, dann kennen wir uns schon etwas besser.`, 6500); }, 300); }), 200);
  }));
}

/* ---------- Events ---------- */
function bindGlobal() {
  $('#navMain').addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b) go(b.dataset.go); });
  $('#logo').innerHTML = icon('spark');
  const brand = $('.brand');
  const tb = document.createElement('button'); tb.className = 'round'; tb.id = 'themeBtn'; tb.setAttribute('aria-label', 'Design wechseln'); tb.style.marginLeft = 'auto';
  brand.appendChild(tb);
  applyTheme(document.documentElement.dataset.theme || 'light');
  tb.addEventListener('click', () => { setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'); if (currentView === 'me') renderMe(); });
  $('#modalWrap').addEventListener('click', e => { if (e.target.id === 'modalWrap') closeModal(); });
  document.addEventListener('keydown', e => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
    if (e.key === 'Escape') {
      if ($('#modalWrap').classList.contains('open')) closeModal();
      else { hideMenu(); if (V.openId) closeDetail(); }
    }
    if (e.key === '/' && !typing && currentView === 'vault') { e.preventDefault(); const q = $('#vq'); if (q) q.focus(); }
  });
  const mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  if (mq && mq.addEventListener) mq.addEventListener('change', () => { if ((lsGet('yai-theme') || 'auto') === 'auto') setTheme('auto'); });
  window.addEventListener('beforeunload', () => { saveGameNow().catch(() => {}); });

  bus.on('xp', ev => {
    if (ev.n > 0 && !introActive) xpFloat(ev.n);
    renderNav(); renderSide();
  });
  bus.on('levelup', ev => {
    if (homeStage) { homeStage.play('cheer'); homeStage.burst(90); }
    setTimeout(() => { if (!$('#modalWrap').classList.contains('open')) showLevelUp(ev.to); }, 700);
  });
  bus.on('achievement', () => { if (homeStage) homeStage.burst(30); });
  bus.on('mood', () => { if (homeStage) homeStage.setMood(moodValue()); });
}

async function init() {
  setTheme(lsGet('yai-theme') || 'auto');
  const sort = lsGet('yai-sort'); if (sort && ['updated', 'created', 'name', 'size'].includes(sort)) V.sort = sort;
  if (lsGet('yai-layout') === 'list') V.layout = 'list';
  bindGlobal(); bindVaultGlobal();
  try {
    db = await openDB();
    await loadGame();
    V.items = await dbAll();
  } catch (e) {
    $('#main').innerHTML = `<div class="gcard glass" style="margin:8vh auto;max-width:460px"><h2>Speicher nicht verfügbar</h2><p class="muted">Dein Browser blockiert die lokale Datenbank (z. B. im privaten Modus). Öffne die Seite in einem normalen Fenster.</p></div>`;
    $('#v-home').classList.add('on');
    return;
  }
  renderNav(); renderSide();
  const start = lsGet('yai-view');
  go(VIEWS.find(v => v.id === start) ? start : 'home');
  ensureHome(); renderHome();
  const afterIntro = () => {
    if (!G.onboarded) runOnboarding();
    else if (currentView === 'home' && homeStage) { homeStage.play('wave'); say(`${greeting()} ${twinLine()}`, 6000); }
  };
  runIntro(afterIntro);
  if (reduceMotion()) afterIntro();
}
init();

})();

</script>
</body>
</html>
