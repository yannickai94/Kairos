    <div class="fields"><div class="field full"><label for="wzNe">Netto pro Monat</label><input class="inp" id="wzNe" data-w="netto" inputmode="decimal" placeholder="0,00" value="${d.netto ? esc(moneyInput(d.netto)) : ''}" autocomplete="off"></div>${d.wohnart === 'Miete' ? `<div class="field full"><label for="wzMi">Warmmiete pro Monat</label><input class="inp" id="wzMi" data-w="miete" inputmode="decimal" placeholder="0,00" value="${d.miete ? esc(moneyInput(d.miete)) : ''}" autocomplete="off"></div>` : ''}</div>`;
  return `<h2>Womit startest du?</h2><p class="lead-p">Alles Weitere füllt Kairos aus Dokumenten. Wähle den schnellsten Einstieg – du kannst jederzeit mehr hinzufügen.</p>
    <div class="wzs">${[['ausweis', '🪪', 'Ausweis fotografieren', 'Name, Geburtsdatum, Anschrift füllen sich selbst'], ['auszug', '🧾', 'Kontoauszug laden', 'Findet Gehalt, Miete, Strom, Abos und Versicherungen'], ['lohn', '💶', 'Lohnabrechnung hochladen', 'Arbeitgeber, Netto, Steuerklasse, Krankenkasse'], ['spaeter', '⏭️', 'Erst mal umsehen', 'Du gehst später Schritt für Schritt vor']].map(([v, e, t, s]) => `<button type="button" class="wzc ${d.start === v ? 'on' : ''}" data-w="start" data-v="${v}"><i>${e}</i><span><b>${t}</b><small>${s}</small></span></button>`).join('')}</div>`;
}
function wzRender(host, W, o) {
  const n = WZ_STEPS.length, last = W.step === n - 1;
  host.innerHTML = `<div class="wz"><div class="wz-top"><div class="wz-dots" role="progressbar" aria-valuemin="1" aria-valuemax="${n}" aria-valuenow="${W.step + 1}">${WZ_STEPS.map((s, i) => `<i class="${i < W.step ? 'done' : i === W.step ? 'cur' : ''}"></i>`).join('')}</div><button type="button" class="link" data-wz="skip">${o.first ? 'Später einrichten' : 'Schließen'}</button></div>
    <div class="wz-body">${wzBody(W)}</div>
    <div class="wz-acts">${W.step ? '<button type="button" class="btn ghost" data-wz="back">Zurück</button>' : ''}<span class="sp"></span>${['unterwegs', 'geld'].includes(WZ_STEPS[W.step]) ? '<button type="button" class="btn ghost" data-wz="next" data-skip="1">Überspringen</button>' : ''}<button type="button" class="btn primary lg" data-wz="next">${last ? 'Los geht’s' : 'Weiter'}</button></div></div>`;
}
function wzValid(W) {
  const d = W.d, id = WZ_STEPS[W.step], miss = [];
  if (id === 'du') { if (!d.vorname.trim()) miss.push('vorname'); if (!d.nachname.trim()) miss.push('nachname'); if (!d.geburtsdatum || d.geburtsdatum > todayISO() || d.geburtsdatum < '1900-01-01') miss.push('geburtsdatum'); }
  if (id === 'alltag') for (const k of ['besch', 'wohnart', 'famst', 'kv']) if (!d[k]) miss.push(k);
  return miss;
}
function wzSave(W) {
  const d = W.d, v = {}, keys = [], put = (k, val) => { if (val != null && val !== '') { v[k] = val; keys.push(k); } }, none = k => { v[k + '__none'] = true; keys.push(k); }, open = k => { v[k + '__open'] = true; keys.push(k); };
  put('vorname', d.vorname.trim()); put('nachname', d.nachname.trim()); put('geburtsdatum', d.geburtsdatum);
  put('beschaeftigung', d.besch); put('wohnart', d.wohnart); put('familienstand', d.famst); put('kv_art', d.kv);
  if (d.kinder === 'nein') none('kinder');
  if (d.auto === 'nein') none('kennzeichen');
  if (d.fs === 'unbef') open('fs_bis'); else if (d.fs === 'nein') none('fuehrerschein');
  if (['Rentner/in', 'Arbeitsuchend', 'Selbstständig / Freiberuflich'].includes(d.besch)) none('arbeitgeber');
  if (d.netto) put('netto', d.netto);
  if (d.wohnart === 'Miete') { if (d.miete) put('miete', d.miete); } else if (d.wohnart) none('miete');
  if (d.besch === 'Rentner/in' || d.besch === 'Arbeitsuchend') S.journey.na.beruf = 1;
  saveFields([...new Set(keys)].filter(k => PF[k]), v);
  if (d.vorname.trim()) S.profile.name = d.vorname.trim().split(/\s+/)[0].slice(0, 30);
  S.ui.wizardDone = true; S.ui.onboarded = true; save();
}
/** Läuft in `host`; gibt die gewählte Start-Aktion zurück (oder null) */
function runWizard(host, o = {}) {
  return new Promise(res => {
    const W = wzInit(); const draw = () => { wzRender(host, W, o); const f = host.querySelector('input'); if (f && !matchMedia('(pointer:coarse)').matches) setTimeout(() => f.focus(), 60); };
    const finish = act => res(act || null);
    const startAct = () => ({ ausweis: () => ACT['cap.pick']({ dataset: { ch: 'ausweis' } }), lohn: () => ACT['cap.pick']({ dataset: { ch: 'job' } }), auszug: () => ACT['st.import']() }[W.d.start] || null);
    host.addEventListener('input', e => { const k = e.target.dataset && e.target.dataset.w; if (!k) return; if (k === 'netto' || k === 'miete') { const raw = e.target.value.trim(); W.d[k] = raw ? parseMoney(raw) : null; } else W.d[k] = e.target.value; });
    host.addEventListener('click', e => {
      const p = e.target.closest('.wzp button, .wzc'); if (p) { const k = p.dataset.w || p.parentElement.dataset.w, v = p.dataset.v; W.d[k] = W.d[k] === v && k !== 'start' ? '' : v; buzz(6); const keep = host.querySelector('.wz-body').scrollTop; draw(); if (k === 'start') { /* Auswahl bestätigt */ } host.querySelector('.wz-body').scrollTop = keep; return; }
      const b = e.target.closest('[data-wz]'); if (!b) return; const a = b.dataset.wz;
      if (a === 'back') { W.step = Math.max(0, W.step - 1); draw(); return; }
      if (a === 'skip') { if (o.first) { S.ui.onboarded = true; save(); } finish(null); return; }
      if (a === 'next') {
        if (!b.dataset.skip) { const miss = wzValid(W); if (miss.length) { const sel = { vorname: '#wzV', nachname: '#wzN', geburtsdatum: '#wzG' }; miss.forEach(k => { const el = sel[k] ? host.querySelector(sel[k]) : host.querySelector(`.wzp[data-w="${k}"]`); if (el) el.classList.add('bad'); }); toast(WZ_STEPS[W.step] === 'du' ? 'Bitte Vor-, Nachname und Geburtsdatum eintragen.' : 'Bitte wähle bei jeder Frage eine Antwort.', 'bad'); return; } }
        else if (WZ_STEPS[W.step] === 'geld') { W.d.netto = W.d.miete = null; }
        if (W.step < WZ_STEPS.length - 1) { W.step++; draw(); host.querySelector('.wz-body').scrollTop = 0; return; }
        wzSave(W); finish(startAct());
      }
    });
    draw();
  });
}
ACT['wiz.open'] = () => {
  const sh = openSheet('<div id="wzHost"></div>', { wide: true });
  runWizard($('#wzHost', sh), {}).then(act => { closeSheet(); renderNav(); rerender(); if (act) setTimeout(act, 320); else toast('Gespeichert', 'good'); });
};

/* =====================================================================
   KAIROS · Start: Splash, Onboarding, Boot
   ===================================================================== */
function showOnboarding(replay) {
  return new Promise(res => {
    const el = $('#lock'); el.hidden = false;
    el.innerHTML = `<div class="onb"><div class="onb-card glass"><div class="logo-lg anim">${logoSvg('onb')}</div><h1>Deine digitale <span class="gradtxt">Kopie</span></h1><p class="onb-sub">Kairos baut aus deinen Dokumenten Schritt für Schritt ein vollständiges Abbild von dir – dein Ausweis, dein Job, deine Bank, deine Versicherungen. Alles an einem Ort, jederzeit abrufbar.</p>
      <div class="onb-feats"><div><span>🪪</span><b>1 · Ausweis</b><small>Foto vom Perso – Name, Geburtsdatum, Anschrift füllen sich von selbst.</small></div><div><span>💶</span><b>2 · Dokumente</b><small>Lohnabrechnung, Brief, Karte – Kairos liest und ordnet alles zu.</small></div><div><span>✅</span><b>3 · Vollständig</b><small>Bis deine Identität digital komplett ist – und du sie einfach abfragen kannst.</small></div></div>
      ${replay ? '<div class="onb-acts"><button class="btn primary lg" id="onbClose">Schließen</button></div>' : `<form id="onbForm"><div class="field"><label for="onbName">Wie soll ich dich nennen?</label><input class="inp" id="onbName" placeholder="Dein Vorname" value="${esc(S.profile.name || '')}" autocomplete="given-name"></div>
      <div class="onb-acts"><button class="btn primary lg" type="submit">Los geht’s</button></div><button type="button" class="link onb-skip" id="onbSkip">Später einrichten</button></form>`}
      <small class="faint onb-priv">${icon('lock')} Alles bleibt auf diesem Gerät. Keine Cloud, kein Konto, keine API.</small></div></div>`;
    if (replay) { $('#onbClose').onclick = () => { el.hidden = true; el.innerHTML = ''; res(); }; return; }
    const fin = async act => { S.ui.onboarded = true; dirty = true; await saveNow(); el.hidden = true; el.innerHTML = ''; res(act || null); };
    $('#onbForm').addEventListener('submit', async e => {
      e.preventDefault(); S.profile.name = $('#onbName').value.trim().slice(0, 30); dirty = true; await saveNow();
      const card = $('.onb-card', el); card.classList.add('wz-card'); card.scrollTop = 0;
      fin(await runWizard(card, { first: true }));
    });
    $('#onbSkip').addEventListener('click', () => { S.profile.name = $('#onbName').value.trim().slice(0, 30); fin(null); });
    setTimeout(() => { const i = $('#onbName'); i && i.focus(); }, 400);
  });
}

function afterUnlock() {
  cleanOrphans(); save();
  $('#app').hidden = false; $('#dock').hidden = false;
  const r = (location.hash.replace('#/', '') || 'reise'); route = VIEWS[r] ? r : 'reise';
  if (S.ui.llm) llmEnable().then(() => { if (route === 'einstellungen') rerender(); });
  renderView(false); updateLockBtn(); armIdle();
  if (S.ui.notice) { const n = S.ui.notice; delete S.ui.notice; save(); setTimeout(() => toast(n), 900); }
  document.title = route === 'reise' ? 'Kairos' : AREAS[route].name + ' · Kairos';
  connectBoot();
}

  window.__K = { get S() { return S; }, get route() { return route; }, tnState, tnLocked, go, ACT, VIEWS, overall, nextStep, pset, pget, answerRules, askKairos, extractDocument, readDocument, capStart, capReview, buildReview, applyReview, mergeCands, QA, get REV() { return REV; }, rerender, photosAdd: typeof photosAdd === 'function' ? photosAdd : null, buildInsights, buildDeadlines, consumeShare, shareSheet, digestText, tgPull, tgApi, textImportSheet, importText, kvKind, fsUmtausch, lifeline, vAll, vst, setVst, fixCosts, haushalt, newInst, CV, instIds, parseCvText, cvText, cvStats, berufStats, vMonthly, kuendDate, vDeadlines, provList, PROV, xSpecs, katalogInsights, parseStatement, stAnalyze, stApply, stMatch, stRun, stNum, waNum, urlWA, urlTG, makeICS, topInsights, urgentCount, profileConflicts };
}
boot().catch(e => { console.error(e); document.body.insertAdjacentHTML('beforeend', `<pre style="position:fixed;inset:20px;z-index:999;background:#300;color:#fff;padding:20px;overflow:auto">Kairos konnte nicht starten:\n${esc(e && e.stack || e)}</pre>`); });
