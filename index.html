<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#cfe0ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tresor">
<title>Tresor – Daten &amp; Dokumente</title>
<style>
:root{
  --text:#16161d; --text2:rgba(22,22,29,.62); --text3:rgba(22,22,29,.4);
  --glass:rgba(255,255,255,.5); --glass-hi:rgba(255,255,255,.78); --glass-lo:rgba(255,255,255,.28);
  --stroke:rgba(255,255,255,.75); --hair:rgba(20,20,40,.08);
  --accent:#0a84ff; --accent2:#5e5ce6; --danger:#ff3b30; --ok:#30d158; --gold:#ffb400;
  --shadow:0 18px 50px rgba(40,50,110,.16), 0 2px 6px rgba(40,50,110,.06);
  --bg-a:#cfe0ff; --bg-b:#f3dcff; --bg-c:#d8fff0;
  --orb1:#6aa8ff; --orb2:#c58cff; --orb3:#5ee6c0; --orb4:#ffb38a;
  --field:rgba(255,255,255,.55);
  color-scheme:light;
}
[data-theme="dark"]{
  --text:#f3f3f8; --text2:rgba(243,243,248,.64); --text3:rgba(243,243,248,.4);
  --glass:rgba(38,40,58,.46); --glass-hi:rgba(70,74,100,.55); --glass-lo:rgba(255,255,255,.06);
  --stroke:rgba(255,255,255,.17); --hair:rgba(255,255,255,.09);
  --accent:#4da3ff; --accent2:#8e8cff;
  --shadow:0 18px 50px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.3);
  --bg-a:#0b0d1c; --bg-b:#160d26; --bg-c:#08202a;
  --orb1:#2a5fd1; --orb2:#7b3fd6; --orb3:#13917a; --orb4:#c2603a;
  --field:rgba(255,255,255,.07);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--text);
  background:linear-gradient(135deg,var(--bg-a),var(--bg-b) 55%,var(--bg-c));
  background-attachment:fixed;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  letter-spacing:-.005em;
}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
svg.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Hintergrund-Orbs */
.orbs{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.75;animation:float 26s ease-in-out infinite}
.orb.o1{width:46vmax;height:46vmax;background:var(--orb1);left:-12vmax;top:-14vmax}
.orb.o2{width:38vmax;height:38vmax;background:var(--orb2);right:-10vmax;top:6vmax;animation-delay:-8s}
.orb.o3{width:42vmax;height:42vmax;background:var(--orb3);left:18vmax;bottom:-22vmax;animation-delay:-15s}
.orb.o4{width:24vmax;height:24vmax;background:var(--orb4);right:8vmax;bottom:-8vmax;opacity:.5;animation-delay:-4s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(4vmax,3vmax) scale(1.08)}66%{transform:translate(-3vmax,5vmax) scale(.95)}}
@media (prefers-reduced-motion:reduce){.orb{animation:none}*{transition:none!important}}

/* Glas */
.glass{
  position:relative;
  background:linear-gradient(145deg,var(--glass-hi),var(--glass) 38%,var(--glass-lo));
  -webkit-backdrop-filter:blur(30px) saturate(190%);
  backdrop-filter:blur(30px) saturate(190%);
  border:1px solid var(--stroke);
  box-shadow:var(--shadow), inset 0 1.5px 0 rgba(255,255,255,.55), inset 0 -1px 0 rgba(255,255,255,.08);
}
[data-theme="dark"] .glass{box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.2), inset 0 -1px 0 rgba(255,255,255,.03)}
.glass::before{ /* Lichtreflex */
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(120% 70% at 12% 0%,rgba(255,255,255,.55),rgba(255,255,255,0) 55%);
  opacity:.5;mix-blend-mode:soft-light;
}
[data-theme="dark"] .glass::before{opacity:.28}

/* Layout */
.app{position:relative;z-index:1;height:100dvh;display:grid;grid-template-columns:272px minmax(0,1fr);gap:16px;
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.side{border-radius:30px;padding:18px 14px;display:flex;flex-direction:column;gap:6px;overflow:auto;min-height:0}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 14px}
.logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;font-size:20px;
  background:linear-gradient(145deg,#5ab0ff,#6a5cff);box-shadow:0 6px 16px rgba(60,90,255,.4), inset 0 1px 0 rgba(255,255,255,.5)}
.brand b{font-size:19px;font-weight:700;letter-spacing:-.02em}
.brand small{display:block;color:var(--text2);font-size:12px;margin-top:1px}
.nav-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);padding:14px 12px 4px}
.nav{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:10px 12px;border-radius:14px;font-size:15px;font-weight:500;color:var(--text);transition:background .2s,transform .15s}
.nav:hover{background:var(--glass-lo)}
.nav:active{transform:scale(.98)}
.nav .i{font-size:19px;color:var(--text2)}
.nav .n{margin-left:auto;font-size:12.5px;color:var(--text2);font-variant-numeric:tabular-nums}
.nav.on{background:linear-gradient(145deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 18px rgba(40,90,255,.35), inset 0 1px 0 rgba(255,255,255,.35)}
.nav.on .i,.nav.on .n{color:rgba(255,255,255,.9)}
.side-foot{margin-top:auto;padding:14px 10px 2px;font-size:12px;color:var(--text2);line-height:1.5}
.side-foot .bar{height:5px;border-radius:9px;background:var(--glass-lo);margin:8px 0 6px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--hair)}
.side-foot .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:9px;transition:width .5s}

.main{display:flex;flex-direction:column;gap:14px;min-width:0;min-height:0}
.toolbar{border-radius:24px;padding:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.search{flex:1 1 220px;display:flex;align-items:center;gap:9px;padding:0 14px;height:42px;border-radius:15px;background:var(--field);box-shadow:inset 0 0 0 1px var(--hair), inset 0 1px 3px rgba(0,0,0,.05)}
.search .i{color:var(--text2)}
.search input{flex:1;min-width:0;border:0;background:none;outline:0;font-size:15.5px}
.search input::placeholder{color:var(--text3)}
.search kbd{font:12px/1 inherit;color:var(--text3);border:1px solid var(--hair);border-radius:6px;padding:3px 6px}
.pill,.sel{height:42px;border-radius:15px;padding:0 14px;display:inline-flex;align-items:center;gap:8px;font-size:14.5px;font-weight:500;background:var(--field);box-shadow:inset 0 0 0 1px var(--hair);transition:transform .15s,background .2s}
.pill:hover,.sel:hover{background:var(--glass-hi)}
.pill:active{transform:scale(.97)}
.sel{appearance:none;-webkit-appearance:none;outline:0;border:0;padding-right:14px;cursor:pointer}
.sel:focus-visible,.pill:focus-visible,.nav:focus-visible,.round:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sel option{color:#111}
.seg{display:inline-flex;padding:3px;border-radius:15px;background:var(--field);box-shadow:inset 0 0 0 1px var(--hair)}
.seg button{width:38px;height:36px;border-radius:12px;display:grid;place-items:center;color:var(--text2);transition:.2s}
.seg button.on{background:var(--glass-hi);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.12), inset 0 1px 0 rgba(255,255,255,.5)}
.primary{background:linear-gradient(145deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 8px 20px rgba(50,90,255,.38), inset 0 1px 0 rgba(255,255,255,.4)}
.primary:hover{background:linear-gradient(145deg,var(--accent),var(--accent2));filter:brightness(1.07)}
.danger{color:var(--danger)}

.head{display:flex;align-items:baseline;gap:12px;padding:0 6px}
.head h1{margin:0;font-size:30px;font-weight:700;letter-spacing:-.03em}
.head span{color:var(--text2);font-size:15px}
.head .sp{flex:1}
.scroll{flex:1;min-height:0;overflow:auto;padding:4px 4px 24px;margin:0 -4px;scrollbar-width:thin;scrollbar-color:var(--hair) transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{border-radius:24px;padding:12px;display:flex;flex-direction:column;gap:10px;text-align:left;cursor:pointer;transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s;animation:pop .4s cubic-bezier(.2,.8,.2,1) both}
.card:hover{transform:translateY(-3px) scale(1.012)}
.card:active{transform:scale(.985)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.thumb{height:118px;border-radius:16px;overflow:hidden;display:grid;place-items:center;background:var(--field);box-shadow:inset 0 0 0 1px var(--hair)}
.thumb img{width:100%;height:100%;object-fit:cover}
.badge{min-width:62px;height:62px;padding:0 10px;border-radius:19px;display:grid;place-items:center;font-weight:700;font-size:14px;letter-spacing:.03em;color:#fff;box-shadow:0 8px 20px rgba(0,0,0,.2), inset 0 1px 0 rgba(255,255,255,.45)}
.badge .i{font-size:28px}
.b-doc{background:linear-gradient(145deg,#ff9f43,#ff5e62)}
.b-data{background:linear-gradient(145deg,#4db8ff,#6a5cff)}
.card h3{margin:0;font-size:15.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.card p{margin:0;font-size:13px;color:var(--text2);padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:5px;flex-wrap:wrap;padding:0 4px}
.chip{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--glass-lo);box-shadow:inset 0 0 0 1px var(--hair);color:var(--text2)}
.star{position:absolute;top:18px;right:18px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(0,0,0,.22);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:.2s}
.star.on{color:var(--gold);background:rgba(255,255,255,.85)}
.star.on svg{fill:var(--gold)}
.star:hover{transform:scale(1.12)}
.list{display:flex;flex-direction:column;gap:10px}
.list .card{flex-direction:row;align-items:center;gap:14px;padding:10px 16px 10px 10px;border-radius:22px}
.list .card:hover{transform:translateX(3px)}
.list .thumb{width:58px;height:58px;flex:none;border-radius:16px}
.list .badge{min-width:46px;height:46px;border-radius:15px;font-size:12px}
.list .badge .i{font-size:22px}
.list .txt{flex:1;min-width:0}
.list .chips{margin-top:5px}
.list .star{position:static;order:3;color:var(--text2);background:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.list .star.on{background:none;color:var(--gold)}

.empty{margin:8vh auto 0;max-width:420px;text-align:center;padding:36px 28px;border-radius:32px}
.empty .badge{margin:0 auto 18px;width:76px;height:76px;border-radius:24px}
.empty h2{margin:0 0 8px;font-size:23px;letter-spacing:-.02em}
.empty p{margin:0 0 20px;color:var(--text2);line-height:1.5;font-size:15px}
.empty .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* Menü */
.menu{position:fixed;z-index:30;min-width:240px;border-radius:22px;padding:8px;opacity:0;transform:translateY(-6px) scale(.97);transform-origin:top right;pointer-events:none;transition:.18s}
.menu.open{opacity:1;transform:none;pointer-events:auto}
.menu button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 12px;border-radius:14px;font-size:15px}
.menu button:hover{background:var(--glass-lo)}
.menu .i{color:var(--accent);font-size:18px}
.menu hr{border:0;border-top:1px solid var(--hair);margin:6px 8px}
.menu .lab{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);padding:8px 12px 4px}

/* Detail */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(10,14,40,.18);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:.25s}
.scrim.open{opacity:1;pointer-events:auto}
.detail{position:fixed;z-index:25;top:max(14px,env(safe-area-inset-top));bottom:max(14px,env(safe-area-inset-bottom));right:max(14px,env(safe-area-inset-right));width:min(480px,calc(100vw - 28px));border-radius:32px;
  display:flex;flex-direction:column;transform:translateX(115%);transition:transform .45s cubic-bezier(.2,.9,.25,1);overflow:hidden}
.detail.open{transform:none}
.d-head{display:flex;align-items:center;gap:10px;padding:18px 18px 10px}
.d-title{flex:1;min-width:0;border:0;outline:0;background:none;font-size:23px;font-weight:700;letter-spacing:-.02em;padding:4px 6px;border-radius:10px}
.d-title:focus{background:var(--field)}
.round{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--field);box-shadow:inset 0 0 0 1px var(--hair);transition:.2s;flex:none}
.round:hover{background:var(--glass-hi);transform:scale(1.08)}
.d-body{flex:1;overflow:auto;padding:4px 18px 18px;display:flex;flex-direction:column;gap:16px;scrollbar-width:thin}
.preview{border-radius:20px;overflow:hidden;background:var(--field);box-shadow:inset 0 0 0 1px var(--hair);display:grid;place-items:center;min-height:120px}
.preview img{max-width:100%;max-height:300px;display:block}
.preview iframe{width:100%;height:340px;border:0;background:#fff}
.preview pre{margin:0;padding:14px;width:100%;max-height:260px;overflow:auto;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;word-break:break-word}
.preview .badge{margin:26px}
.meta{font-size:12.5px;color:var(--text2);line-height:1.6;padding:0 4px}
.sec h4{margin:0 0 8px 4px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--text2);display:flex;align-items:center}
.sec h4 button{margin-left:auto;color:var(--accent);font-size:13px;text-transform:none;letter-spacing:0;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.frow{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1.4fr) auto auto;gap:6px;margin-bottom:6px}
.inp,.ta{width:100%;border:0;outline:0;border-radius:14px;padding:11px 13px;font-size:15px;background:var(--field);box-shadow:inset 0 0 0 1px var(--hair), inset 0 1px 3px rgba(0,0,0,.04);transition:box-shadow .2s}
.inp:focus,.ta:focus{box-shadow:inset 0 0 0 1.5px var(--accent), 0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent)}
.fk{font-weight:600;color:var(--text2)}
.mini{width:38px;border-radius:12px;display:grid;place-items:center;color:var(--text2);background:var(--field);box-shadow:inset 0 0 0 1px var(--hair)}
.mini:hover{color:var(--text);background:var(--glass-hi)}
.ta{min-height:120px;resize:vertical;line-height:1.5}
.tagbox{display:flex;flex-wrap:wrap;gap:6px;padding:8px;border-radius:16px;background:var(--field);box-shadow:inset 0 0 0 1px var(--hair)}
.tagbox .chip{display:inline-flex;align-items:center;gap:4px;font-size:13px;padding:4px 6px 4px 11px;background:var(--glass-hi)}
.tagbox .chip button{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:var(--text2)}
.tagbox .chip button:hover{background:var(--hair)}
.tagbox input{flex:1;min-width:110px;border:0;outline:0;background:none;padding:5px 6px;font-size:14.5px}
.d-foot{display:flex;gap:8px;padding:12px 18px 18px;border-top:1px solid var(--hair);flex-wrap:wrap}
.d-foot .pill{flex:1;justify-content:center;min-width:110px}

/* Drop + Toast */
.drop{position:fixed;inset:12px;z-index:40;border-radius:36px;display:grid;place-items:center;font-size:24px;font-weight:700;letter-spacing:-.02em;border:2.5px dashed var(--accent);opacity:0;pointer-events:none;transition:.2s;
  background:color-mix(in srgb,var(--accent) 14%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.drop.on{opacity:1}
.toasts{position:fixed;z-index:50;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{padding:11px 20px;border-radius:99px;font-size:14.5px;font-weight:500;animation:pop .3s both}
.toast.out{opacity:0;transform:translateY(8px);transition:.3s}

/* Mobil */
@media (max-width:860px){
  body{overflow:auto}
  .app{height:100dvh;grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);gap:12px;padding:12px}
  .side{flex-direction:row;align-items:center;padding:8px;border-radius:24px;overflow-x:auto;overflow-y:hidden;gap:4px}
  .brand,.side-foot,.nav-label{display:none}
  #navMain,#navTags{display:contents}
  .nav{width:auto;flex:none;padding:9px 13px;white-space:nowrap}
  .nav .n{margin-left:2px}
  .toolbar{padding:8px;gap:8px}
  .search{flex:1 1 100%}
  .sel{flex:1;min-width:0}
  .head{flex-wrap:wrap;gap:4px 10px}
  .head h1{font-size:26px}
  .search kbd{display:none}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .thumb{height:96px}
  .detail{left:10px;right:10px;top:10px;bottom:10px;width:auto;border-radius:28px}
  .frow{grid-template-columns:1fr 1fr auto auto}
}
</style>
</head>
<body>
<div class="orbs" aria-hidden="true"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div><div class="orb o4"></div></div>

<div class="app">
  <aside class="side glass" id="side">
    <div class="brand">
      <div class="logo" id="logo"></div>
      <div><b>Tresor</b><small>Daten &amp; Dokumente</small></div>
    </div>
    <div id="navMain"></div>
    <div class="nav-label" id="tagLabel">Tags</div>
    <div id="navTags"></div>
    <div class="side-foot">
      <div class="bar"><i id="barFill"></i></div>
      <div id="storageInfo">…</div>
      <div>Alles bleibt lokal in diesem Browser.</div>
    </div>
  </aside>

  <main class="main">
    <div class="toolbar glass">
      <label class="search"><span id="icSearch"></span><input id="q" type="search" placeholder="Suchen in Titeln, Feldern, Notizen, Tags" autocomplete="off"><kbd>/</kbd></label>
      <select class="sel" id="sort" aria-label="Sortierung">
        <option value="updated">Zuletzt geändert</option>
        <option value="created">Zuletzt hinzugefügt</option>
        <option value="name">Name A–Z</option>
        <option value="size">Größe</option>
      </select>
      <div class="seg" role="group" aria-label="Ansicht">
        <button id="vGrid" aria-label="Kacheln"></button>
        <button id="vList" aria-label="Liste"></button>
      </div>
      <button class="round" id="themeBtn" aria-label="Design wechseln"></button>
      <button class="round" id="moreBtn" aria-label="Backup"></button>
      <button class="pill primary" id="newBtn"><span id="icPlus"></span>Neu</button>
    </div>
    <div class="head"><h1 id="title">Alle Einträge</h1><span id="count"></span><div class="sp"></div><button class="pill danger" id="emptyTrash" hidden>Papierkorb leeren</button></div>
    <div class="scroll" id="scroll"><div id="content"></div></div>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="detail glass" id="detail" aria-hidden="true"></aside>
<div class="menu glass" id="menu" role="menu"></div>
<div class="drop" id="drop">Dateien hier ablegen</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<input type="file" id="fileIn" multiple hidden>
<input type="file" id="importIn" accept="application/json,.json" hidden>

<script>
(() => {
'use strict';

/* ---------- Hilfsfunktionen ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
const fmtDate = ts => new Intl.DateTimeFormat('de-DE', { dateStyle: 'medium', timeStyle: 'short' }).format(ts);
const fmtSize = b => {
  if (!b) return '0 B';
  const u = ['B', 'KB', 'MB', 'GB']; let i = 0;
  while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
  return (b >= 10 || i === 0 ? Math.round(b) : b.toFixed(1)).toString().replace('.', ',') + ' ' + u[i];
};
const ext = n => { const m = /\.([a-z0-9]{1,5})$/i.exec(n || ''); return m ? m[1].toUpperCase() : 'DATEI'; };
const baseName = n => (n || '').replace(/\.[^.]+$/, '') || n || 'Dokument';

/* ---------- Datenbank (IndexedDB) ---------- */
const DB_NAME = 'tresor-glass', STORE = 'items';
let db = null;
const openDB = () => new Promise((res, rej) => {
  const r = indexedDB.open(DB_NAME, 1);
  r.onupgradeneeded = () => { r.result.createObjectStore(STORE, { keyPath: 'id' }); };
  r.onsuccess = () => res(r.result);
  r.onerror = () => rej(r.error);
});
const rq = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const store = mode => db.transaction(STORE, mode).objectStore(STORE);
const dbAll = () => rq(store('readonly').getAll());
const dbPut = it => rq(store('readwrite').put(it));
const dbDel = id => rq(store('readwrite').delete(id));

/* ---------- Zustand ---------- */
const S = {
  items: [], section: 'all', tag: null, q: '', sort: 'updated', layout: 'grid', openId: null,
  persistAsked: false
};
const urlCache = new Map();
const urlFor = it => {
  if (!it.file || !it.file.blob) return '';
  if (!urlCache.has(it.id)) urlCache.set(it.id, URL.createObjectURL(it.file.blob));
  return urlCache.get(it.id);
};
const dropUrl = id => { if (urlCache.has(id)) { URL.revokeObjectURL(urlCache.get(id)); urlCache.delete(id); } };
const byId = id => S.items.find(i => i.id === id);

/* ---------- Toast ---------- */
function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast glass';
  t.textContent = msg;
  $('#toasts').appendChild(t);
  setTimeout(() => t.classList.add('out'), 2400);
  setTimeout(() => t.remove(), 2800);
}

/* ---------- Filter & Rendering ---------- */
function matches(it, q) {
  if (!q) return true;
  const hay = [it.title, it.notes, (it.tags || []).join(' '), it.file ? it.file.name : '',
    (it.fields || []).map(f => f.k + ' ' + f.v).join(' ')].join(' ').toLowerCase();
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(w => hay.includes(w));
}
function visibleItems() {
  let list = S.items.filter(it => {
    if (S.section === 'trash') return it.trashed;
    if (it.trashed) return false;
    if (S.section === 'doc' && it.kind !== 'doc') return false;
    if (S.section === 'data' && it.kind !== 'data') return false;
    if (S.section === 'fav' && !it.fav) return false;
    if (S.tag && !(it.tags || []).includes(S.tag)) return false;
    return true;
  }).filter(it => matches(it, S.q));
  const cmp = {
    updated: (a, b) => b.updated - a.updated,
    created: (a, b) => b.created - a.created,
    name: (a, b) => a.title.localeCompare(b.title, 'de', { sensitivity: 'base' }),
    size: (a, b) => ((b.file && b.file.size) || 0) - ((a.file && a.file.size) || 0)
  }[S.sort];
  return list.sort(cmp);
}

function renderNav() {
  const live = S.items.filter(i => !i.trashed);
  const counts = {
    all: live.length,
    doc: live.filter(i => i.kind === 'doc').length,
    data: live.filter(i => i.kind === 'data').length,
    fav: live.filter(i => i.fav).length,
    trash: S.items.filter(i => i.trashed).length
  };
  $('#navMain').innerHTML = SECTIONS.map(s =>
    `<button class="nav ${S.section === s.id && !S.tag ? 'on' : ''}" data-sec="${s.id}">${icon(s.icon)}<span>${esc(s.short)}</span><span class="n">${counts[s.id]}</span></button>`
  ).join('');
  const tagCount = {};
  live.forEach(i => (i.tags || []).forEach(t => { tagCount[t] = (tagCount[t] || 0) + 1; }));
  const tags = Object.keys(tagCount).sort((a, b) => tagCount[b] - tagCount[a] || a.localeCompare(b, 'de'));
  $('#tagLabel').style.display = tags.length ? '' : 'none';
  $('#navTags').innerHTML = tags.map(t =>
    `<button class="nav ${S.tag === t ? 'on' : ''}" data-tag="${esc(t)}">${icon('tag')}<span>${esc(t)}</span><span class="n">${tagCount[t]}</span></button>`
  ).join('');
  const bytes = S.items.reduce((n, i) => n + ((i.file && i.file.size) || 0), 0);
  $('#storageInfo').textContent = `${S.items.length} Einträge · ${fmtSize(bytes)}`;
  $('#barFill').style.width = Math.min(100, Math.max(S.items.length ? 3 : 0, bytes / (500 * 1024 * 1024) * 100)) + '%';
}

function cardHTML(it, i) {
  const isDoc = it.kind === 'doc';
  const isImg = isDoc && it.file && /^image\//.test(it.file.type);
  const thumb = isImg
    ? `<div class="thumb"><img src="${urlFor(it)}" alt="" loading="lazy"></div>`
    : `<div class="thumb"><div class="badge ${isDoc ? 'b-doc' : 'b-data'}">${isDoc ? esc(ext(it.file && it.file.name)) : icon('data')}</div></div>`;
  let sub;
  if (isDoc) sub = `${fmtSize(it.file ? it.file.size : 0)} · ${new Intl.DateTimeFormat('de-DE', { dateStyle: 'medium' }).format(it.updated)}`;
  else {
    const filled = (it.fields || []).filter(f => f.v).slice(0, 2).map(f => f.v).join(' · ');
    sub = filled || `${(it.fields || []).length} Felder`;
  }
  const chips = (it.tags || []).slice(0, 3).map(t => `<span class="chip">${esc(t)}</span>`).join('');
  const star = it.trashed ? '' : `<button class="star ${it.fav ? 'on' : ''}" data-act="fav" aria-label="Favorit">${icon('star')}</button>`;
  return `<div class="card glass" data-id="${it.id}" tabindex="0" style="animation-delay:${Math.min(i, 14) * 25}ms">
    ${thumb}${star}<div class="txt"><h3>${esc(it.title || 'Ohne Titel')}</h3><p>${esc(sub)}</p>${chips ? `<div class="chips">${chips}</div>` : ''}</div></div>`;
}

function renderList() {
  const items = visibleItems();
  const sec = SECTIONS.find(s => s.id === S.section);
  $('#title').textContent = S.tag ? `# ${S.tag}` : sec.label;
  $('#count').textContent = items.length + (items.length === 1 ? ' Eintrag' : ' Einträge');
  $('#emptyTrash').hidden = !(S.section === 'trash' && items.length);
  const c = $('#content');
  if (!items.length) {
    let h, p, btns = '';
    if (S.q) { h = 'Nichts gefunden'; p = 'Versuche einen anderen Suchbegriff.'; }
    else if (S.section === 'trash') { h = 'Papierkorb ist leer'; p = 'Gelöschte Einträge landen zuerst hier.'; }
    else if (S.section === 'fav') { h = 'Noch keine Favoriten'; p = 'Tippe auf den Stern an einem Eintrag, um ihn hier anzuheften.'; }
    else if (S.tag) { h = 'Keine Einträge mit diesem Tag'; p = ''; }
    else {
      h = 'Dein Tresor ist leer';
      p = 'Lege Dokumente ab oder erfasse Daten wie Verträge, Kontakte und Konten. Alles wird nur lokal in deinem Browser gespeichert.';
      btns = `<div class="row"><button class="pill primary" data-act="upload">${icon('upload')}Dokument hochladen</button><button class="pill" data-act="newdata">${icon('data')}Datensatz anlegen</button></div>`;
    }
    c.className = '';
    c.innerHTML = `<div class="empty glass"><div class="badge b-data">${icon(S.section === 'trash' ? 'trash' : 'shield')}</div><h2>${esc(h)}</h2><p>${esc(p)}</p>${btns}</div>`;
    return;
  }
  c.className = S.layout === 'grid' ? 'grid' : 'list';
  c.innerHTML = items.map(cardHTML).join('');
}

function renderAll() { renderNav(); renderList(); }

/* ---------- Speichern ---------- */
let saveTimer = null;
async function persist(it) {
  it.updated = Date.now();
  try {
    await dbPut(it);
    if (!S.persistAsked && navigator.storage && navigator.storage.persist) {
      S.persistAsked = true;
      navigator.storage.persist().catch(() => {});
    }
  } catch (e) {
    toast(e && e.name === 'QuotaExceededError' ? 'Speicher voll – bitte Platz schaffen.' : 'Speichern fehlgeschlagen.');
    throw e;
  }
}
function newItem(kind, extra) {
  const now = Date.now();
  return Object.assign({ id: uid(), kind, title: '', notes: '', tags: [], fields: [], fav: false, trashed: false, created: now, updated: now }, extra || {});
}
async function addFiles(files) {
  const list = Array.from(files || []);
  if (!list.length) return;
  let n = 0, last = null;
  for (const f of list) {
    const it = newItem('doc', {
      title: baseName(f.name),
      file: { name: f.name, type: f.type || 'application/octet-stream', size: f.size, blob: f }
    });
    try { await persist(it); S.items.push(it); last = it; n++; } catch (e) { break; }
  }
  if (n) {
    S.section = S.section === 'data' || S.section === 'trash' ? 'all' : S.section;
    renderAll();
    toast(n === 1 ? 'Dokument gespeichert' : `${n} Dokumente gespeichert`);
    if (n === 1 && last) openDetail(last.id);
  }
}
async function addData(tplId) {
  const t = TEMPLATES.find(x => x.id === tplId) || TEMPLATES[0];
  const it = newItem('data', { title: t.title, fields: t.fields.map(k => ({ k, v: '' })) });
  try { await persist(it); } catch (e) { return; }
  S.items.push(it);
  if (S.section === 'doc' || S.section === 'trash') S.section = 'all';
  renderAll();
  openDetail(it.id, true);
}

/* ---------- Detail ---------- */
function collect() {
  const it = byId(S.openId);
  if (!it) return null;
  const d = $('#detail');
  const title = $('.d-title', d); if (title) it.title = title.value.trim() || 'Ohne Titel';
  const notes = $('.ta', d); if (notes) it.notes = notes.value;
  it.fields = Array.from(d.querySelectorAll('.frow')).map(r => ({ k: $('.fk', r).value, v: $('.fv', r).value }));
  return it;
}
function queueSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    const it = collect();
    if (!it) return;
    try { await persist(it); } catch (e) { return; }
    renderAll();
  }, 350);
}
async function flushSave() {
  if (!saveTimer) return;
  clearTimeout(saveTimer); saveTimer = null;
  const it = collect();
  if (it) { try { await persist(it); } catch (e) { /* Meldung kam bereits */ } }
}

async function previewHTML(it) {
  if (it.kind !== 'doc' || !it.file) return '';
  const f = it.file, type = f.type || '';
  if (/^image\//.test(type)) return `<div class="preview"><img src="${urlFor(it)}" alt="${esc(f.name)}"></div>`;
  if (type === 'application/pdf') return `<div class="preview"><iframe src="${urlFor(it)}" title="${esc(f.name)}"></iframe></div>`;
  if (/^text\//.test(type) || /json|xml|csv|markdown/.test(type) || /\.(txt|md|csv|json|log|xml)$/i.test(f.name)) {
    try {
      const txt = await f.blob.slice(0, 20000).text();
      return `<div class="preview"><pre>${esc(txt)}${f.size > 20000 ? '\n…' : ''}</pre></div>`;
    } catch (e) { /* weiter */ }
  }
  return `<div class="preview"><div class="badge b-doc">${esc(ext(f.name))}</div></div>`;
}
function fieldRow(f) {
  return `<div class="frow"><input class="inp fk" placeholder="Feld" value="${esc(f.k)}"><input class="inp fv" placeholder="Wert" value="${esc(f.v)}">
    <button class="mini" data-d="copy" aria-label="Kopieren">${icon('copy')}</button><button class="mini" data-d="rmfield" aria-label="Feld entfernen">${icon('close')}</button></div>`;
}
async function openDetail(id, focusTitle) {
  await flushSave();
  const it = byId(id);
  if (!it) return;
  S.openId = id;
  const d = $('#detail');
  const prev = await previewHTML(it);
  const meta = [
    it.kind === 'doc' && it.file ? `${esc(it.file.name)} · ${fmtSize(it.file.size)}` : 'Datensatz',
    `Erstellt ${fmtDate(it.created)}`, `Geändert ${fmtDate(it.updated)}`
  ].join('<br>');
  d.innerHTML = `
    <div class="d-head"><input class="d-title" value="${esc(it.title)}" aria-label="Titel"><button class="round" data-d="close" aria-label="Schließen">${icon('close')}</button></div>
    <div class="d-body">
      ${prev}
      <div class="meta">${meta}</div>
      <div class="sec"><h4>Tags</h4><div class="tagbox" id="tagbox">${(it.tags || []).map(t => `<span class="chip">${esc(t)}<button data-d="rmtag" data-t="${esc(t)}" aria-label="Tag entfernen">${icon('close')}</button></span>`).join('')}<input id="tagIn" placeholder="Tag hinzufügen…" maxlength="30"></div></div>
      <div class="sec"><h4>Felder<button data-d="addfield">${icon('plus')}Feld</button></h4><div id="fields">${(it.fields || []).map(fieldRow).join('')}</div></div>
      <div class="sec"><h4>Notizen</h4><textarea class="ta" placeholder="Notizen…">${esc(it.notes)}</textarea></div>
    </div>
    <div class="d-foot">
      ${it.trashed
        ? `<button class="pill" data-d="restore">${icon('restore')}Wiederherstellen</button><button class="pill danger" data-d="purge">${icon('trash')}Endgültig löschen</button>`
        : `<button class="pill" data-d="fav">${icon('star')}${it.fav ? 'Entfernen' : 'Favorit'}</button>${it.kind === 'doc' ? `<button class="pill" data-d="download">${icon('download')}Laden</button>` : ''}<button class="pill danger" data-d="trash">${icon('trash')}Löschen</button>`}
    </div>`;
  d.classList.add('open'); d.setAttribute('aria-hidden', 'false');
  $('#scrim').classList.add('open');
  if (focusTitle) { const t = $('.d-title', d); t.focus(); t.select(); }
}
async function closeDetail() {
  await flushSave();
  S.openId = null;
  const d = $('#detail');
  d.classList.remove('open'); d.setAttribute('aria-hidden', 'true');
  $('#scrim').classList.remove('open');
  renderAll();
}
function downloadBlob(blob, name) {
  const u = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = u; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 4000);
}

async function detailAction(act, el) {
  const it = collect();
  if (!it) return;
  if (act === 'close') return closeDetail();
  if (act === 'copy') {
    const v = el.closest('.frow').querySelector('.fv').value;
    try { await navigator.clipboard.writeText(v); toast('Kopiert'); } catch (e) { toast('Kopieren nicht möglich'); }
    return;
  }
  if (act === 'rmfield') {
    el.closest('.frow').remove(); collect(); queueSave(); return;
  }
  if (act === 'addfield') {
    $('#fields').insertAdjacentHTML('beforeend', fieldRow({ k: '', v: '' }));
    const rows = document.querySelectorAll('#fields .fk'); rows[rows.length - 1].focus(); return;
  }
  if (act === 'rmtag') {
    it.tags = it.tags.filter(t => t !== el.dataset.t);
    await persist(it); await openDetail(it.id); renderAll(); return;
  }
  if (act === 'fav') { it.fav = !it.fav; await persist(it); await openDetail(it.id); renderAll(); return; }
  if (act === 'download') { downloadBlob(it.file.blob, it.file.name); return; }
  if (act === 'trash') { it.trashed = true; await persist(it); toast('In den Papierkorb verschoben'); await closeDetail(); return; }
  if (act === 'restore') { it.trashed = false; await persist(it); toast('Wiederhergestellt'); await closeDetail(); return; }
  if (act === 'purge') {
    if (!confirm('Diesen Eintrag endgültig löschen?')) return;
    clearTimeout(saveTimer); saveTimer = null;
    await dbDel(it.id); dropUrl(it.id);
    S.items = S.items.filter(x => x.id !== it.id);
    toast('Endgültig gelöscht');
    S.openId = null; await closeDetail();
  }
}

/* ---------- Backup ---------- */
const blobToDataURL = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(b); });
async function exportBackup() {
  if (!S.items.length) return toast('Es gibt noch nichts zu sichern');
  toast('Backup wird erstellt…');
  const out = [];
  for (const it of S.items) {
    const copy = Object.assign({}, it);
    if (it.file && it.file.blob) copy.file = { name: it.file.name, type: it.file.type, size: it.file.size, data: await blobToDataURL(it.file.blob) };
    out.push(copy);
  }
  const json = JSON.stringify({ app: 'tresor-glass', version: 1, exported: new Date().toISOString(), items: out });
  downloadBlob(new Blob([json], { type: 'application/json' }), `tresor-backup-${new Date().toISOString().slice(0, 10)}.json`);
  toast('Backup gespeichert');
}
async function importBackup(file) {
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!data || data.app !== 'tresor-glass' || !Array.isArray(data.items)) throw new Error('format');
    let n = 0;
    for (const raw of data.items) {
      if (!raw || !raw.id || !raw.kind) continue;
      const it = Object.assign(newItem(raw.kind), raw);
      if (raw.file && raw.file.data) {
        const blob = await (await fetch(raw.file.data)).blob();
        it.file = { name: raw.file.name, type: raw.file.type, size: raw.file.size, blob };
      }
      await dbPut(it);
      dropUrl(it.id);
      const idx = S.items.findIndex(x => x.id === it.id);
      if (idx >= 0) S.items[idx] = it; else S.items.push(it);
      n++;
    }
    renderAll();
    toast(`${n} Einträge importiert`);
  } catch (e) {
    toast('Datei konnte nicht importiert werden');
  }
}

/* ---------- Menüs ---------- */
function showMenu(anchor, html) {
  const m = $('#menu');
  m.innerHTML = html;
  const r = anchor.getBoundingClientRect();
  m.style.top = (r.bottom + 8) + 'px';
  m.style.right = Math.max(12, window.innerWidth - r.right) + 'px';
  m.style.left = 'auto';
  m.classList.add('open');
}
const hideMenu = () => $('#menu').classList.remove('open');
function newMenu(anchor) {
  showMenu(anchor,
    `<button data-m="upload">${icon('upload')}Dokument hochladen…</button><hr><div class="lab">Neuer Datensatz</div>` +
    TEMPLATES.map(t => `<button data-m="tpl" data-t="${t.id}">${icon(t.icon)}${esc(t.label)}</button>`).join(''));
}
function moreMenu(anchor) {
  showMenu(anchor, `<button data-m="export">${icon('download')}Backup exportieren</button><button data-m="import">${icon('upload')}Backup importieren</button>`);
}

/* ---------- Design ---------- */
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  $('#themeBtn').innerHTML = icon(t === 'dark' ? 'sun' : 'moon');
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.content = t === 'dark' ? '#0b0d1c' : '#cfe0ff';
}
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* ignorieren */ } };

function setLayout(l) {
  S.layout = l; lsSet('tresor-layout', l);
  $('#vGrid').classList.toggle('on', l === 'grid');
  $('#vList').classList.toggle('on', l === 'list');
  renderList();
}

/* ---------- Events ---------- */
function bind() {
  $('#logo').innerHTML = icon('shield');
  $('#icSearch').innerHTML = icon('search');
  $('#icPlus').innerHTML = icon('plus');
  $('#vGrid').innerHTML = icon('all');
  $('#vList').innerHTML = icon('list');
  $('#moreBtn').innerHTML = icon('dots');

  $('#side').addEventListener('click', e => {
    const b = e.target.closest('.nav'); if (!b) return;
    if (b.dataset.tag !== undefined) { S.tag = S.tag === b.dataset.tag ? null : b.dataset.tag; S.section = 'all'; }
    else { S.section = b.dataset.sec; S.tag = null; }
    renderAll();
  });
  $('#content').addEventListener('click', e => {
    const act = e.target.closest('[data-act]');
    if (act) {
      const a = act.dataset.act;
      if (a === 'upload') return $('#fileIn').click();
      if (a === 'newdata') return addData('blank');
      if (a === 'fav') {
        e.stopPropagation();
        const it = byId(act.closest('.card').dataset.id);
        if (it) { it.fav = !it.fav; persist(it).then(renderAll).catch(() => {}); }
        return;
      }
    }
    const card = e.target.closest('.card');
    if (card) openDetail(card.dataset.id);
  });
  $('#content').addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('card')) { e.preventDefault(); openDetail(e.target.dataset.id); }
  });
  $('#q').addEventListener('input', e => { S.q = e.target.value.trim(); renderList(); });
  $('#sort').addEventListener('change', e => { S.sort = e.target.value; lsSet('tresor-sort', S.sort); renderList(); });
  $('#vGrid').addEventListener('click', () => setLayout('grid'));
  $('#vList').addEventListener('click', () => setLayout('list'));
  $('#themeBtn').addEventListener('click', () => {
    const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    lsSet('tresor-theme', t); applyTheme(t);
  });
  $('#newBtn').addEventListener('click', e => { e.stopPropagation(); newMenu(e.currentTarget); });
  $('#moreBtn').addEventListener('click', e => { e.stopPropagation(); moreMenu(e.currentTarget); });
  $('#emptyTrash').addEventListener('click', async () => {
    const trashed = S.items.filter(i => i.trashed);
    if (!trashed.length || !confirm(`${trashed.length} Einträge endgültig löschen?`)) return;
    for (const it of trashed) { await dbDel(it.id); dropUrl(it.id); }
    S.items = S.items.filter(i => !i.trashed);
    renderAll(); toast('Papierkorb geleert');
  });

  $('#menu').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    hideMenu();
    const m = b.dataset.m;
    if (m === 'upload') $('#fileIn').click();
    if (m === 'tpl') addData(b.dataset.t);
    if (m === 'export') exportBackup();
    if (m === 'import') $('#importIn').click();
  });
  document.addEventListener('click', e => { if (!e.target.closest('#menu')) hideMenu(); });

  $('#fileIn').addEventListener('change', e => { addFiles(e.target.files); e.target.value = ''; });
  $('#importIn').addEventListener('change', e => { importBackup(e.target.files[0]); e.target.value = ''; });

  const d = $('#detail');
  d.addEventListener('click', e => { const b = e.target.closest('[data-d]'); if (b) detailAction(b.dataset.d, b); });
  d.addEventListener('input', e => { if (e.target.matches('.d-title, .ta, .fk, .fv')) queueSave(); });
  d.addEventListener('keydown', async e => {
    if (e.target.id !== 'tagIn') return;
    if (e.key === 'Enter' || e.key === ',') {
      e.preventDefault();
      const v = e.target.value.trim().replace(/,/g, '');
      const it = collect();
      if (v && it && !it.tags.includes(v)) {
        it.tags.push(v); await persist(it); await openDetail(it.id); renderAll();
        $('#tagIn').focus();
      }
    } else if (e.key === 'Backspace' && !e.target.value) {
      const it = collect();
      if (it && it.tags.length) { it.tags.pop(); await persist(it); await openDetail(it.id); renderAll(); $('#tagIn').focus(); }
    }
  });
  $('#scrim').addEventListener('click', closeDetail);

  document.addEventListener('keydown', e => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
    if (e.key === 'Escape') { hideMenu(); if (S.openId) closeDetail(); }
    if (e.key === '/' && !typing) { e.preventDefault(); $('#q').focus(); }
  });

  // Drag & Drop
  let depth = 0;
  const hasFiles = e => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
  window.addEventListener('dragenter', e => { if (hasFiles(e)) { depth++; $('#drop').classList.add('on'); } });
  window.addEventListener('dragleave', e => { if (hasFiles(e) && --depth <= 0) { depth = 0; $('#drop').classList.remove('on'); } });
  window.addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
  window.addEventListener('drop', e => {
    if (!hasFiles(e)) return;
    e.preventDefault(); depth = 0; $('#drop').classList.remove('on');
    addFiles(e.dataTransfer.files);
  });

  const mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  if (mq && mq.addEventListener) mq.addEventListener('change', e => { if (!lsGet('tresor-theme')) applyTheme(e.matches ? 'dark' : 'light'); });
}

/* ---------- Start ---------- */
async function init() {
  const mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  applyTheme(lsGet('tresor-theme') || (mq && mq.matches ? 'dark' : 'light'));
  const sort = lsGet('tresor-sort'); if (sort && ['updated', 'created', 'name', 'size'].includes(sort)) { S.sort = sort; $('#sort').value = sort; }
  const lay = lsGet('tresor-layout'); if (lay === 'list') S.layout = 'list';
  bind();
  $('#vGrid').classList.toggle('on', S.layout === 'grid');
  $('#vList').classList.toggle('on', S.layout === 'list');
  try {
    db = await openDB();
    S.items = await dbAll();
  } catch (e) {
    $('#content').innerHTML = `<div class="empty glass"><h2>Speicher nicht verfügbar</h2><p>Dein Browser blockiert die lokale Datenbank (z. B. im privaten Modus). Öffne die Seite in einem normalen Fenster.</p></div>`;
    return;
  }
  renderAll();
}
init();
})();
</script>
</body>
</html>
