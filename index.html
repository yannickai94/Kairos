<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#cfe0ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="YannickAI">
<title>YannickAI – Dein digitaler Zwilling</title>
<style>

:root{
  --text:#16161d; --text2:rgba(22,22,29,.62); --text3:rgba(22,22,29,.4);
  --glass:rgba(255,255,255,.5); --glass-hi:rgba(255,255,255,.78); --glass-lo:rgba(255,255,255,.28);
  --stroke:rgba(255,255,255,.75); --hair:rgba(20,20,40,.08);
  --accent:#0a84ff; --accent2:#5e5ce6; --danger:#ff3b30; --ok:#30d158; --gold:#ffb400;
  --shadow:0 18px 50px rgba(40,50,110,.16), 0 2px 6px rgba(40,50,110,.06);
  --bg-a:#cfe0ff; --bg-b:#f3dcff; --bg-c:#d8fff0;
  --orb1:#6aa8ff; --orb2:#c58cff; --orb3:#5ee6c0; --orb4:#ffb38a;
  --field:rgba(255,255,255,.55);
  color-scheme:light;
}
[data-theme="dark"]{
  --text:#f3f3f8; --text2:rgba(243,243,248,.64); --text3:rgba(243,243,248,.4);
  --glass:rgba(38,40,58,.46); --glass-hi:rgba(70,74,100,.55); --glass-lo:rgba(255,255,255,.06);
  --stroke:rgba(255,255,255,.17); --hair:rgba(255,255,255,.09);
  --accent:#4da3ff; --accent2:#8e8cff;
  --shadow:0 18px 50px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.3);
  --bg-a:#0b0d1c; --bg-b:#160d26; --bg-c:#08202a;
  --orb1:#2a5fd1; --orb2:#7b3fd6; --orb3:#13917a; --orb4:#c2603a;
  --field:rgba(255,255,255,.07);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--text);
  background:linear-gradient(135deg,var(--bg-a),var(--bg-b) 55%,var(--bg-c));
  background-attachment:fixed;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  letter-spacing:-.005em;
}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
svg.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Hintergrund-Orbs */
.orbs{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.75;animation:float 26s ease-in-out infinite}
.orb.o1{width:46vmax;height:46vmax;background:var(--orb1);left:-12vmax;top:-14vmax}
.orb.o2{width:38vmax;height:38vmax;background:var(--orb2);right:-10vmax;top:6vmax;animation-delay:-8s}
.orb.o3{width:42vmax;height:42vmax;background:var(--orb3);left:18vmax;bottom:-22vmax;animation-delay:-15s}
.orb.o4{width:24vmax;height:24vmax;background:var(--orb4);right:8vmax;bottom:-8vmax;opacity:.5;animation-delay:-4s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(4vmax,3vmax) scale(1.08)}66%{transform:translate(-3vmax,5vmax) scale(.95)}}
@media (prefers-reduced-motion:reduce){.orb{animation:none}*{transition:none!important}}

/* Glas */
.glass{
  position:relative;
  background:linear-gradient(145deg,var(--glass-hi),var(--glass) 38%,var(--glass-lo));
  -webkit-backdrop-filter:blur(30px) saturate(190%);
  backdrop-filter:blur(30px) saturate(190%);
  border:1px solid var(--stroke);
  box-shadow:var(--shadow), inset 0 1.5px 0 rgba(255,255,255,.55), inset 0 -1px 0 rgba(255,255,255,.08);
}
[data-theme="dark"] .glass{box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.2), inset 0 -1px 0 rgba(255,255,255,.03)}
.glass::before{ /* Lichtreflex */
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(120% 70% at 12% 0%,rgba(255,255,255,.55),rgba(255,255,255,0) 55%);
  opacity:.5;mix-blend-mode:soft-light;
}
[data-theme="dark"] .glass::before{opacity:.28}

/* Layout */
.app{position:relative;z-index:1;height:100dvh;display:grid;grid-template-columns:272px minmax(0,1fr);gap:16px;
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.side{border-radius:30px;padding:18px 14px;display:flex;flex-direction:column;gap:6px;overflow:auto;min-height:0}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 14px}
.logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;font-size:20px;
  background:linear-gradient(145deg,#5ab0ff,#6a5cff);box-shadow:0 6px 16px rgba(60,90,255,.4), inset 0 1px 0 rgba(255,255,255,.5)}
.brand b{font-size:19px;font-weight:700;letter-spacing:-.02em}
.brand small{display:block;color:var(--text2);font-size:12px;margin-top:1px}
.nav-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);padding:14px 12px 4px}
.nav{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:10px 12px;border-radius:14px;font-size:15px;font-weight:500;color:var(--text);transition:background .2s,transform .15s}
.nav:hover{background:var(--glass-lo)}
.nav:active{transform:scale(.98)}
.nav .i{font-size:19px;color:var(--text2)}
.nav .n{margin-left:auto;font-size:12.5px;color:var(--text2);font-variant-numeric:tabular-nums}
.nav.on{background:linear-gradient(145deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 18px rgba(40,90,255,.35), inset 0 1px 0 rgba(255,255,255,.35)}
.nav.on .i,.nav.on .n{color:rgba(255,255,255,.9)}
.side-foot{margin-top:auto;padding:14px 10px 2px;font-size:12px;color:var(--text2);line-height:1.5}
.side-foot .bar{height:5px;border-radius:9px;background:var(--glass-lo);margin:8px 0 6px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--hair)}
.side-foot .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:9px;transition:width .5s}

.main{display:flex;flex-direction:column;gap:14px;min-width:0;min-height:0}
.toolbar{border-radius:24px;padding:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.search{flex:1 1 220px;display:flex;align-items:center;gap:9px;padding:0 14px;height:42px;border-radius:15px;background:var(--field);box-shadow:inset 0 0 0 1px var(--hair), inset 0 1px 3px rgba(0,0,0,.05)}
.search .i{color:var(--text2)}
.search input{flex:1;min-width:0;border:0;background:none;outline:0;font-size:15.5px}
.search input::placeholder{color:var(--text3)}
.search kbd{font:12px/1 inherit;color:var(--text3);border:1px solid var(--hair);border-radius:6px;padding:3px 6px}
.pill,.sel{height:42px;border-radius:15px;padding:0 14px;display:inline-flex;align-items:center;gap:8px;font-size:14.5px;font-weight:500;background:var(--field);box-shadow:inset 0 0 0 1px var(--hair);transition:transform .15s,background .2s}
.pill:hover,.sel:hover{background:var(--glass-hi)}
.pill:active{transform:scale(.97)}
.sel{appearance:none;-webkit-appearance:none;outline:0;border:0;padding-right:14px;cursor:pointer}
.sel:focus-visible,.pill:focus-visible,.nav:focus-visible,.round:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sel option{color:#111}
.seg{display:inline-flex;padding:3px;border-radius:15px;background:var(--field);box-shadow:inset 0 0 0 1px var(--hair)}
.seg button{width:38px;height:36px;border-radius:12px;display:grid;place-items:center;color:var(--text2);transition:.2s}
.seg button.on{background:var(--glass-hi);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.12), inset 0 1px 0 rgba(255,255,255,.5)}
.primary{background:linear-gradient(145deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 8px 20px rgba(50,90,255,.38), inset 0 1px 0 rgba(255,255,255,.4)}
.primary:hover{background:linear-gradient(145deg,var(--accent),var(--accent2));filter:brightness(1.07)}
.danger{color:var(--danger)}

.head{display:flex;align-items:baseline;gap:12px;padding:0 6px}
.head h1{margin:0;font-size:30px;font-weight:700;letter-spacing:-.03em}
.head span{color:var(--text2);font-size:15px}
.head .sp{flex:1}
.scroll{flex:1;min-height:0;overflow:auto;padding:4px 4px 24px;margin:0 -4px;scrollbar-width:thin;scrollbar-color:var(--hair) transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{border-radius:24px;padding:12px;display:flex;flex-direction:column;gap:10px;text-align:left;cursor:pointer;transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s;animation:pop .4s cubic-bezier(.2,.8,.2,1) both}
.card:hover{transform:translateY(-3px) scale(1.012)}
.card:active{transform:scale(.985)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.thumb{height:118px;border-radius:16px;overflow:hidden;display:grid;place-items:center;background:var(--field);box-shadow:inset 0 0 0 1px var(--hair)}
.thumb img{width:100%;height:100%;object-fit:cover}
.badge{min-width:62px;height:62px;padding:0 10px;border-radius:19px;display:grid;place-items:center;font-weight:700;font-size:14px;letter-spacing:.03em;color:#fff;box-shadow:0 8px 20px rgba(0,0,0,.2), inset 0 1px 0 rgba(255,255,255,.45)}
.badge .i{font-size:28px}
.b-doc{background:linear-gradient(145deg,#ff9f43,#ff5e62)}
.b-data{background:linear-gradient(145deg,#4db8ff,#6a5cff)}
.card h3{margin:0;font-size:15.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.card p{margin:0;font-size:13px;color:var(--text2);padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:5px;flex-wrap:wrap;padding:0 4px}
.chip{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--glass-lo);box-shadow:inset 0 0 0 1px var(--hair);color:var(--text2)}
.star{position:absolute;top:18px;right:18px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(0,0,0,.22);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:.2s}
.star.on{color:var(--gold);background:rgba(255,255,255,.85)}
.star.on svg{fill:var(--gold)}
.star:hover{transform:scale(1.12)}
.list{display:flex;flex-direction:column;gap:10px}
.list .card{flex-direction:row;align-items:center;gap:14px;padding:10px 16px 10px 10px;border-radius:22px}
.list .card:hover{transform:translateX(3px)}
.list .thumb{width:58px;height:58px;flex:none;border-radius:16px}
.list .badge{min-width:46px;height:46px;border-radius:15px;font-size:12px}
.list .badge .i{font-size:22px}
.list .txt{flex:1;min-width:0}
.list .chips{margin-top:5px}
.list .star{position:static;order:3;color:var(--text2);background:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.list .star.on{background:none;color:var(--gold)}

.empty{margin:8vh auto 0;max-width:420px;text-align:center;padding:36px 28px;border-radius:32px}
.empty .badge{margin:0 auto 18px;width:76px;height:76px;border-radius:24px}
.empty h2{margin:0 0 8px;font-size:23px;letter-spacing:-.02em}
.empty p{margin:0 0 20px;color:var(--text2);line-height:1.5;font-size:15px}
.empty .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* Menü */
.menu{position:fixed;z-index:30;min-width:240px;border-radius:22px;padding:8px;opacity:0;transform:translateY(-6px) scale(.97);transform-origin:top right;pointer-events:none;transition:.18s}
.menu.open{opacity:1;transform:none;pointer-events:auto}
.menu button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 12px;border-radius:14px;font-size:15px}
.menu button:hover{background:var(--glass-lo)}
.menu .i{color:var(--accent);font-size:18px}
.menu hr{border:0;border-top:1px solid var(--hair);margin:6px 8px}
.menu .lab{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);padding:8px 12px 4px}

/* Detail */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(10,14,40,.18);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:.25s}
.scrim.open{opacity:1;pointer-events:auto}
.detail{position:fixed;z-index:25;top:max(14px,env(safe-area-inset-top));bottom:max(14px,env(safe-area-inset-bottom));right:max(14px,env(safe-area-inset-right));width:min(480px,calc(100vw - 28px));border-radius:32px;
  display:flex;flex-direction:column;transform:translateX(115%);transition:transform .45s cubic-bezier(.2,.9,.25,1);overflow:hidden}
.detail.open{transform:none}
.d-head{display:flex;align-items:center;gap:10px;padding:18px 18px 10px}
.d-title{flex:1;min-width:0;border:0;outline:0;background:none;font-size:23px;font-weight:700;letter-spacing:-.02em;padding:4px 6px;border-radius:10px}
.d-title:focus{background:var(--field)}
.round{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--field);box-shadow:inset 0 0 0 1px var(--hair);transition:.2s;flex:none}
.round:hover{background:var(--glass-hi);transform:scale(1.08)}
.d-body{flex:1;overflow:auto;padding:4px 18px 18px;display:flex;flex-direction:column;gap:16px;scrollbar-width:thin}
.preview{border-radius:20px;overflow:hidden;background:var(--field);box-shadow:inset 0 0 0 1px var(--hair);display:grid;place-items:center;min-height:120px}
.preview img{max-width:100%;max-height:300px;display:block}
.preview iframe{width:100%;height:340px;border:0;background:#fff}
.preview pre{margin:0;padding:14px;width:100%;max-height:260px;overflow:auto;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;word-break:break-word}
.preview .badge{margin:26px}
.meta{font-size:12.5px;color:var(--text2);line-height:1.6;padding:0 4px}
.sec h4{margin:0 0 8px 4px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--text2);display:flex;align-items:center}
.sec h4 button{margin-left:auto;color:var(--accent);font-size:13px;text-transform:none;letter-spacing:0;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.frow{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1.4fr) auto auto;gap:6px;margin-bottom:6px}
.inp,.ta{width:100%;border:0;outline:0;border-radius:14px;padding:11px 13px;font-size:15px;background:var(--field);box-shadow:inset 0 0 0 1px var(--hair), inset 0 1px 3px rgba(0,0,0,.04);transition:box-shadow .2s}
.inp:focus,.ta:focus{box-shadow:inset 0 0 0 1.5px var(--accent), 0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent)}
.fk{font-weight:600;color:var(--text2)}
.mini{width:38px;border-radius:12px;display:grid;place-items:center;color:var(--text2);background:var(--field);box-shadow:inset 0 0 0 1px var(--hair)}
.mini:hover{color:var(--text);background:var(--glass-hi)}
.ta{min-height:120px;resize:vertical;line-height:1.5}
.tagbox{display:flex;flex-wrap:wrap;gap:6px;padding:8px;border-radius:16px;background:var(--field);box-shadow:inset 0 0 0 1px var(--hair)}
.tagbox .chip{display:inline-flex;align-items:center;gap:4px;font-size:13px;padding:4px 6px 4px 11px;background:var(--glass-hi)}
.tagbox .chip button{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:var(--text2)}
.tagbox .chip button:hover{background:var(--hair)}
.tagbox input{flex:1;min-width:110px;border:0;outline:0;background:none;padding:5px 6px;font-size:14.5px}
.d-foot{display:flex;gap:8px;padding:12px 18px 18px;border-top:1px solid var(--hair);flex-wrap:wrap}
.d-foot .pill{flex:1;justify-content:center;min-width:110px}

/* Drop + Toast */
.drop{position:fixed;inset:12px;z-index:40;border-radius:36px;display:grid;place-items:center;font-size:24px;font-weight:700;letter-spacing:-.02em;border:2.5px dashed var(--accent);opacity:0;pointer-events:none;transition:.2s;
  background:color-mix(in srgb,var(--accent) 14%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.drop.on{opacity:1}
.toasts{position:fixed;z-index:50;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{padding:11px 20px;border-radius:99px;font-size:14.5px;font-weight:500;animation:pop .3s both}
.toast.out{opacity:0;transform:translateY(8px);transition:.3s}

/* Mobil */
@media (max-width:860px){
  body{overflow:auto}
  .app{height:100dvh;grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);gap:12px;padding:12px}
  .side{flex-direction:row;align-items:center;padding:8px;border-radius:24px;overflow-x:auto;overflow-y:hidden;gap:4px}
  .brand,.side-foot,.nav-label{display:none}
  #navMain,#navTags{display:contents}
  .nav{width:auto;flex:none;padding:9px 13px;white-space:nowrap}
  .nav .n{margin-left:2px}
  .toolbar{padding:8px;gap:8px}
  .search{flex:1 1 100%}
  .sel{flex:1;min-width:0}
  .head{flex-wrap:wrap;gap:4px 10px}
  .head h1{font-size:26px}
  .search kbd{display:none}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .thumb{height:96px}
  .detail{left:10px;right:10px;top:10px;bottom:10px;width:auto;border-radius:28px}
  .frow{grid-template-columns:1fr 1fr auto auto}
}

/* =====================================================================
   YANNICKAI – Spiel-Layout (überschreibt/ergänzt v1)
   ===================================================================== */
body{overflow:hidden}
:root{--ok:#30d158;--warn:#ffb400}
.app{grid-template-columns:260px minmax(0,1fr)}
.main{display:block;position:relative;gap:0}
.navwrap{display:flex;flex-direction:column;gap:4px}
.view{display:none;height:100%;min-height:0}
.view.on{display:flex;flex-direction:column;gap:14px}
.h-row{display:flex;align-items:center;gap:12px;padding:0 6px;flex-wrap:wrap}
.h-row h1{margin:0;font-size:30px;font-weight:700;letter-spacing:-.03em}
.h-row .sub{color:var(--text2);font-size:15px}
.h-row .sp{flex:1}

/* Sidebar-Spielerkarte */
.side-foot{margin-top:auto;padding:4px 2px 2px;font-size:12px;color:var(--text2)}
.player{border-radius:22px;padding:12px;background:var(--glass-lo);box-shadow:inset 0 0 0 1px var(--hair)}
.player .row{display:flex;align-items:center;gap:10px}
.lvbadge{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:18px;color:#fff;background:linear-gradient(145deg,#ffb400,#ff6b3d);box-shadow:0 6px 14px rgba(255,130,40,.4), inset 0 1px 0 rgba(255,255,255,.5)}
.player b{display:block;font-size:14.5px;color:var(--text)}
.player small{color:var(--text2);font-size:12px}
.bar{height:9px;border-radius:99px;background:var(--glass-lo);box-shadow:inset 0 0 0 1px var(--hair);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .7s cubic-bezier(.2,.8,.2,1)}
.bar.gold i{background:linear-gradient(90deg,#ffcf4a,#ff8a3d)}
.flame{color:#ff7a2f;display:inline-flex;align-items:center;gap:3px;font-weight:700}
.flame svg{fill:#ff9a3d;stroke:#ff6a1f}

/* Home */
.home{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(330px,.7fr);gap:16px}
.stage-card{position:relative;border-radius:34px;overflow:hidden;min-height:340px}
.stage-card canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:pan-y;cursor:grab;display:block}
.stage-card canvas:active{cursor:grabbing}
.stage-top{position:absolute;left:18px;top:16px;right:18px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;pointer-events:none;z-index:2}
.tag{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:99px;font-size:13.5px;font-weight:600;background:var(--glass-hi);box-shadow:inset 0 0 0 1px var(--stroke);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.bubble{position:absolute;left:50%;top:13%;transform:translate(-50%,6px) scale(.96);max-width:min(86%,380px);padding:12px 16px;border-radius:22px;font-size:15px;line-height:1.4;font-weight:500;text-align:center;opacity:0;transition:.35s;pointer-events:none;z-index:3}
.bubble.on{opacity:1;transform:translate(-50%,0) scale(1)}
.bubble::after{content:"";position:absolute;left:50%;bottom:-7px;width:14px;height:14px;transform:translateX(-50%) rotate(45deg);background:inherit;border-right:1px solid var(--stroke);border-bottom:1px solid var(--stroke);border-radius:0 0 5px 0}
.stage-actions{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:0 12px;z-index:2}
.stage-actions .pill{height:38px;font-size:13.5px;padding:0 13px}
.hint{position:absolute;right:16px;bottom:62px;font-size:12px;color:var(--text3);pointer-events:none;z-index:2}
.home-col{overflow:auto;display:flex;flex-direction:column;gap:14px;min-height:0;padding:0 4px 20px 0;scrollbar-width:thin}
.gcard{border-radius:26px;padding:16px 18px}
.gcard h3{margin:0 0 10px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text2);display:flex;align-items:center;gap:8px}
.gcard h3 .sp{flex:1}
.gcard h3 button{font-size:13px;text-transform:none;letter-spacing:0;color:var(--accent);font-weight:600}
.lvl-row{display:flex;align-items:center;gap:14px}
.lvl-big{width:62px;height:62px;border-radius:20px;font-size:28px}
.lvl-row b{font-size:21px;letter-spacing:-.02em}
.lvl-row small{display:block;color:var(--text2);font-size:13.5px;margin-top:2px}
.statrow{display:grid;grid-template-columns:86px 1fr 28px;gap:10px;align-items:center;font-size:14px;margin:8px 0}
.statrow .bar{margin:0}
.statrow span:last-child{color:var(--text2);text-align:right;font-variant-numeric:tabular-nums}
.sync-ring{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:84px;height:84px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:20px;letter-spacing:-.02em}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .bg{stroke:var(--glass-lo)}
.ring .fg{stroke:url(#grad);transition:stroke-dasharray .8s}
.muted{color:var(--text2);font-size:14px;line-height:1.5}
.cta{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.todo{display:flex;align-items:center;gap:12px;padding:9px 4px;border-radius:14px;cursor:pointer;font-size:15px}
.todo+.todo{border-top:1px solid var(--hair)}

/* Quests */
.qwrap{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:14px;padding:0 4px 24px 0}
.qgrid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px;align-items:start}
.qrow{display:flex;align-items:center;gap:13px;padding:11px 6px;border-radius:16px;transition:background .2s}
.qrow+.qrow{border-top:1px solid var(--hair)}
.qrow:hover{background:var(--glass-lo)}
.qcheck{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--field);box-shadow:inset 0 0 0 2px var(--hair);color:transparent;transition:.25s}
.qcheck:hover{box-shadow:inset 0 0 0 2px var(--accent)}
.qrow.done .qcheck{background:linear-gradient(145deg,#34d669,#12b886);color:#fff;box-shadow:0 6px 16px rgba(30,190,110,.4);transform:scale(1.05)}
.qrow.done .qt{text-decoration:line-through;color:var(--text3)}
.qemoji{font-size:24px;width:32px;text-align:center;flex:none}
.qinfo{flex:1;min-width:0}
.qt{font-size:15.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qm{display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--text2);margin-top:3px;flex-wrap:wrap}
.hist{display:inline-flex;gap:3px}
.hist i{width:8px;height:8px;border-radius:50%;background:var(--hair)}
.hist i.on{background:var(--ok)}
.xpchip{font-size:12px;font-weight:700;color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);padding:3px 9px;border-radius:99px}
.progress-head{display:flex;align-items:center;gap:16px}
.slider-row{display:grid;grid-template-columns:84px 1fr 24px;gap:10px;align-items:center;margin:10px 0;font-size:14.5px}
input[type=range]{width:100%;accent-color:var(--accent);height:28px}
.area-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}

/* Zwilling */
.twin{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:16px}
.panel{border-radius:30px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.panel-head{display:flex;align-items:center;gap:10px;padding:16px 18px 8px}
.panel-head h2{margin:0;font-size:19px;letter-spacing:-.02em}
.panel-head .sp{flex:1}
.tabs{display:inline-flex;padding:3px;border-radius:15px;background:var(--field);box-shadow:inset 0 0 0 1px var(--hair)}
.tabs button{padding:0 14px;height:34px;border-radius:12px;font-size:14px;font-weight:600;color:var(--text2);transition:.2s}
.tabs button.on{background:var(--glass-hi);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.12), inset 0 1px 0 rgba(255,255,255,.5)}
.chat-list{flex:1;min-height:0;overflow:auto;padding:8px 18px;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin}
.msg{max-width:86%;padding:11px 15px;border-radius:20px;font-size:15px;line-height:1.45;animation:pop .3s both;white-space:pre-wrap;word-wrap:break-word}
.msg.ai{align-self:flex-start;background:var(--glass-hi);box-shadow:inset 0 0 0 1px var(--stroke);border-bottom-left-radius:7px}
.msg.me{align-self:flex-end;color:#fff;background:linear-gradient(145deg,var(--accent),var(--accent2));box-shadow:0 6px 16px rgba(50,90,255,.3);border-bottom-right-radius:7px}
.msg .src{display:block;margin-top:7px;font-size:12px;color:var(--text2)}
.msg .snip{display:block;padding:8px 10px;margin-top:7px;border-radius:12px;background:var(--glass-lo);font-size:13.5px}
.msg .snip small{display:block;color:var(--text2);font-size:11.5px;margin-bottom:2px}
.suggest{display:flex;gap:7px;flex-wrap:wrap;padding:6px 18px}
.suggest button{padding:7px 13px;border-radius:99px;font-size:13px;font-weight:500;background:var(--field);box-shadow:inset 0 0 0 1px var(--hair)}
.suggest button:hover{background:var(--glass-hi)}
.composer{display:flex;gap:8px;padding:10px 14px 14px}
.composer .inp{flex:1}
.mem-list{flex:1;min-height:0;overflow:auto;padding:4px 18px 18px;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin}
.mem{padding:13px 15px;border-radius:20px;background:var(--glass-lo);box-shadow:inset 0 0 0 1px var(--hair);position:relative}
.mem .q{font-size:12.5px;color:var(--text2);margin-bottom:4px;font-weight:600}
.mem .a{font-size:15px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word}
.mem .acts{position:absolute;top:8px;right:8px;display:flex;gap:2px;opacity:0;transition:.2s}
.mem:hover .acts,.mem:focus-within .acts{opacity:1}
.mem .acts button{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--text2)}
.mem .acts button:hover{background:var(--hair);color:var(--text)}
.dq{margin:2px 18px 10px;padding:14px 16px;border-radius:22px;background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 16%,transparent),color-mix(in srgb,var(--accent2) 12%,transparent));box-shadow:inset 0 0 0 1px var(--stroke)}
.dq small{font-weight:700;text-transform:uppercase;letter-spacing:.07em;font-size:11px;color:var(--accent)}
.dq p{margin:5px 0 10px;font-size:16px;font-weight:600;line-height:1.35}
.dq .ta{min-height:76px}
.stars{display:inline-flex;gap:2px;color:var(--gold)}
.stars button{width:22px;height:22px;color:var(--text3)}
.stars button.on{color:var(--gold)}
.stars button.on svg{fill:var(--gold)}
.stars svg{width:100%;height:100%}

/* Look */
.lookwrap{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px}
.opts{overflow:auto;display:flex;flex-direction:column;gap:14px;min-height:0;padding:0 4px 20px 0;scrollbar-width:thin}
.opt-grid{display:flex;flex-wrap:wrap;gap:8px}
.opt{padding:9px 14px;border-radius:14px;font-size:14px;font-weight:600;background:var(--field);box-shadow:inset 0 0 0 1px var(--hair);display:inline-flex;align-items:center;gap:6px;transition:.2s}
.opt:hover{background:var(--glass-hi)}
.opt.on{background:linear-gradient(145deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 16px rgba(50,90,255,.3)}
.opt.lock{opacity:.5;cursor:not-allowed}
.opt .i{width:.95em;height:.95em}
.sw{width:38px;height:38px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.65), 0 3px 8px rgba(0,0,0,.18);transition:.2s;position:relative}
.sw.on{transform:scale(1.14);box-shadow:inset 0 0 0 2px #fff, 0 0 0 3px var(--accent), 0 6px 14px rgba(0,0,0,.25)}
.namebox{display:flex;gap:8px}

/* Profil */
.mewrap{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:14px;padding:0 4px 24px 0}
.megrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;align-items:start}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{padding:12px 14px;border-radius:18px;background:var(--glass-lo);box-shadow:inset 0 0 0 1px var(--hair)}
.kpi b{display:block;font-size:24px;letter-spacing:-.02em}
.kpi small{color:var(--text2);font-size:12.5px}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ach{padding:12px;border-radius:18px;background:var(--glass-lo);box-shadow:inset 0 0 0 1px var(--hair);display:flex;flex-direction:column;gap:4px}
.ach .e{font-size:26px}
.ach b{font-size:14px}
.ach small{font-size:12px;color:var(--text2);line-height:1.35}
.ach.lock{opacity:.45;filter:grayscale(1)}
.radar{width:100%;max-width:330px;margin:0 auto;display:block}
.radar text{font-size:11.5px;fill:var(--text2);font-weight:600}
.radar .grid{fill:none;stroke:var(--hair);stroke-width:1}
.radar .shape{fill:color-mix(in srgb,var(--accent) 28%,transparent);stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round}
.logrow{display:flex;gap:10px;font-size:13.5px;padding:6px 0;color:var(--text2)}
.logrow b{color:var(--accent);min-width:54px}
.danger-zone{display:flex;gap:8px;flex-wrap:wrap}

/* Modal */
.modal-wrap{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .25s;background:rgba(10,14,40,.3);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px)}
.modal-wrap.open{opacity:1;pointer-events:auto}
.modal{width:min(500px,100%);max-height:92dvh;overflow:auto;border-radius:32px;padding:22px;transform:translateY(16px) scale(.97);transition:transform .35s cubic-bezier(.2,.9,.25,1)}
.modal-wrap.open .modal{transform:none}
.modal h2{margin:0 0 6px;font-size:23px;letter-spacing:-.02em}
.modal p.lead{margin:0 0 16px;color:var(--text2);line-height:1.5;font-size:15px}
.m-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px;margin-top:12px;font-size:13px;font-weight:600;color:var(--text2)}
.pickgrid{display:flex;flex-direction:column;gap:8px;margin-top:6px;max-height:44vh;overflow:auto}
.pick{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:var(--field);box-shadow:inset 0 0 0 1px var(--hair);text-align:left;font-size:15px;transition:.2s}
.pick.on{box-shadow:inset 0 0 0 2px var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--field))}
.pick .e{font-size:22px}
.lvlup{text-align:center}
.lvlup .big{font-size:84px;font-weight:800;letter-spacing:-.04em;background:linear-gradient(145deg,#ffcf4a,#ff6b3d);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1;animation:pop .6s both}
.unlocks{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}

/* Intro */
.intro{position:fixed;inset:0;z-index:80;background:linear-gradient(135deg,var(--bg-a),var(--bg-b) 55%,var(--bg-c));transition:opacity .7s,transform .7s}
.intro[hidden]{display:none}
.intro.out{opacity:0;transform:scale(1.04);pointer-events:none}
.intro canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.intro-ui{position:absolute;left:0;right:0;bottom:max(5vh,26px);text-align:center;padding:0 20px;display:flex;flex-direction:column;align-items:center;gap:12px;pointer-events:none}
.intro-ui>*{pointer-events:auto}
.intro-ui h1{margin:0;font-size:clamp(40px,8vw,72px);font-weight:800;letter-spacing:-.04em;line-height:1;min-height:1em}
.intro-ui h1 span{display:inline-block;opacity:0;transform:translateY(20px) scale(.9);animation:letter .6s cubic-bezier(.2,.9,.25,1) forwards;background:linear-gradient(145deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes letter{to{opacity:1;transform:none}}
.intro-ui p{margin:0;color:var(--text2);font-size:17px;opacity:0;transition:opacity .8s}
.intro-ui p.on{opacity:1}
.intro-ui .pill{opacity:0;transform:translateY(8px);transition:.6s;height:50px;padding:0 28px;font-size:16.5px}
.intro-ui .pill.on{opacity:1;transform:none}
.skip{position:fixed;top:max(14px,env(safe-area-inset-top));right:16px;font-size:14px;color:var(--text2);padding:8px 12px;border-radius:99px;pointer-events:auto}
.intro-ui .skip{position:fixed}

.floater{position:fixed;left:50%;top:42%;z-index:70;transform:translateX(-50%);font-size:26px;font-weight:800;color:var(--accent);text-shadow:0 2px 12px rgba(255,255,255,.7);pointer-events:none;animation:floatup 1.5s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,10px) scale(.7)}15%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-70px) scale(1)}}
.toast.good{color:var(--ok)}

/* Tresor in Spiel-Layout */
.vault-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:0 6px}
.vault-bar .nav{width:auto;padding:8px 13px;font-size:14px;border-radius:13px}
.vault-bar .nav .i{font-size:17px}
.vault-scroll{flex:1;min-height:0;overflow:auto;padding:4px 4px 24px;margin:0 -4px;scrollbar-width:thin}

/* Mobil: Dock unten */
@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;gap:10px;padding:10px 10px max(10px,env(safe-area-inset-bottom))}
  .main{order:1}
  .side{order:2;flex-direction:row;padding:5px;border-radius:26px;overflow:visible;gap:0}
  .brand,.side-foot,.nav-label{display:none}
  #navMain{display:flex!important;width:100%;gap:2px}
  .nav{flex-direction:column;gap:3px;font-size:10.5px;padding:7px 2px;min-width:0;flex:1;justify-content:center;border-radius:20px;align-items:center}
  .nav .n{display:none}
  .nav .i{font-size:21px}
  .view.on{overflow:auto;gap:12px;padding-bottom:6px}
  .h-row h1{font-size:25px}
  .home{display:flex;flex-direction:column;flex:none;gap:12px;min-height:auto}
  .stage-card{flex:none;height:min(58vh,470px);min-height:320px}
  .home-col{overflow:visible;padding:0}
  .qwrap,.mewrap,.opts{overflow:visible;padding:0;flex:none}
  .qgrid{grid-template-columns:1fr}
  .twin{display:flex;flex-direction:column;flex:none}
  .panel{min-height:70vh}
  .lookwrap{display:flex;flex-direction:column;flex:none}
  .lookwrap .stage-card{height:min(46vh,400px)}
  .hint{display:none}
  .vault-scroll{overflow:visible;flex:none}
}
@media (max-width:520px){
  .statrow{grid-template-columns:70px 1fr 24px}
  .stage-actions .pill{padding:0 11px;font-size:13px}
}

/* Vault-Chips, mobile Tabs im Zwilling, Kleinigkeiten */
.vchip{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:13px;font-size:14px;font-weight:500;background:var(--field);box-shadow:inset 0 0 0 1px var(--hair);transition:.2s;white-space:nowrap}
.vchip:hover{background:var(--glass-hi)}
.vchip .i{font-size:16px;color:var(--text2)}
.vchip .n{font-size:12px;color:var(--text2);font-variant-numeric:tabular-nums}
.vchip.on{background:linear-gradient(145deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 16px rgba(50,90,255,.3), inset 0 1px 0 rgba(255,255,255,.35)}
.vchip.on .i,.vchip.on .n{color:rgba(255,255,255,.9)}
.vault-bar{overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px;scrollbar-width:none}
.vault-bar::-webkit-scrollbar{display:none}
.mobile-tabs{display:none}
.brand .round{width:34px;height:34px}
.chip{display:inline-flex;align-items:center}
.stage-card .tag .i{width:1em;height:1em}
.empty .badge{display:grid}
@media (max-width:860px){
  .mobile-tabs{display:inline-flex}
  .twin[data-tab="chat"] .tp-mem{display:none}
  .twin[data-tab="mem"] .tp-chat{display:none}
  .panel{min-height:68vh}
  .toolbar{padding:8px;gap:8px}
  .search{flex:1 1 100%}
  .sel{flex:1;min-width:0}
}

.intro-title{position:absolute;left:0;right:0;top:max(5vh,34px);text-align:center;padding:0 20px;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.intro-title h1{margin:0;font-size:clamp(38px,7.5vw,68px);font-weight:800;letter-spacing:-.04em;line-height:1;min-height:1em}
.intro-title h1 span{display:inline-block;opacity:0;transform:translateY(20px) scale(.9);animation:letter .6s cubic-bezier(.2,.9,.25,1) forwards;background:linear-gradient(145deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.intro-title p{margin:0;color:var(--text2);font-size:17px;opacity:0;transition:opacity .8s}
.intro-title p.on{opacity:1}
.intro-ui{bottom:max(3.5vh,22px)}
.skip{z-index:2}

@media (max-width:860px){
  #navMain{flex-direction:row!important;align-items:stretch}
  .view.on{overflow-x:hidden}
  .qgrid,.megrid{grid-template-columns:minmax(0,1fr)}
  .gcard,.panel,.stage-card{min-width:0}
  .stage-card{height:min(62vh,520px)}
  .stage-actions{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;scrollbar-width:none;padding:0 12px}
  .stage-actions::-webkit-scrollbar{display:none}
  .stage-actions .pill{flex:none}
  .bubble{top:62px;max-width:92%;font-size:14px;padding:10px 14px}
  .twin .panel{height:calc(100dvh - 250px);min-height:360px}
  .toasts{bottom:calc(92px + env(safe-area-inset-bottom))}
  .modal{padding:18px}
  .h-row .sp{display:none}
}

.bubble{width:max-content}
@media (max-width:860px){
  .qt{white-space:normal}
  .qm{gap:6px 10px}
}

</style>
</head>
<body>
<div class="orbs" aria-hidden="true"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div><div class="orb o4"></div></div>

<div class="app" id="app">
  <aside class="side glass" id="side">
    <div class="brand">
      <div class="logo" id="logo"></div>
      <div><b>YannickAI</b><small>Dein digitaler Zwilling</small></div>
    </div>
    <div id="navMain" class="navwrap"></div>
    <div class="side-foot" id="sideFoot"></div>
  </aside>

  <main class="main" id="main">
    <section class="view" id="v-home" aria-label="Home"></section>
    <section class="view" id="v-quests" aria-label="Quests"></section>
    <section class="view" id="v-twin" aria-label="Zwilling"></section>
    <section class="view" id="v-vault" aria-label="Tresor"></section>
    <section class="view" id="v-look" aria-label="Look"></section>
    <section class="view" id="v-me" aria-label="Profil"></section>
  </main>
</div>

<div class="intro" id="intro" hidden>
  <canvas id="introCanvas"></canvas>
  <div class="intro-title"><h1 id="introTitle" aria-label="YannickAI"></h1><p id="introSub">Dein digitaler Zwilling</p></div>
  <div class="intro-ui">
    <button class="pill primary" id="introGo">Los geht's</button>
  </div>
  <button class="skip" id="introSkip">Überspringen</button>
</div>

<div class="scrim" id="scrim"></div>
<div class="modal-wrap" id="modalWrap" aria-hidden="true"><div class="modal glass" id="modal" role="dialog" aria-modal="true"></div></div>
<aside class="detail glass" id="detail" aria-hidden="true"></aside>
<div class="menu glass" id="menu" role="menu"></div>

/* ---------- Toast ---------- */
function toast(msg, cls) {
  const t = document.createElement('div');
  t.className = 'toast glass' + (cls ? ' ' + cls : '');
  t.textContent = msg;
  $('#toasts').appendChild(t);
  setTimeout(() => t.classList.add('out'), 2600);
  setTimeout(() => t.remove(), 3000);
}

/* ---------- Datenbank (IndexedDB v2: items + kv) ---------- */
const DB_NAME = 'tresor-glass';   // bleibt gleich, damit der Tresor aus v1 erhalten bleibt
let db = null;
const openDB = () => new Promise((res, rej) => {
  const r = indexedDB.open(DB_NAME, 2);
  r.onupgradeneeded = () => {
    const d = r.result;
    if (!d.objectStoreNames.contains('items')) d.createObjectStore('items', { keyPath: 'id' });
    if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv', { keyPath: 'k' });
  };
  r.onsuccess = () => res(r.result);
  r.onerror = () => rej(r.error);
});
const rq = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const store = (name, mode) => db.transaction(name, mode).objectStore(name);
const dbAll = () => rq(store('items', 'readonly').getAll());
const dbPut = it => rq(store('items', 'readwrite').put(it));
const dbDel = id => rq(store('items', 'readwrite').delete(id));
const kvGet = async k => { const r = await rq(store('kv', 'readonly').get(k)); return r ? r.v : null; };
const kvSet = (k, v) => rq(store('kv', 'readwrite').put({ k, v }));

/* ---------- Level & XP ---------- */
const xpFor = n => 40 * (n - 1) * n;           // Gesamt-XP, ab der Level n erreicht ist
function levelInfo(xp = G.xp) {
  let n = 1;
  while (xpFor(n + 1) <= xp) n++;
  const base = xpFor(n), next = xpFor(n + 1);
  return { level: n, base, next, cur: xp - base, need: next - base, pct: clamp((xp - base) / (next - base), 0, 1) };
}
const areaLevel = id => Math.floor(Math.sqrt((G.axp[id] || 0) / 20)) + 1;
const RANKS = ['Neuling', 'Entdecker', 'Macher', 'Profi', 'Stratege', 'Mentor', 'Meister', 'Visionär', 'Legende'];
const rankOf = lv => RANKS[Math.min(RANKS.length - 1, Math.floor((lv - 1) / 2))];

function touchStreak() {
  const today = dayKey(), s = G.streak;
  if (s.last === today) return;
  s.count = s.last === dayKey(addDays(new Date(), -1)) ? s.count + 1 : 1;
  s.best = Math.max(s.best, s.count);
  s.last = today;
  bus.emit('streak', s);
}
function streakAlive() {
  const s = G.streak;
  return s.last === dayKey() || s.last === dayKey(addDays(new Date(), -1)) ? s.count : 0;
}

let xpBusy = false;
function addXP(n, areaId, reason, opts = {}) {
  if (!n) return;
  const before = levelInfo().level;
  G.xp += n;
  if (areaId && G.axp[areaId] !== undefined) G.axp[areaId] += n;
  if (!opts.noStreak) touchStreak();
  G.log.unshift({ ts: Date.now(), text: reason || '', xp: n, area: areaId || '' });
  G.log.length = Math.min(G.log.length, 60);
  const after = levelInfo().level;
  bus.emit('xp', { n, areaId, reason, before, after });
  if (after > before) bus.emit('levelup', { from: before, to: after });
  if (!xpBusy) { xpBusy = true; try { checkAchievements(); } finally { xpBusy = false; } }
  saveGame();
}

/* Twin-Sync: wie gut kennt der Zwilling dich? (0–100) */
function twinSync() {
  const live = vaultCount();
  const parts = [
    Math.min(1, G.memories.length / 40) * 45,
    Math.min(1, G.topics.length / 10) * 15,
    Math.min(1, G.habits.length / 5) * 10,
    Math.min(1, live / 10) * 15,
    Math.min(1, Object.keys(G.checkins).length / 14) * 15
  ];
  return Math.round(parts.reduce((a, b) => a + b, 0));
}

const _rgbCache = new Map();
const RGB = h => {
  if (_rgbCache.has(h)) return _rgbCache.get(h);
  let s = String(h).replace('#', '');
  if (s.length === 3) s = s.split('').map(c => c + c).join('');
  const n = parseInt(s, 16) || 0;
  const v = [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  _rgbCache.set(h, v);
  return v;
};
const mixC = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const shadeC = (c, t) => (t >= 0 ? mixC(c, [255, 255, 255], t) : mixC(c, [0, 0, 0], -t));
const rgba = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;

const rotX = (v, a) => { const c = Math.cos(a), s = Math.sin(a); return [v[0], v[1] * c - v[2] * s, v[1] * s + v[2] * c]; };
const rotY = (v, a) => { const c = Math.cos(a), s = Math.sin(a); return [v[0] * c + v[2] * s, v[1], -v[0] * s + v[2] * c]; };
const rotZ = (v, a) => { const c = Math.cos(a), s = Math.sin(a); return [v[0] * c - v[1] * s, v[0] * s + v[1] * c, v[2]]; };
const smooth = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };

/* ---------- Pose je Zeitpunkt ---------- */
function computePose(S) {
  const t = S.t, m = S.mood, br = Math.sin(t * 1.7);
  const P = {
    by: 0, bx: Math.sin(t * 0.8) * 0.012, yaw: 0, lean: 0,
    hy: clamp(-S.camYaw * 0.55, -0.75, 0.75), hp: 0, hr: Math.sin(t * 0.6) * 0.02,
    aL: { pitch: 0.05 + Math.sin(t * 1.2) * 0.03, roll: 0.13, bend: 0.16 },
    aR: { pitch: 0.05 + Math.sin(t * 1.2 + 1) * 0.03, roll: 0.13, bend: 0.16 },
    lL: { sw: 0, kn: 0 }, lR: { sw: 0, kn: 0 },
    mouth: 0, smile: 0.45 + m * 0.55, tilt: 0, raise: 0, blink: S.blink, br, walk: 0
  };
  if (m < -0.2) {
    const k = clamp((-m - 0.2) / 0.8, 0, 1);
    P.lean = 0.1 * k; P.hp = 0.2 * k; P.tilt = -0.9 * k; P.blink = Math.max(P.blink, 0.32 * k);
    P.aL.pitch += 0.12 * k; P.aR.pitch += 0.12 * k; P.smile = -0.1 - 0.35 * k;
  } else if (m > 0.5) P.raise = 0.012;

  const an = S.anim;
  if (an) {
    const tau = S.t - an.t0;
    const env = clamp(Math.min(1, tau / 0.35, (an.dur - tau) / 0.45), 0, 1);
    switch (an.name) {
      case 'wave':
        P.aR.roll = 0.13 + 2.35 * env; P.aR.pitch = 0.05; P.aR.bend = 0.2 + env * (0.75 + Math.sin(tau * 11) * 0.38);
        P.smile = Math.max(P.smile, 1.0); P.hr += 0.08 * env; P.raise = 0.02 * env;
        break;
      case 'cheer':
        P.aL.roll = 0.13 + 2.6 * env + Math.sin(tau * 9) * 0.12 * env; P.aR.roll = P.aL.roll;
        P.aL.bend = P.aR.bend = 0.25 * env;
        P.by = Math.abs(Math.sin(tau * 6.5)) * 0.2 * env;
        P.lL.kn = P.lR.kn = 0.25 * env * (1 - Math.abs(Math.sin(tau * 6.5)));
        P.mouth = 0.85 * env; P.smile = 1.3; P.raise = 0.03 * env;
        break;
      case 'dance': {
        const s5 = Math.sin(tau * 5), s25 = Math.sin(tau * 2.5);
        P.by = Math.abs(s5) * 0.08 * env; P.yaw = s25 * 0.55 * env; P.bx += s25 * 0.07 * env; P.hr += s25 * 0.14 * env;
        P.aL.roll = 0.13 + (1.7 + s5 * 0.55) * env; P.aR.roll = 0.13 + (1.7 - s5 * 0.55) * env;
        P.aL.bend = P.aR.bend = 0.5 * env; P.aL.pitch = 0.2 * env; P.aR.pitch = 0.2 * env;
        P.lL.sw = s5 * 0.26 * env; P.lR.sw = -s5 * 0.26 * env; P.lL.kn = P.lR.kn = 0.32 * env;
        P.smile = 1.2; P.mouth = 0.25 * env;
        break;
      }
      case 'think':
        P.aR.pitch = 0.55 * env + 0.05; P.aR.roll = 0.13 - 0.8 * env; P.aR.roll2 = 0.13 + 0.25 * env; P.aR.bend = 1.95 * env + 0.16;
        P.hr += -0.1 * env; P.hp += 0.05 * env; P.hy += 0.25 * env; P.tilt = 0.35 * env; P.raise = 0.04 * env; P.smile = 0.15;
        break;
      case 'walk': {
        const ph = S.walkPh, a = env;
        P.lL.sw = Math.sin(ph) * 0.55 * a; P.lR.sw = -Math.sin(ph) * 0.55 * a;
        P.lL.kn = Math.max(0, Math.cos(ph)) * 0.85 * a; P.lR.kn = Math.max(0, -Math.cos(ph)) * 0.85 * a;
        P.aL.pitch = -Math.sin(ph) * 0.55 * a + 0.05; P.aR.pitch = Math.sin(ph) * 0.55 * a + 0.05;
        P.aL.bend = P.aR.bend = 0.3 * a + 0.1; P.by = Math.abs(Math.cos(ph)) * 0.035 * a; P.lean = 0.07 * a;
        P.bx = Math.sin(ph) * 0.02 * a; P.walk = a; P.smile = 0.8;
        break;
      }
      default: break;
    }
  }
  if (S.talking) P.mouth = Math.max(P.mouth, (Math.sin(t * 17) * 0.5 + 0.5) * (0.35 + 0.65 * Math.abs(Math.sin(t * 3.1))));
  return P;
}

/* ---------- Figur aus Kugeln ---------- */
function buildFigure(look, P) {
  const out = [];
  const skin = RGB(SKINS[look.skin] || SKINS[1]);
  const hairC = RGB(look.hairColor || '#4a3426');
  const oc = RGB(look.outfitColor || '#4f7dff');
  const biz = look.outfit === 'business', hood = look.outfit === 'hoodie', sport = look.outfit === 'sport';
  const topC = biz ? mixC(RGB('#2b3347'), oc, 0.12) : oc;
  const pantsC = biz ? RGB('#2a2f3d') : sport ? RGB('#1f2430') : RGB('#3d5a8c');
  const shoeC = biz ? RGB('#15151b') : sport ? mixC(oc, [255, 255, 255], 0.55) : RGB('#f4f4f7');
  const shortSleeve = !(biz || hood), shorts = sport;

  const add = (x, y, z, r, c, o) => out.push(Object.assign({ x, y, z, r, c }, o));

  };

    const cc = shadeC(oc, -0.1);

      for (let i = 0; i < n; i++) {
        const th = n === 1 ? 0 : (i / n) * Math.PI * 2;

    headChain([0, 0.18, 0.44], [0.2, 0.2, 0.34], 0.06, 0.055, shadeC(cc, -0.08));

/* =====================================================================
   BÜHNE: 3D-Projektion, Shading, Boden, Partikel, Interaktion, Intro
   ===================================================================== */
const PAL = {
  light: { acc: [10, 132, 255], acc2: [94, 92, 230], gold: [255, 180, 0], shadow: [40, 50, 110], floorA: 0.34 },
  dark: { acc: [77, 163, 255], acc2: [142, 140, 255], gold: [255, 200, 70], shadow: [0, 0, 0], floorA: 0.1 }

const pal = () => (document.documentElement.dataset.theme === 'dark' ? PAL.dark : PAL.light);
const easeOut = x => 1 - Math.pow(1 - clamp(x, 0, 1), 3);
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const ANIM_DUR = { wave: 2.8, cheer: 2.4, dance: 4.2, think: 3.6, walk: 5.5 };

class Stage {
  constructor(canvas, opts = {}) {
    this.cv = canvas;
    this.ctx = canvas.getContext('2d');
    this.opts = Object.assign({ spring: true, zoom: 1, sparkles: 34, floor: true }, opts);
    this.look = Object.assign({}, G.look);
    this.t = Math.random() * 10; this.mood = 0; this.moodTarget = 0;
    this.anim = null; this.walkPh = 0; this.floorSpin = 0;
    this.yaw = 0; this.yawVel = 0; this.pitch = 0.17; this.camYaw = 0;
    this.blink = 0; this.nextBlink = 2; this.blinkT = -1;
    this.talking = false; this.intro = null; this.run = false; this.last = 0;
    this.sparks = []; this.bursts = [];
    for (let i = 0; i < this.opts.sparkles; i++) this.sparks.push(this.newSpark(true));
    this.w = 0; this.h = 0;
    this.drag = null; this.idle = 0;
    this.onPoke = () => this.play('wave');
    this.bind();

    if (window.ResizeObserver) { this.ro = new ResizeObserver(() => this.resize()); this.ro.observe(canvas.parentElement || canvas); }
  }

  newSpark(init) {
    const a = Math.random() * Math.PI * 2, r = 0.95 + Math.random() * 1.0;
    return { x: Math.cos(a) * r, y: init ? Math.random() * 2.8 : -0.1, z: Math.sin(a) * r, vy: 0.08 + Math.random() * 0.2, ph: Math.random() * 6.28, sz: 0.009 + Math.random() * 0.012 };
  }

  resize() {
    const r = this.cv.getBoundingClientRect();
    if (!r.width || !r.height) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    this.w = r.width; this.h = r.height;
    this.cv.width = Math.round(r.width * dpr); this.cv.height = Math.round(r.height * dpr);
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  bind() {
    const cv = this.cv;
    cv.addEventListener('pointerdown', e => {
      this.drag = { x: e.clientX, yaw0: this.yaw, moved: false, lx: e.clientX, lt: performance.now() };
      this.yawVel = 0;

    });

  }

  setMood(m) { this.moodTarget = clamp(m, -1, 1); }
  play(name, dur) {
    this.anim = { name, t0: this.t, dur: dur || ANIM_DUR[name] || 2.5 };
    if (name === 'walk') this.walkPh = 0;
  }
  startIntro(done) {
    if (reduceMotion()) { this.intro = null; if (done) done(); return; }
    this.intro = { t: 0, dur: 3.6, done };
  }
  burst(n = 70) {
    const c = pal();
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, sp = 0.8 + Math.random() * 1.8;
      this.bursts.push({
        x: (Math.random() - 0.5) * 0.4, y: 1.2 + Math.random() * 0.4, z: (Math.random() - 0.5) * 0.4,
        vx: Math.cos(a) * sp, vy: 1.4 + Math.random() * 2.2, vz: Math.sin(a) * sp,
        life: 1, col: i % 3 === 0 ? c.gold : i % 3 === 1 ? c.acc : c.acc2, sz: 0.01 + Math.random() * 0.012

  }

  start() {

    this.raf = requestAnimationFrame(loop);

    if (this.intro) {

    }

    if (this.blinkT < 0 && this.t > this.nextBlink) this.blinkT = 0;
    if (this.blinkT >= 0) {

      if (this.blinkT > 0.17) { this.blinkT = -1; this.blink = 0; this.nextBlink = this.t + 2.2 + Math.random() * 3.2; }
    }

    if (this.anim) {
      if (this.t - this.anim.t0 > this.anim.dur) this.anim = null;
      else if (this.anim.name === 'walk') this.walkPh += dt * 7.5;

    if (!this.drag) {
      if (Math.abs(this.yawVel) > 0.01) { this.yaw += this.yawVel * dt; this.yawVel *= Math.pow(0.06, dt); }

  render() {
    const ctx = this.ctx, w = this.w, h = this.h;

    ctx.clearRect(0, 0, w, h);
    const c = pal();
    const it = this.intro ? this.intro.t : 99;
    const k = this.intro ? easeOut(it / 3.2) : 1;
    const camYaw = this.yaw + (this.intro ? (1 - k) * 1.8 : 0);
    this.camYaw = camYaw;

    /* Boden */
    if (this.opts.floor) {

        g.addColorStop(0, rgba(c.acc, 0.26 * fl)); g.addColorStop(0.7, rgba(c.acc2, 0.1 * fl)); g.addColorStop(1, rgba(c.acc, 0.03 * fl));
        ctx.fillStyle = g; ctx.fill();
        ctx.lineWidth = 1.6; ctx.strokeStyle = rgba(c.acc, 0.55 * fl); ctx.stroke();
        /* Ticks */
        ctx.lineWidth = 2; ctx.strokeStyle = rgba(c.acc2, 0.45 * fl);
        for (let i = 0; i < 36; i++) {
          const a = (i / 36) * Math.PI * 2 + this.floorSpin, r0 = Rf * 0.86, r1 = Rf * (i % 3 === 0 ? 0.74 : 0.8);
          const p0 = proj([Math.cos(a) * r0, 0, Math.sin(a) * r0]), p1 = proj([Math.cos(a) * r1, 0, Math.sin(a) * r1]);
          ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y); ctx.stroke();
        }
        /* Puls */
        const ph = (this.t * 0.35) % 1, rp = Rf * (0.15 + ph * 0.6);
        ctx.beginPath();
        for (let i = 0; i <= 40; i++) { const a = (i / 40) * Math.PI * 2, p = proj([Math.cos(a) * rp, 0, Math.sin(a) * rp]); i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y); }
        ctx.strokeStyle = rgba(c.acc, (1 - ph) * 0.35 * fl); ctx.lineWidth = 1.4; ctx.stroke();
      }
      /* Schatten */
      const so = proj([0, 0, 0]), sa = this.intro ? easeOut((it - 1.2) / 1.5) : 1;
      ctx.save(); ctx.translate(so.x, so.y); ctx.scale(1, 0.22 + Math.sin(pitch) * 0.9);
      const sg = ctx.createRadialGradient(0, 0, 0, 0, 0, so.s * 0.62);
      sg.addColorStop(0, rgba(c.shadow, 0.34 * sa)); sg.addColorStop(1, rgba(c.shadow, 0));
      ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(0, 0, so.s * 0.62, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    }

    /* Figur */
    const P = computePose(this);
    const parts = buildFigure(this.look, P);
    const items = [];
    const trails = [];
    for (let i = 0; i < parts.length; i++) {
      const q = parts[i];
      let x = q.x, y = q.y, z = q.z, sc = 1, al = 1;
      if (this.intro) {
        const delay = (q.y / 2.4) * 1.1 + hash(i) * 0.35;
        const a = clamp((it - delay) / 0.95, 0, 1), e = easeOut(a);
        if (a <= 0) continue;
        const ox = (hash(i + 11) - 0.5) * 6, oy = (hash(i + 23) - 0.1) * 4.5 + 0.8, oz = (hash(i + 37) - 0.5) * 6;
        const inv = (1 - e) * (1 - e);
        x += ox * inv; y += oy * inv; z += oz * inv; sc = 0.25 + 0.75 * e; al = Math.min(1, e * 1.6);
        if (a < 1) {
          const e2 = Math.max(0, e - 0.1), inv2 = (1 - e2) * (1 - e2);
          trails.push({ a: [q.x + ox * inv2, q.y + oy * inv2, q.z + oz * inv2], b: [x, y, z], al: (1 - e) * 0.5 });
        }
      }
      const p = proj([x, y, z]);
      items.push({ k: 's', x: p.x, y: p.y, z: p.z, R: q.r * p.s * sc, c: q.c, ex: q.ex || 1, ey: q.ey || 1, gl: q.gl || 0, fl: q.fl || 0, a: (q.a === undefined ? 1 : q.a) * al });
    }
    for (const tr of trails) {
      const a = proj(tr.a), b = proj(tr.b);
      ctx.strokeStyle = rgba(c.acc, tr.al); ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
    /* Funken */
    const dt = 0.016;
    for (const s of this.sparks) {
      s.y += s.vy * dt; if (s.y > 2.9) Object.assign(s, this.newSpark(false));
      const p = proj([s.x, s.y, s.z]), tw = 0.35 + 0.4 * Math.sin(this.t * 2 + s.ph);
      items.push({ k: 'd', x: p.x, y: p.y, z: p.z, R: s.sz * p.s * 2.4, col: s.ph > 3.2 ? c.gold : c.acc, a: Math.max(0.05, tw) * 0.8 * (this.intro ? clamp((it - 2) / 1.2, 0, 1) : 1) });
    }
    for (let i = this.bursts.length - 1; i >= 0; i--) {
      const b = this.bursts[i];
      b.vy -= 4.2 * dt; b.x += b.vx * dt; b.y += b.vy * dt; b.z += b.vz * dt; b.life -= dt * 0.75;
      if (b.life <= 0 || b.y < -0.2) { this.bursts.splice(i, 1); continue; }
      const p = proj([b.x, b.y, b.z]);
      items.push({ k: 'd', x: p.x, y: p.y, z: p.z, R: b.sz * p.s * 2.4, col: b.col, a: clamp(b.life * 1.2, 0, 0.9) });
    }

    items.sort((a, b) => a.z - b.z);
    const lx = -0.45, ly = 0.55;
    for (const m of items) {
      if (m.k === 'd') {
        ctx.globalAlpha = m.a;
        const g = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, m.R);
        g.addColorStop(0, rgba([255, 255, 255], 1)); g.addColorStop(0.35, rgba(m.col, 0.9)); g.addColorStop(1, rgba(m.col, 0));
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(m.x, m.y, m.R, 0, Math.PI * 2); ctx.fill();
        continue;
      }
      if (m.R < 0.3) continue;
      ctx.globalAlpha = clamp(m.a, 0, 1);
      ctx.save(); ctx.translate(m.x, m.y); ctx.scale(m.ex, m.ey);
      const R = m.R, hx = lx * R * 0.55, hy = -ly * R * 0.55;
      const g = ctx.createRadialGradient(hx, hy, R * 0.04, hx * 0.25, hy * 0.25, R * 1.12);
      const kk = 1 - m.fl * 0.7;
      g.addColorStop(0, rgba(shadeC(m.c, 0.42 * kk))); g.addColorStop(0.32, rgba(shadeC(m.c, 0.1 * kk)));
      g.addColorStop(0.72, rgba(shadeC(m.c, -0.2 * kk))); g.addColorStop(1, rgba(shadeC(m.c, -0.42 * kk)));
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.fill();
      if (m.gl > 0) {
        ctx.fillStyle = `rgba(255,255,255,${0.5 * m.gl})`;
        ctx.beginPath(); ctx.ellipse(hx * 1.05, hy * 1.05, R * 0.2, R * 0.14, -0.6, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }
}

];
function checkAchievements() {
  for (const a of ACHIEVEMENTS) {
    if (G.achievements[a.id]) continue;
    let ok = false;
    try { ok = a.ok(); } catch (e) { ok = false; }
    if (!ok) continue;
    G.achievements[a.id] = Date.now();
    setTimeout(() => { toast(`${a.e} Erfolg: ${a.n}`, 'good'); bus.emit('achievement', a); }, 300);
    if (a.id !== 'start') setTimeout(() => addXP(25, '', 'Erfolg: ' + a.n, { noStreak: true }), 600);
  }
}

/* ---------- Check-in & Stimmung ---------- */
const todayCheckin = () => G.checkins[dayKey()] || null;
function latestCheckin() {
  const keys = Object.keys(G.checkins).sort();
  return keys.length ? G.checkins[keys[keys.length - 1]] : null;
}
function moodValue() {
  const c = todayCheckin() || latestCheckin();
  if (!c) return 0.2;
  const avg = (c.mood + c.energy + c.focus) / 3;
  const base = (avg - 3) / 2;                         // -1 … +1
  return todayCheckin() ? base : base * 0.5;          // ältere Werte wirken schwächer
}
function saveCheckin(mood, energy, focus) {
  const first = !todayCheckin();
  G.checkins[dayKey()] = { mood, energy, focus, ts: Date.now() };
  if (first) addXP(10, 'gesundheit', 'Tages-Check-in');
  else saveGame();
  bus.emit('mood');
}

/* ---------- Sprechblasen-Texte des Zwillings ---------- */
function greeting() {
  const h = new Date().getHours();
  const part = h < 5 ? 'Noch wach' : h < 11 ? 'Guten Morgen' : h < 17 ? 'Hi' : h < 22 ? 'Guten Abend' : 'Späte Stunde';
  return `${part}, ${G.name}!`;
}
function twinLine() {
  const open = G.habits.filter(h => !h.days[dayKey()]).length;
  const lines = [];
  if (!todayCheckin()) lines.push('Wie geht es dir heute? Ein kurzer Check-in bringt XP.');
  if (G.habits.length && open) lines.push(`Noch ${open} ${open === 1 ? 'Gewohnheit' : 'Gewohnheiten'} offen – du schaffst das.`);
  if (G.habits.length && !open) lines.push('Alles erledigt. Stark!');
  const s = streakAlive();
  if (s >= 2) lines.push(`${s} Tage in Folge – lass die Flamme nicht ausgehen.`);
  if (G.memories.length < 5) lines.push('Erzähl mir mehr über dich, dann werde ich dir ähnlicher.');
  if (!lines.length) lines.push('Was steht heute an?');
  return lines[Math.floor(Math.random() * lines.length)];
}

/* ---------- Lebensrad (Radar) ---------- */
function radarSVG() {
  const n = AREAS.length, cx = 150, cy = 118, R = 76;
  const pt = (i, k) => { const a = -Math.PI / 2 + (i / n) * Math.PI * 2; return [cx + Math.cos(a) * R * k, cy + Math.sin(a) * R * k]; };
  let grid = '';
  for (const k of [0.25, 0.5, 0.75, 1]) grid += `<polygon class="grid" points="${AREAS.map((_, i) => pt(i, k).join(',')).join(' ')}"/>`;
  for (let i = 0; i < n; i++) { const p = pt(i, 1); grid += `<line class="grid" x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}"/>`; }
  const vals = AREAS.map(a => 0.08 + 0.92 * (1 - Math.exp(-(G.axp[a.id] || 0) / 220)));
  const shape = vals.map((v, i) => pt(i, v).join(',')).join(' ');
  const labels = AREAS.map((a, i) => {
    const p = pt(i, 1.27), anchor = p[0] < cx - 6 ? 'end' : p[0] > cx + 6 ? 'start' : 'middle';
    return `<text x="${p[0]}" y="${p[1] + 4}" text-anchor="${anchor}">${a.emoji} ${esc(a.name)} · ${areaLevel(a.id)}</text>`;
  }).join('');
  const dots = vals.map((v, i) => { const p = pt(i, v); return `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="${AREAS[i].color}"/>`; }).join('');
  return `<svg class="radar" viewBox="-40 0 380 240" role="img" aria-label="Lebensrad">${grid}<polygon class="shape" points="${shape}"/>${dots}${labels}</svg>`;
}

/* ---------- Modal ---------- */
let modalResolve = null;
function openModal(html, onMount) {
  const w = $('#modalWrap'), old = $('#modal');
  const m = old.cloneNode(false);               // frischer Knoten: alte Listener fallen weg
  old.replaceWith(m);
  m.innerHTML = html;
  w.classList.add('open'); w.setAttribute('aria-hidden', 'false');
  if (onMount) onMount(m);
  const f = $('input,textarea', m); if (f && !reduceMotion()) setTimeout(() => { try { f.focus(); } catch (e) { /* ignorieren */ } }, 120);
}
function closeModal() {
  const w = $('#modalWrap');
  w.classList.remove('open'); w.setAttribute('aria-hidden', 'true');
  if (modalResolve) { const r = modalResolve; modalResolve = null; r(null); }
}
const askConfirm = (title, text, okLabel = 'Löschen') => new Promise(res => {
  modalResolve = res;
  openModal(`<h2>${esc(title)}</h2><p class="lead">${esc(text)}</p><div class="m-actions"><button class="pill" data-mc="no">Abbrechen</button><button class="pill primary" data-mc="yes">${esc(okLabel)}</button></div>`,

/* ---------- Sprechblase ---------- */

/* ---------- Intro ---------- */
function runIntro(done) {
  const intro = $('#intro');
  if (reduceMotion()) { if (done) done(); return; }
  introActive = true; updateStages();
  intro.hidden = false; intro.classList.remove('out');
  const title = $('#introTitle'), sub = $('#introSub'), go1 = $('#introGo');
  title.innerHTML = 'YannickAI'.split('').map((ch, i) => `<span style="animation-delay:${(1.5 + i * 0.07).toFixed(2)}s">${ch}</span>`).join('');
  sub.classList.remove('on'); go1.classList.remove('on');
  if (!introStage) introStage = new Stage($('#introCanvas'), { zoom: 0.86, sparkles: 48, cy: 0.54 });
  introStage.setLook(G.look); introStage.setMood(0.7);
  let finished = false, auto = null;
  const finish = () => {
    if (finished) return; finished = true; clearTimeout(auto);
    intro.classList.add('out');
    setTimeout(() => { intro.hidden = true; introStage.stop(); introActive = false; updateStages(); if (done) done(); }, 650);
  };
  $('#introGo').onclick = finish; $('#introSkip').onclick = finish;
  introStage.start();
  introStage.startIntro(() => {
    sub.classList.add('on'); go1.classList.add('on');
    if (G.onboarded) auto = setTimeout(finish, 3600);
  });
}

function addHabit(d) {
  const h = { id: uid(), title: d.title.trim(), emoji: d.emoji || '🎯', area: d.area || 'wissen', xp: d.xp || 10, days: {}, created: Date.now() };
  G.habits.push(h); saveGame(); return h;
}
function habitStreak(h) {
  let n = 0, d = new Date();
  if (!h.days[dayKey(d)]) d = addDays(d, -1);
  while (h.days[dayKey(d)] && n < 4000) { n++; d = addDays(d, -1); }
  return n;
}
function habitHist(h) {
  let out = '';
  for (let i = 6; i >= 0; i--) out += `<i class="${h.days[dayKey(addDays(new Date(), -i))] ? 'on' : ''}"></i>`;
  return `<span class="hist" title="Letzte 7 Tage">${out}</span>`;
}
function toggleHabit(id) {
  const h = G.habits.find(x => x.id === id); if (!h) return;
  const k = dayKey();
  G.bonusDays = G.bonusDays || {};
  if (h.days[k]) {
    delete h.days[k];
    G.xp = Math.max(0, G.xp - h.xp); G.axp[h.area] = Math.max(0, (G.axp[h.area] || 0) - h.xp);
    G.stats.habitDone = Math.max(0, G.stats.habitDone - 1);
    saveGame();
  } else {
    h.days[k] = true; G.stats.habitDone++;
    addXP(h.xp, h.area, h.title);
    if (homeStage) homeStage.burst(16);
    if (G.habits.length >= 2 && G.habits.every(x => x.days[k]) && !G.bonusDays[k]) {
      G.bonusDays[k] = true;
      setTimeout(() => {
        addXP(20, '', 'Tagesbonus: alles erledigt');
        toast('🎉 Tagesbonus: +20 XP', 'good');
        if (homeStage) { homeStage.play('cheer'); homeStage.burst(60); if (currentView === 'home') say('Alles erledigt – das war ein starker Tag!'); }
      }, 350);
    }
  }
  refreshAll();
}

function dailyQuestion() {
  const left = QUESTIONS.filter(q => !G.asked.includes(q.id));
  if (!left.length) return null;
  const k = dayKey();
  if (!G.qskip || G.qskip.day !== k) G.qskip = { day: k, n: 0 };
  let seed = 0; for (const ch of k) seed = (seed * 31 + ch.charCodeAt(0)) % 9973;
  return left[(seed + G.qskip.n) % left.length];
}

const STOP = new Set('und oder der die das den dem des ein eine einen einem einer ist sind war bin bist habe hast hat wie was wer wo wann warum wieso welche welcher welches mein meine meinen meinem meiner mir mich dir dich dein deine nicht auch aber mit von für auf aus bei nach zum zur über unter wird wurde kann könnte soll sollte will würde man mal noch schon nur sehr dass wenn weil als wie ich du er sie es wir ihr sag sage erzähl erzähle zeig zeige gib'.split(' '));
const toks = s => (String(s).toLowerCase().match(/[a-zäöüß0-9]+/g) || []).filter(w => w.length > 2 && !STOP.has(w));
const stem = w => w.slice(0, Math.max(4, w.length - 2));

function searchTwin(text) {
  const ts = toks(text).map(stem);
  if (!ts.length) return [];
  const docs = [];
  for (const m of G.memories) docs.push({ type: 'Erinnerung', area: m.area, title: m.q, body: m.a, head: m.q.toLowerCase(), text: (m.q + ' ' + m.a).toLowerCase(), m });
  for (const t of G.topics) docs.push({ type: 'Thema', area: t.area, title: t.title, body: t.notes || t.title, head: t.title.toLowerCase(), text: (t.title + ' ' + t.notes).toLowerCase() });
  for (const h of G.habits) docs.push({ type: 'Gewohnheit', area: h.area, title: h.title, body: `${h.emoji} ${h.title} (Serie: ${habitStreak(h)} Tage)`, head: h.title.toLowerCase(), text: h.title.toLowerCase() });
  for (const it of vaultItems()) {
    const f = (it.fields || []).filter(x => x.v).map(x => `${x.k}: ${x.v}`).join(' · ');
    docs.push({ type: it.kind === 'doc' ? 'Dokument' : 'Datensatz', area: '', title: it.title, body: [f, it.notes].filter(Boolean).join(' – ') || it.title, head: it.title.toLowerCase(), text: [it.title, it.notes, (it.tags || []).join(' '), f, it.file ? it.file.name : ''].join(' ').toLowerCase() });
  }
  const out = [];
  for (const d of docs) {
    let sc = 0;
    for (const t of ts) { if (d.text.includes(t)) sc += 1; if (d.head.includes(t)) sc += 1; }
    if (sc > 0) out.push({ d, sc: sc / ts.length });
  }
  return out.sort((a, b) => b.sc - a.sc).slice(0, 3);
}

function twinReply(text) {
  const raw = text.trim(), low = raw.toLowerCase();
  let m;
  if ((m = /^(merke|merk dir|speichere|notiere|erinnere dich)\s*[:,-]?\s+(.+)/is.exec(raw))) {
    const body = m[2].trim();
    addMemory('Notiz ' + new Intl.DateTimeFormat('de-DE', { dateStyle: 'short' }).format(Date.now()), body, 'wissen');
    addXP(6, 'wissen', 'Per Chat gemerkt');
    return { t: `Gemerkt: „${body.length > 120 ? body.slice(0, 117) + '…' : body}“. +6 XP.` };
  }
  if (/^(hallo|hi|hey|moin|servus|guten (morgen|tag|abend))\b/.test(low)) return { t: `${greeting()} ${twinLine()}` };
  if (/(wer bist du|was bist du|was kannst du|hilfe|wie funktionierst)/.test(low))
    return { t: 'Ich bin dein digitaler Zwilling. Ich antworte ausschließlich aus dem, was du mir beibringst: Erinnerungen, Themen, Gewohnheiten und deinen Tresor. Alles bleibt lokal in diesem Browser, es gibt keine Cloud und kein externes KI-Modell.\n\nTipp: Schreib „Merke: …“, um etwas zu speichern.' };
  if (/(level|xp|erfahrung|rang)/.test(low)) { const li = levelInfo(); return { t: `Du bist Level ${li.level} (${rankOf(li.level)}) mit ${G.xp} XP. Bis Level ${li.level + 1} fehlen ${li.need - li.cur} XP.` }; }
  if (/(streak|serie|in folge)/.test(low)) return { t: `Deine aktuelle Serie: ${streakAlive()} Tage. Bester Wert: ${G.streak.best} Tage.` };
  if (/(sync|kennst du mich|wie gut kennst)/.test(low)) return { t: `Mein Sync mit dir liegt bei ${twinSync()} %. Je mehr Erinnerungen, Themen und Check-ins, desto besser kenne ich dich.` };
  if (/(heute|offen|aufgabe|quest|gewohnheit)/.test(low) && /(heute|offen|aufgabe|quest|noch)/.test(low)) {
    const open = G.habits.filter(h => !h.days[dayKey()]);
    return { t: !G.habits.length ? 'Du hast noch keine Gewohnheiten angelegt.' : open.length ? 'Heute noch offen:\n' + open.map(h => `${h.emoji} ${h.title}`).join('\n') : 'Heute ist alles erledigt. 🎉' };
  }
  if (/(wie geht|stimmung|befinden)/.test(low)) {
    const c = todayCheckin() || latestCheckin();
    return { t: c ? `${todayCheckin() ? 'Heute' : 'Zuletzt'}: Stimmung ${c.mood}/5, Energie ${c.energy}/5, Fokus ${c.focus}/5.` : 'Du hast noch keinen Check-in gemacht. Das geht auf der Startseite.' };
  }
  const hits = searchTwin(raw);
  if (hits.length) {
    const top = hits[0];
    if (top.d.type === 'Erinnerung' && top.sc >= 0.99) {
      return { t: top.d.body, src: `Aus deiner Erinnerung „${top.d.title}“` };
    }
    return { hits, t: 'Das habe ich dazu gespeichert:' };
  }
  return { t: 'Dazu weiß ich noch nichts. Bring es mir bei: Schreib „Merke: …“ oder beantworte die Frage des Tages.', teach: true };
}

function sendChat(text) {
  text = text.trim(); if (!text) return;
  G.chat = G.chat || [];
  G.chat.push({ r: 'me', t: text, ts: Date.now() });
  const rep = twinReply(text);
  G.stats.chats++;
  G.chat.push({ r: 'ai', t: rep.t, src: rep.src, hits: rep.hits ? rep.hits.map(h => ({ type: h.d.type, title: h.d.title, body: h.d.body, area: h.d.area })) : null, ts: Date.now() });
  if (G.chat.length > 80) G.chat.splice(0, G.chat.length - 80);
  checkAchievements(); saveGame();
  renderTwin(true);
  if (homeStage) { homeStage.talking = true; setTimeout(() => { homeStage.talking = false; }, 900); }
}

function chatHTML() {
  const msgs = (G.chat && G.chat.length) ? G.chat : [{ r: 'ai', t: `Hi ${G.name}! Ich bin dein digitaler Zwilling. Ich antworte nur aus dem, was du mir beibringst – lokal in diesem Browser, ohne Cloud.\n\nSchreib zum Beispiel „Merke: …“ oder frag mich etwas.` }];
  return msgs.map(m => {
    if (m.r === 'me') return `<div class="msg me">${esc(m.t)}</div>`;
    const hits = (m.hits || []).map(h => `<span class="snip"><small>${esc(h.type)}${h.area ? ' · ' + esc(areaOf(h.area).name) : ''} · ${esc(h.title)}</small>${esc(h.body.length > 220 ? h.body.slice(0, 217) + '…' : h.body)}</span>`).join('');
    return `<div class="msg ai">${esc(m.t)}${hits}${m.src ? `<span class="src">${esc(m.src)}</span>` : ''}</div>`;
  }).join('');
}
