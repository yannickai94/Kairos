}

/* ---------- Check-in ---------- */
function lifeCheckin() {
  const t = todayISO(), c = S.checkins[t] || {}, days = Array.from({ length: 14 }, (_, i) => addDays(t, i - 13));
  const series = k => days.map(d => (S.checkins[d] || {})[k]).map(v => v == null ? null : v);
  const avg = k => { const v = series(k).filter(x => x != null); return v.length ? (sum(v) / v.length) : null; };
  const spark = (k, color, max) => { const v = series(k); return v.some(x => x != null) ? sparkline(v.map(x => x == null ? 0 : x), { color, h: 50 }) : '<div class="faint" style="font-size:13px;padding:14px 0">Noch keine Daten</div>'; };
  const scale = (k, label) => `<div class="field"><label>${label}</label><div class="scale">${[1, 2, 3, 4, 5].map(n => `<button class="${c[k] === n ? 'on' : ''}" data-act="life.ci" data-k="${k}" data-v="${n}">${k === 'mood' ? MOODS[n - 1] : n}</button>`).join('')}</div></div>`;
  const n = Object.keys(S.checkins).length;
  return `<div class="grid"><section class="card glass s5"><h3>${icon('sun')} Heute · ${fmtDate(t)}</h3><div class="stack" style="gap:16px">${scale('mood', 'Stimmung')}${scale('energy', 'Energie')}
    <div class="field"><label>Schlaf (Stunden)</label><input class="inp" id="ciSleep" inputmode="decimal" placeholder="z. B. 7,5" value="${c.sleep != null ? String(c.sleep).replace('.', ',') : ''}"></div>
    <div class="field"><label>Kurze Notiz (optional)</label><input class="inp" id="ciNote" placeholder="Was war heute los?" value="${esc(c.note || '')}"></div></div></section>
    <section class="card glass s7"><h3>${icon('trend')} Letzte 14 Tage</h3>${n >= 2 ? `<div class="stack" style="gap:14px">${[['mood', 'Stimmung', 'var(--c-life)'], ['energy', 'Energie', 'var(--c-biz)'], ['sleep', 'Schlaf', 'var(--c-job)']].map(([k, l, col]) => `<div><div class="row-flex" style="justify-content:space-between"><b style="font-size:14px">${l}</b><span class="muted" style="font-size:13px">Ø ${avg(k) != null ? avg(k).toFixed(1).replace('.', ',') + (k === 'sleep' ? ' h' : ' / 5') : '–'}</span></div>${spark(k, col)}</div>`).join('')}</div>${checkinInsight()}` : `<div class="empty"><div class="em">📈</div><b>Muster entdecken</b><p>Nach ein paar Tagen zeigt Kairos Verläufe und Zusammenhänge – z. B. wie Schlaf und Stimmung zusammenhängen.</p></div>`}</section></div>`;
}
function checkinInsight() {
  const rows = Object.entries(S.checkins).filter(([, c]) => c.sleep != null && c.mood != null); if (rows.length < 6) return '';
  const good = rows.filter(([, c]) => c.sleep >= 7), bad = rows.filter(([, c]) => c.sleep < 7); if (good.length < 2 || bad.length < 2) return '';
  const g = sum(good, ([, c]) => c.mood) / good.length, b = sum(bad, ([, c]) => c.mood) / bad.length;
  return Math.abs(g - b) >= 0.4 ? `<div class="ins info" style="margin-top:14px"><span class="ie">🔎</span><div class="im"><b>Schlaf wirkt auf deine Stimmung</b><p>Nach ≥ 7 Stunden Schlaf liegt deine Stimmung im Schnitt bei ${g.toFixed(1).replace('.', ',')} – sonst bei ${b.toFixed(1).replace('.', ',')}.</p></div></div>` : '';
}
ACT['life.ci'] = el => { const c = S.checkins[todayISO()] = S.checkins[todayISO()] || {}; c[el.dataset.k] = +el.dataset.v; save(); rerender(); };

  download(new Blob([JSON.stringify({ app: 'kairos', v: 2, exported: new Date().toISOString(), state: S, files })], { type: 'application/json' }), `kairos-backup-${todayISO()}.json`);

async function importBackup(file) {
  let data; try { data = JSON.parse(await file.text()); } catch (e) { return toast('Das ist keine gültige Backup-Datei.', 'bad'); }
  if (!data || data.app !== 'kairos' || !data.state) return toast('Diese Datei stammt nicht von Kairos.', 'bad');
  if (!await confirmSheet('Backup einspielen?', `Alle aktuellen Daten werden durch das Backup vom ${(data.exported || '').slice(0, 10)} ersetzt.`, 'Einspielen', false)) return;

}

      ${replay ? '<div class="onb-acts"><button class="btn primary lg" id="onbClose">Schließen</button></div>' : ''}</div></div>`;
    let mode = 'demo';
    if (replay) { $('#onbClose').onclick = () => { el.hidden = true; el.innerHTML = ''; res(); }; return; }
    $$('#onbForm button', el).forEach(b => b.addEventListener('click', () => mode = b.dataset.m));
    $('#onbForm').addEventListener('submit', async e => {
      e.preventDefault(); S.profile.name = $('#onbName').value.trim().slice(0, 30); S.ui.onboarded = true;
