/* Sprache */
let rec = null;
function stopVoice() { if (rec) { try { rec.stop(); } catch (e) { /* ignorieren */ } rec = null; } const b = $('#micBtn'); if (b) b.classList.remove('on'); }
function startVoice() {
  if (!SR) return toast('Spracheingabe wird von diesem Browser nicht unterstützt.', 'bad');
  if (rec) return stopVoice();
  rec = new SR(); rec.lang = 'de-DE'; rec.interimResults = true; rec.maxAlternatives = 1;
  $('#micBtn').classList.add('on');
  rec.onresult = ev => { const t = Array.from(ev.results).map(r => r[0].transcript).join(' '); $('#cmdIn').value = t; cmdState.q = t; cmdState.sel = 0; renderCmd(); };
  rec.onerror = () => stopVoice(); rec.onend = () => stopVoice();
  try { rec.start(); } catch (e) { stopVoice(); }
}

function initCmd() {
  $('#cmdOrb').innerHTML = logoSvg('cmd'); $('#cmdIcon').innerHTML = icon('sparkle');
  if (SR) $('.cmd-in').insertAdjacentHTML('beforeend', `<button class="iconbtn" id="micBtn" aria-label="Spracheingabe" title="Spracheingabe">${icon('mic')}</button>`);
  const inp = $('#cmdIn');
  inp.addEventListener('input', () => { cmdState.q = inp.value; cmdState.sel = 0; renderCmd(); });
  inp.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); cmdState.sel = Math.min(cmdState.items.length - 1, cmdState.sel + 1); markSel(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); cmdState.sel = Math.max(0, cmdState.sel - 1); markSel(); }
    else if (e.key === 'Enter') { e.preventDefault(); runCmdItem(cmdState.items[cmdState.sel]); }
  });
  $('#cmdWrap').addEventListener('mousedown', e => { if (e.target.id === 'cmdWrap') closeCmd(); });
  $('#cmdBody').addEventListener('click', e => {
    const ex = e.target.closest('[data-ex]'); if (ex) { inp.value = ex.dataset.ex; cmdState.q = inp.value; renderCmd(); inp.focus(); return; }
    const it = e.target.closest('[data-idx]'); if (it) runCmdItem(cmdState.items[+it.dataset.idx]);
  });
  $('#cmdBody').addEventListener('mousemove', e => { const it = e.target.closest('.cmd-it[data-idx]'); if (it && +it.dataset.idx !== cmdState.sel) { cmdState.sel = +it.dataset.idx; markSel(); } });
  document.addEventListener('click', e => { if (e.target.closest('#micBtn')) startVoice(); });
}

/* =====================================================================
   KAIROS · Mini-Charts (HTML/SVG, ohne Bibliothek)
   ===================================================================== */
function sparkline(vals, { color = 'var(--accent)', h = 56, fill = true, id = 'sp' + Math.random().toString(36).slice(2, 7) } = {}) {
  if (!vals.length) return '';
  if (vals.length === 1) vals = [vals[0], vals[0]];
  const mn = Math.min(...vals), mx = Math.max(...vals), rg = mx - mn || 1, W = 200, pad = 4;
  const pts = vals.map((v, i) => [i / (vals.length - 1) * W, pad + (1 - (v - mn) / rg) * (h - pad * 2)]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const last = pts[pts.length - 1];
  return `<svg class="spark" viewBox="0 0 ${W} ${h}" preserveAspectRatio="none" style="height:${h}px" role="img" aria-label="Verlauf"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".32"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    ${fill ? `<path d="${d} L${W} ${h} L0 ${h} Z" fill="url(#${id})"/>` : ''}<path d="${d}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`;
}

function ring(pct, { size = 64, stroke = 7, color = 'var(--accent)', label = '', sub = '' } = {}) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r, p = clamp(pct, 0, 1);
  return `<div class="ringw" style="width:${size}px;height:${size}px"><svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="${Math.round(p * 100)} Prozent"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--field-f)" stroke-width="${stroke}"/>
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${(c * p).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 ${size / 2} ${size / 2})" style="transition:stroke-dasharray .9s var(--ease)"/></svg>
    <div class="ringl"><b>${label}</b>${sub ? `<small>${sub}</small>` : ''}</div></div>`;
}

function donut(segs, { size = 170, stroke = 22, center = '', sub = '' } = {}) {
  const total = sum(segs, s => s.v) || 1, r = (size - stroke) / 2, C = 2 * Math.PI * r; let off = 0;
  const gap = segs.length > 1 ? 3 : 0;
  const arcs = segs.filter(s => s.v > 0).map(s => {
    const len = Math.max(0, s.v / total * C - gap), el = `<circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${s.c}" stroke-width="${stroke}" stroke-dasharray="${len.toFixed(1)} ${(C - len).toFixed(1)}" stroke-dashoffset="${(-off).toFixed(1)}" stroke-linecap="butt" transform="rotate(-90 ${size / 2} ${size / 2})"><title>${esc(s.l)}: ${money(s.v)}</title></circle>`;
    off += s.v / total * C; return el;
  }).join('');
  return `<div class="donutw" style="width:${size}px;height:${size}px"><svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="Verteilung"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--field-f)" stroke-width="${stroke}"/>${arcs}</svg><div class="donutc"><b>${center}</b><small>${sub}</small></div></div>`;
}

/* Verlauf des Gesamtvermögens über n Tage */
function netWorthSeries(days) {
  const t = todayISO(), start = addDays(t, -days + 1);
  let bal = sum(S.accounts, a => a.start) + sum(S.tx.filter(x => x.date < start), x => x.amt);
  const byDay = {}; S.tx.filter(x => x.date >= start && x.date <= t).forEach(x => byDay[x.date] = (byDay[x.date] || 0) + x.amt);
  const out = []; for (let i = 0; i < days; i++) { const d = addDays(start, i); bal += byDay[d] || 0; out.push(bal); }
  return out;
}

/* Heatmap-Streifen für Habits (letzte n Tage) */
function dotsRow(daysMap, n = 14, color = 'var(--c-life)') {
  let h = ''; for (let i = n - 1; i >= 0; i--) { const d = addDays(todayISO(), -i); h += `<i class="${daysMap[d] ? 'on' : ''}" style="${daysMap[d] ? 'background:' + color : ''}" title="${fmtDate(d)}"></i>`; }
  return `<div class="dots">${h}</div>`;
}

  openSheet(`<h2>Kairos meint</h2><div class="ins-list" style="margin-top:14px">${ins.map((x, i) => `<div class="ins ${x.sev}"><span class="ie">${x.e}</span><div class="im"><b>${esc(x.title)}</b><p>${esc(x.text)}</p>${x.action ? `<button class="ilink" data-ins2="${i}">${esc(x.action.label)} ${icon('chevR')}</button>` : ''}</div></div>`).join('')}</div>`,
    { onMount: sh => sh.addEventListener('click', e => { const b = e.target.closest('[data-ins2]'); if (b) { closeSheet(); const a = ins[+b.dataset.ins2].action; a && a.fn(); } }) });
};

/* =====================================================================
   KAIROS · Finanzen (Ansichten)
   ===================================================================== */
const fin = { month: null, q: '', acc: '', cat: '', limit: 60 };
const FIN_TABS = [['uebersicht', 'Übersicht'], ['buchungen', 'Buchungen'], ['konten', 'Konten'], ['budgets', 'Budgets'], ['fix', 'Fixkosten'], ['sparen', 'Sparziele']];
const accOf = id => S.accounts.find(a => a.id === id);

function txRow(t, showAcc) {
  const c = catOf(t.cat), a = accOf(t.acc);
  return `<button class="li" data-act="fin.tx.edit" data-id="${t.id}"><span class="lead" style="background:color-mix(in srgb,${c.c} 17%,transparent)">${c.e}</span>
    <span class="mid"><span class="tt">${esc(t.desc || c.name)}</span><span class="ss">${esc(c.name)}${showAcc && a ? ' · ' + esc(a.name) : ''}${t.rec ? ' · 🔁' : ''}</span></span>
    <span class="end ${t.amt > 0 ? 'pos' : ''} money">${t.amt > 0 ? '+' : '−'}${money(Math.abs(t.amt))}<small>${relDate(t.date)}</small></span></button>`;
}
function monthNav() {
  const k = fin.month, isNow = k === curMonth();
  return `<div class="monthnav"><button class="iconbtn" data-act="fin.month" data-d="-1" aria-label="Vorheriger Monat">${icon('chevL')}</button><b>${monthLabel(k)}</b><button class="iconbtn" data-act="fin.month" data-d="1" aria-label="Nächster Monat" ${isNow ? 'disabled style="opacity:.3;pointer-events:none"' : ''}>${icon('chevR')}</button></div>`;
}

function finOverview() {
  const k = fin.month, ms = monthStats(k), pk = prevMonthKey(k), pm = monthStats(pk), now = k === curMonth();
  const nw = netWorth(), series = netWorthSeries(90);
  const cats = Object.entries(ms.byCat).sort((a, b) => b[1] - a[1]);
  const top = cats.slice(0, 5), other = sum(cats.slice(5), x => x[1]);
  const segs = top.map(([c, v]) => ({ v, c: catOf(c).c, l: catOf(c).name })); if (other) segs.push({ v: other, c: '#9aa6c9', l: 'Weitere' });
  const fc = forecastExpenses(), p = monthProgress();
  const upcoming = upcomingRecurring(10).slice(0, 4);
  const bs = budgetStatus().sort((a, b) => b.pct - a.pct).slice(0, 4);
  const recent = sortedTx().filter(t => !isXfer(t) || true).slice(0, 6);
  const dExp = pm.exp ? (ms.exp - pm.exp) / pm.exp : null;
  return `${monthNav()}<div class="grid">
    <section class="card glass s8"><div class="row-flex" style="align-items:flex-start;gap:20px"><div style="flex:1;min-width:210px"><div class="kpi" style="--c:var(--c-fin)"><span class="lab"><i class="d"></i>Gesamtvermögen</span><span class="val money big" data-count="${nw}">${money(nw)}</span></div>
      <div class="trio"><div><small>Einnahmen</small><b class="pos money">${money(ms.inc, { round: 1 })}</b></div><div><small>Ausgaben</small><b class="money">${money(ms.exp, { round: 1 })}</b>${dExp != null ? `<em class="${dExp > 0.05 ? 'neg' : dExp < -0.05 ? 'pos' : 'muted'}">${dExp > 0 ? '+' : ''}${Math.round(dExp * 100)} % z. Vormonat</em>` : ''}</div><div><small>Überschuss</small><b class="money ${ms.net < 0 ? 'neg' : ''}">${moneySigned(ms.net)}</b>${ms.inc ? `<em class="muted">${Math.round(ms.net / ms.inc * 100)} % Sparquote</em>` : ''}</div></div></div>
      <div style="flex:1.3;min-width:240px;align-self:stretch;display:flex;flex-direction:column;justify-content:flex-end"><div class="muted" style="font-size:12px;font-weight:600;margin-bottom:6px">Vermögensverlauf · 90 Tage</div>${sparkline(series, { color: 'var(--c-fin)', h: 96 })}</div></div></section>
    <section class="card glass s4"><h3>${icon('target')} ${now ? 'Prognose' : 'Rückblick'}</h3>${now ? `<div class="val money" style="font-size:28px;font-weight:750">${money(fc, { round: 1 })}</div><p class="muted" style="font-size:13px;margin:4px 0 12px">erwartete Ausgaben bis Monatsende</p><div class="bar"><i style="width:${Math.round(p * 100)}%"></i></div><div class="row-flex muted" style="font-size:12px;margin-top:6px;justify-content:space-between"><span>Tag ${new Date().getDate()}</span><span>${Math.round(p * 100)} % des Monats</span></div>${pm.exp ? `<p style="font-size:13px;margin-top:12px" class="muted">Vormonat: <b style="color:var(--text)">${money(pm.exp, { round: 1 })}</b></p>` : ''}` : `<div class="val money" style="font-size:28px;font-weight:750">${money(ms.exp, { round: 1 })}</div><p class="muted" style="font-size:13px;margin-top:4px">ausgegeben in ${monthLabel(k)}</p>`}</section>
    <section class="card glass s7"><h3>${icon('trend')} Einnahmen &amp; Ausgaben</h3>${barsChart(lastMonths(6), k)}</section>
    <section class="card glass s5"><h3>${icon('grid')} Ausgaben nach Kategorie</h3>${cats.length ? `<div class="donut-row">${donut(segs, { size: 150, stroke: 20, center: money(ms.exp, { round: 1 }), sub: 'gesamt' })}<div class="dleg">${cats.slice(0, 6).map(([c, v]) => `<div><i style="background:${catOf(c).c}"></i><span>${catOf(c).e} ${esc(catOf(c).name)}</span><b class="money">${money(v, { round: 1 })}</b></div>`).join('')}</div></div>` : `<div class="empty"><div class="em">🍩</div><b>Noch keine Ausgaben</b><p>Sobald du Buchungen erfasst, siehst du hier die Verteilung.</p></div>`}</section>
    <section class="card glass s6"><h3>${icon('receipt')} Letzte Buchungen<span class="sp"></span><button class="link" data-act="fin.tab" data-t="buchungen">Alle</button></h3>${recent.length ? `<div class="list">${recent.map(t => txRow(t, true)).join('')}</div>` : `<div class="empty"><div class="em">✍️</div><b>Erste Buchung erfassen</b><p>Tippe <b>⌘K</b> und schreibe z. B. „12,50 Rewe“.</p><button class="btn primary sm" data-act="fin.tx.add">${icon('plus')}Buchung</button></div>`}</section>
    <section class="card glass s6"><h3>${icon('target')} Budgets &amp; Abbuchungen<span class="sp"></span><button class="link" data-act="fin.tab" data-t="budgets">Budgets</button></h3>
      ${bs.length ? bs.map(b => budgetRow(b)).join('') : `<p class="muted" style="font-size:14px;margin-bottom:6px">Setze Monatslimits je Kategorie – Kairos warnt dich rechtzeitig.</p><button class="btn sm" data-act="fin.tab" data-t="budgets">Budgets einrichten</button>`}
      ${upcoming.length ? `<div class="group-h" style="margin-top:12px"><span>Bald fällig</span></div><div class="list">${upcoming.map(r => `<div class="li tap" style="padding:7px 8px"><span class="lead sm" style="background:color-mix(in srgb,${catOf(r.cat).c} 17%,transparent)">${catOf(r.cat).e}</span><span class="mid"><span class="tt">${esc(r.name)}</span></span><span class="end money ${r.amt > 0 ? 'pos' : ''}" style="font-size:14px">${moneySigned(r.amt)}<small>${relDate(r.date)}</small></span></div>`).join('')}</div>` : ''}</section></div>`;
}
function budgetRow(b) {
  const c = catOf(b.cat), cls = b.pct >= 1 ? 'neg' : b.pct >= .85 ? 'warn' : '';
  return `<button class="brow" data-act="fin.budget.edit" data-cat="${b.cat}"><span class="lead sm" style="background:color-mix(in srgb,${c.c} 17%,transparent)">${c.e}</span><span class="bm"><span class="row-flex" style="justify-content:space-between;gap:6px"><b>${esc(c.name)}</b><span class="money ${cls}" style="font-size:13px;font-weight:650">${money(b.spent, { round: 1 })} <span class="muted" style="font-weight:500">/ ${money(b.limit, { round: 1 })}</span></span></span><span class="bar"><i class="${cls}" style="width:${clamp(b.pct, 0, 1) * 100}%"></i></span></span></button>`;
}

function filteredTx() {
  const q = norm(fin.q);
  return sortedTx().filter(t => (!fin.acc || t.acc === fin.acc) && (!fin.cat || t.cat === fin.cat) && (!q || norm(t.desc).includes(q) || norm(catOf(t.cat).name).includes(q) || String(Math.abs(t.amt / 100)).replace('.', ',').includes(q)));
}
function txListHTML() {
  const list = filteredTx(), shown = list.slice(0, fin.limit);
  if (!list.length) return `<div class="empty"><div class="em">🔍</div><b>${S.tx.length ? 'Keine Treffer' : 'Noch keine Buchungen'}</b><p>${S.tx.length ? 'Passe Suche oder Filter an.' : 'Erfasse deine erste Buchung – oder importiere eine CSV deiner Bank.'}</p></div>`;
  let html = '', last = '', dayItems = [];
  const flush = () => { if (!last) return; const s = sum(dayItems.filter(x => !isXfer(x)), x => x.amt); html += `<div class="group-h"><span>${dayLabel(last)}</span><span class="money">${moneySigned(s)}</span></div>` + dayItems.map(x => txRow(x, true)).join(''); dayItems = []; };
  for (const t of shown) { if (t.date !== last) { flush(); last = t.date; } dayItems.push(t); }
  flush();
  return `<div class="list">${html}</div>${list.length > shown.length ? `<div style="text-align:center;margin-top:12px"><button class="btn" data-act="fin.more">Mehr laden (${list.length - shown.length})</button></div>` : ''}`;
}
function finBookings() {
  const tot = sum(filteredTx().filter(t => !isXfer(t)), t => t.amt);
  return `<section class="card glass"><div class="toolbar"><div class="searchbox">${icon('search')}<input id="txSearch" class="inp" placeholder="Buchungen durchsuchen …" value="${esc(fin.q)}" autocomplete="off"></div>
    <select class="sel" id="txAcc" aria-label="Konto"><option value="">Alle Konten</option>${S.accounts.map(a => `<option value="${a.id}" ${fin.acc === a.id ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}</select>
    <select class="sel" id="txCat" aria-label="Kategorie"><option value="">Alle Kategorien</option>${CATS.map(c => `<option value="${c[0]}" ${fin.cat === c[0] ? 'selected' : ''}>${c[2]} ${esc(c[1])}</option>`).join('')}</select></div>
    <div class="muted" id="txSum" style="font-size:13px;margin:2px 4px 10px">${plural(filteredTx().length, 'Buchung', 'Buchungen')} · Saldo <b class="money" style="color:var(--text)">${moneySigned(tot)}</b></div>
    <div id="txList">${txListHTML()}</div></section>`;
}
function finAccounts() {
  const nw = netWorth();
  return `<div class="grid"><section class="card glass s12"><div class="row-flex"><div class="kpi" style="--c:var(--c-fin)"><span class="lab"><i class="d"></i>Gesamtvermögen</span><span class="val money">${money(nw)}</span></div><span class="sp"></span><button class="btn" data-act="fin.xfer">${icon('repeat')}Umbuchung</button><button class="btn primary" data-act="fin.acc.add">${icon('plus')}Konto</button></div></section>
  ${S.accounts.length ? S.accounts.map(a => { const b = accBalance(a), ty = ACC_TYPES[a.type] || ACC_TYPES.sonst, n = S.tx.filter(t => t.acc === a.id).length;
    return `<button class="card glass s4 acc" data-act="fin.acc.edit" data-id="${a.id}" style="--ac:${a.color || '#4f86ff'}"><span class="acc-top"><span class="acc-ic">${ty[1]}</span><span class="badge">${ty[0]}</span></span><span class="acc-name">${esc(a.name)}</span><span class="acc-bal money ${b < 0 ? 'neg' : ''}">${money(b)}</span><span class="muted" style="font-size:12.5px">${plural(n, 'Buchung', 'Buchungen')}</span></button>`; }).join('')
    : `<section class="card glass s12"><div class="empty"><div class="em">🏦</div><b>Lege dein erstes Konto an</b><p>Girokonto, Tagesgeld, Bargeld oder Depot – Kairos rechnet daraus dein Gesamtvermögen.</p><button class="btn primary" data-act="fin.acc.add">${icon('plus')}Konto anlegen</button></div></section>`}</div>`;
}
function finBudgets() {
  const ms = monthStats(fin.month), bud = S.budgets;
  const withB = EXP_CATS.filter(c => bud[c] > 0).map(c => ({ cat: c, limit: bud[c], spent: ms.byCat[c] || 0, pct: (ms.byCat[c] || 0) / bud[c] }));
  const without = EXP_CATS.filter(c => !(bud[c] > 0)).map(c => [c, ms.byCat[c] || 0]).sort((a, b) => b[1] - a[1]);
  const tl = sum(withB, b => b.limit), ts = sum(withB, b => b.spent);
  return `${monthNav()}<div class="grid"><section class="card glass s7"><h3>${icon('target')} Monatsbudgets<span class="sp"></span><button class="link" data-act="fin.budget.suggest">Vorschlag aus Verlauf</button></h3>
    ${withB.length ? `<div class="row-flex" style="justify-content:space-between;margin-bottom:14px"><div><div class="val money" style="font-size:26px;font-weight:750">${money(ts, { round: 1 })} <span class="muted" style="font-size:15px;font-weight:550">/ ${money(tl, { round: 1 })}</span></div><div class="muted" style="font-size:13px">${tl - ts >= 0 ? `noch ${money(tl - ts, { round: 1 })} im Rahmen` : `${money(ts - tl, { round: 1 })} über dem Gesamtbudget`}</div></div></div><div class="stack" style="gap:14px">${withB.sort((a, b) => b.pct - a.pct).map(budgetRow).join('')}</div>`
      : `<div class="empty"><div class="em">🎯</div><b>Noch keine Budgets</b><p>Lege für Kategorien wie Essen oder Shopping ein Monatslimit fest. Kairos warnt dich ab 85 %.</p><button class="btn primary sm" data-act="fin.budget.suggest">Aus meinem Verlauf vorschlagen</button></div>`}</section>
    <section class="card glass s5"><h3>${icon('plus')} Ohne Budget</h3><div class="list">${without.map(([c, v]) => `<button class="li" data-act="fin.budget.edit" data-cat="${c}" style="padding:8px"><span class="lead sm" style="background:color-mix(in srgb,${catOf(c).c} 17%,transparent)">${catOf(c).e}</span><span class="mid"><span class="tt">${esc(catOf(c).name)}</span></span><span class="end money" style="font-size:14px">${v ? money(v, { round: 1 }) : '–'}<small>Limit setzen</small></span></button>`).join('')}</div></section></div>`;
}
function finFixed() {
  const rec = S.recurring.slice().sort((a, b) => a.next.localeCompare(b.next)), det = detectRecurring();
  const out = sum(rec.filter(r => r.amt < 0 && !r.paused), r => -monthlyCost(r)), inc = sum(rec.filter(r => r.amt > 0 && !r.paused), r => monthlyCost(r));
  return `<div class="grid top"><section class="card glass s4"><h3>${icon('repeat')} Pro Monat</h3><div class="stack" style="gap:14px"><div class="kpi"><span class="lab">Fixkosten &amp; Abos</span><span class="val money">${money(Math.round(out), { round: 1 })}</span><span class="sub">${money(Math.round(out * 12), { round: 1 })} pro Jahr</span></div><div class="kpi"><span class="lab">Feste Einnahmen</span><span class="val money pos">${money(Math.round(inc), { round: 1 })}</span></div>${inc > 0 ? `<div class="muted" style="font-size:13px">${Math.round(out / inc * 100)} % deiner festen Einnahmen gehen für Fixkosten drauf.</div>` : ''}</div><button class="btn primary" style="margin-top:16px;width:100%" data-act="fin.rec.add">${icon('plus')}Fixposten hinzufügen</button></section>
    <section class="card glass s8"><h3>${icon('calendar')} Alle Fixposten</h3>${rec.length ? `<div class="list">${rec.map(r => `<button class="li" data-act="fin.rec.edit" data-id="${r.id}" style="${r.paused ? 'opacity:.5' : ''}"><span class="lead" style="background:color-mix(in srgb,${catOf(r.cat).c} 17%,transparent)">${catOf(r.cat).e}</span><span class="mid"><span class="tt">${esc(r.name)}</span><span class="ss">${INTERVALS[r.interval]} · nächste ${relDate(r.next)}${r.auto ? ' · auto' : ''}${r.paused ? ' · pausiert' : ''}</span></span><span class="end money ${r.amt > 0 ? 'pos' : ''}">${moneySigned(r.amt)}<small>${r.interval === 'monthly' ? '' : '≈ ' + money(Math.round(Math.abs(monthlyCost(r))), { round: 1 }) + '/Mon.'}</small></span></button>`).join('')}</div>` : `<div class="empty"><div class="em">🔁</div><b>Keine Fixposten</b><p>Miete, Gehalt, Netflix & Co.: Kairos bucht sie automatisch und warnt vor Abbuchungen.</p></div>`}</section>
    ${det.length ? `<section class="card glass s12"><h3>${icon('sparkle')} Kairos hat mögliche Abos erkannt</h3><div class="list">${det.map((d, i) => `<div class="li tap"><span class="lead" style="background:color-mix(in srgb,${catOf(d.cat).c} 17%,transparent)">${catOf(d.cat).e}</span><span class="mid"><span class="tt">${esc(d.name)}</span><span class="ss">${d.n}× gebucht · jeweils ca. ${money(-d.amt)}</span></span><button class="btn sm primary" data-act="fin.rec.adopt" data-i="${i}">Übernehmen</button></div>`).join('')}</div></section>` : ''}</div>`;
}
function finGoals() {
  const avg = avgSavings();
  return `<div class="grid"><section class="card glass s12"><div class="row-flex"><div class="kpi" style="--c:var(--c-fin)"><span class="lab"><i class="d"></i>Gespart für Ziele</span><span class="val money">${money(sum(S.goals, g => g.saved))}</span>${avg ? `<span class="sub">Ø Überschuss pro Monat: <b>${money(avg, { round: 1 })}</b></span>` : ''}</div><span class="sp"></span><button class="btn primary" data-act="fin.goal.add">${icon('plus')}Sparziel</button></div></section>
    ${S.goals.length ? S.goals.map(g => { const p = goalPct(g), need = goalMonthly(g), done = g.saved >= g.target && g.target > 0;
      return `<section class="card glass s4 goal"><div class="row-flex" style="align-items:flex-start"><div>${ring(p, { size: 78, stroke: 8, color: done ? 'var(--pos)' : 'var(--c-fin)', label: Math.round(p * 100) + '%' })}</div><div style="flex:1;min-width:0"><div class="goal-e">${esc(g.emoji || '🎯')}</div><b style="font-size:16px;display:block;margin-top:4px">${esc(g.name)}</b><div class="muted money" style="font-size:13px">${money(g.saved, { round: 1 })} von ${money(g.target, { round: 1 })}</div></div><button class="iconbtn" data-act="fin.goal.edit" data-id="${g.id}" aria-label="Bearbeiten">${icon('edit')}</button></div>
      <div class="muted" style="font-size:12.5px;margin:12px 0">${done ? '🎉 Ziel erreicht!' : g.deadline ? `Bis ${fmtDate(g.deadline, true)} · ca. <b style="color:var(--text)">${money(need || 0, { round: 1 })}</b> pro Monat` : avg > 0 ? `Bei Ø ${money(avg, { round: 1 })} Überschuss in ca. ${Math.ceil((g.target - g.saved) / avg)} Monaten` : 'Ohne Termin'}</div><button class="btn sm" style="width:100%" data-act="fin.goal.dep" data-id="${g.id}">${icon('plus')}Einzahlen</button></section>`; }).join('')
      : `<section class="card glass s12"><div class="empty"><div class="em">🎯</div><b>Wofür sparst du?</b><p>Urlaub, Notgroschen, neues Setup – setze ein Ziel und Kairos rechnet dir die Monatsrate aus.</p></div></section>`}</div>`;
}

VIEWS.finanzen = {
  render() {
    if (!fin.month) fin.month = curMonth();
    const tab = S.ui.finTab || 'uebersicht';
    const body = { uebersicht: finOverview, buchungen: finBookings, konten: finAccounts, budgets: finBudgets, fix: finFixed, sparen: finGoals }[tab]();
    return `<div class="page"><div class="ph"><div class="t"><h1>Finanzen</h1><p>${S.accounts.length ? `Vermögen <b class="money" style="color:var(--text)">${money(netWorth())}</b> · ${plural(S.tx.length, 'Buchung', 'Buchungen')}` : 'Konten, Buchungen, Budgets und Sparziele an einem Ort.'}</p></div>
      <div class="act"><button class="btn" data-act="fin.more.menu" aria-label="Mehr">${icon('more')}</button><button class="btn primary" data-act="fin.tx.add">${icon('plus')}Buchung</button></div></div>
      <div class="tabsbar"><div class="seg" role="tablist">${FIN_TABS.map(([k, l]) => `<button role="tab" class="${tab === k ? 'on' : ''}" data-act="fin.tab" data-t="${k}">${l}</button>`).join('')}</div></div>${body}</div>`;
  },
  mount(root) {
    $$('[data-count]', root).forEach(el => countUp(el, +el.dataset.count));
    const s = $('#txSearch', root);
    if (s) {
      const upd = () => { $('#txList').innerHTML = txListHTML(); const tot = sum(filteredTx().filter(t => !isXfer(t)), t => t.amt); $('#txSum').innerHTML = `${plural(filteredTx().length, 'Buchung', 'Buchungen')} · Saldo <b class="money" style="color:var(--text)">${moneySigned(tot)}</b>`; };
      s.addEventListener('input', debounce(() => { fin.q = s.value; fin.limit = 60; upd(); }, 120));
      $('#txAcc', root).addEventListener('change', e => { fin.acc = e.target.value; fin.limit = 60; upd(); });
      $('#txCat', root).addEventListener('change', e => { fin.cat = e.target.value; fin.limit = 60; upd(); });
    }
  }
};
ACT['fin.tab'] = el => { S.ui.finTab = el.dataset.t; save(); fin.limit = 60; renderView(false); };
ACT['fin.month'] = el => { if (el.dataset.k) fin.month = el.dataset.k; else { const n = prevMonthKey(fin.month, -(+el.dataset.d)); fin.month = n > curMonth() ? curMonth() : n; } rerender(); };
ACT['fin.more'] = () => { fin.limit += 80; $('#txList').innerHTML = txListHTML(); };
ACT['fin.more.menu'] = el => openMenu(el, [
  { ic: 'upload', label: 'CSV-Import (Bank)', fn: () => ACT['fin.csv']() },
  { ic: 'repeat', label: 'Umbuchung', fn: () => ACT['fin.xfer']() },
  { ic: 'bank', label: 'Konto hinzufügen', fn: () => ACT['fin.acc.add']() },
  { ic: 'download', label: 'Buchungen als CSV exportieren', fn: () => exportTxCsv() }
]);
function exportTxCsv() {
  const rows = [['Datum', 'Betrag', 'Beschreibung', 'Kategorie', 'Konto']].concat(sortedTx().map(t => [t.date, (t.amt / 100).toFixed(2).replace('.', ','), t.desc, catOf(t.cat).name, (accOf(t.acc) || {}).name || '']));
  download(new Blob(['﻿' + rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(';')).join('\n')], { type: 'text/csv;charset=utf-8' }), `kairos-buchungen-${todayISO()}.csv`);
  toast('CSV exportiert', 'good');
}

/* ---------------- CSV-Import ---------------- */
function parseCSV(text) {
  const first = text.split(/\r?\n/).slice(0, 12).join('\n'), cnt = c => (first.match(new RegExp(c === '\t' ? '\t' : '\\' + c, 'g')) || []).length;
  const delim = [';', ',', '\t'].sort((a, b) => cnt(b) - cnt(a))[0];
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === delim) { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); cell = ''; if (row.some(c => c.trim())) rows.push(row); row = []; }
    else cell += ch;
  }
  row.push(cell); if (row.some(c => c.trim())) rows.push(row);
  return rows;
}
function csvDate(s) {
  s = String(s || '').trim(); let m;
  if ((m = s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})/))) return `${m[3].length === 2 ? '20' + m[3] : m[3]}-${pad(+m[2])}-${pad(+m[1])}`;
  if ((m = s.match(/^(\d{4})-(\d{2})-(\d{2})/))) return m[0];
  if ((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/))) return `${m[3]}-${pad(+m[1])}-${pad(+m[2])}`;
  return null;
}
function csvAmount(s) {
  s = String(s || '').trim(); if (!s) return null;
  const neg = /^[-−(]/.test(s) || /[-−)]$/.test(s) || /\bS$/.test(s), c = parseMoney(s.replace(/[()−-]|\s[SH]$/g, ''));
  return c == null ? null : neg ? -c : c;
}
function csvPrepare(text) {
  const rows = parseCSV(text); if (rows.length < 2) return null;
  const hdrRe = /datum|betrag|buchung|valuta|umsatz|verwendung|empf|beg[uü]nstigter|zahlungs|amount|date|description|text/i;
  let hi = rows.findIndex(r => r.length >= 3 && r.filter(c => hdrRe.test(c)).length >= 2); if (hi < 0) hi = 0;
  const head = rows[hi].map(h => h.trim()), data = rows.slice(hi + 1).filter(r => r.length >= Math.max(3, head.length - 2));
  const find = (re, ex) => head.findIndex((h, i) => re.test(h) && !(ex && ex.includes(i)));
  let dateI = find(/buchungstag|buchungsdatum|buchung(?!stext)|datum|date/i); if (dateI < 0) dateI = find(/valuta|wertstellung/i); if (dateI < 0) dateI = 0;
  let amtI = find(/^betrag|betrag \(|amount|umsatz$|^umsatz/i); if (amtI < 0) amtI = find(/betrag|umsatz/i);
  const payee = find(/beg[uü]nstigter|zahlungspflichtiger|empf[aä]nger|auftraggeber|payee|^name$/i), purpose = find(/verwendungszweck|beschreibung|description/i), btext = find(/buchungstext|text/i);
  const descI = [payee, purpose].filter(i => i >= 0); if (!descI.length && btext >= 0) descI.push(btext);
  return { head, data, dateI, amtI, descI: descI.length ? descI : [Math.max(0, head.findIndex((h, i) => i !== dateI && i !== amtI))] };
}
async function readTextSmart(file) {
  const buf = await file.arrayBuffer(); let t = new TextDecoder('utf-8').decode(buf);
  if (t.includes('�')) t = new TextDecoder('windows-1252').decode(buf);
  return t.replace(/^﻿/, '');
}

function csvDialog(P, fname) {

    const items = []; let bad = 0, dup = 0;
    for (const r of P.data) {

      const desc = smartCase(idx.ds.map(i => (r[i] || '').trim()).filter(Boolean).join(' · ').replace(/\s{2,}/g, ' ').slice(0, 90));
      if (S.tx.some(t => t.acc === accId && t.date === date && t.amt === amt && norm(t.desc) === norm(desc))) { dup++; continue; }
      items.push({ date, amt, desc });
    }

  const optsCols = sel => P.head.map((h, i) => `<option value="${i}" ${i === sel ? 'selected' : ''}>${esc(h || 'Spalte ' + (i + 1))}</option>`).join('');

    <div class="field full"><label>Konto</label><select class="sel" id="cAcc">${S.accounts.map(a => `<option value="${a.id}" ${a.id === defaultAcc() ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}</select></div></div>
    <div id="cPrev" style="margin-top:16px"></div><div class="acts"><button class="btn" data-sh="no">Abbrechen</button><button class="btn primary" id="cGo">Importieren</button></div>`, { wide: true });
  const upd = () => { const r = build(); $('#cPrev', sh).innerHTML = `<div class="muted" style="font-size:13px;margin-bottom:8px"><b style="color:var(--text)">${r.items.length}</b> neue Buchungen${r.dup ? ` · ${r.dup} Duplikate übersprungen` : ''}${r.bad ? ` · ${r.bad} Zeilen nicht lesbar` : ''}</div><div class="list" style="max-height:230px;overflow:auto">${r.items.slice(0, 6).map(i => `<div class="li tap" style="padding:7px 8px"><span class="mid"><span class="tt">${esc(i.desc || '–')}</span><span class="ss">${fmtDate(i.date, true)}</span></span><span class="end money ${i.amt > 0 ? 'pos' : ''}" style="font-size:14px">${moneySigned(i.amt)}</span></div>`).join('')}</div>`; $('#cGo', sh).disabled = !r.items.length; return r; };
  sh.addEventListener('change', upd); upd();

const focusToday = () => (S.focus.sessions[todayISO()] || 0);
function fmtClock(s) { s = Math.max(0, Math.round(s)); return `${pad(Math.floor(s / 60))}:${pad(s % 60)}`; }
function focusStep() {
  focus.left = Math.max(0, Math.round((focus.end - Date.now()) / 1000));
  const el = $('#fClock'); if (el) el.textContent = fmtClock(focus.left);
  const r = $('#fRing'); if (r) r.style.strokeDasharray = `${(2 * Math.PI * 104 * (1 - focus.left / (focus.startedMins * 60))).toFixed(1)} 999`;
  document.title = `${fmtClock(focus.left)} · Fokus · Kairos`;
  if (focus.left <= 0) focusDone();
}
function focusDone() {
  clearInterval(focus.tick); focus.running = false;
  S.focus.sessions[todayISO()] = focusToday() + focus.startedMins; save();
  focus.left = focus.mins * 60; document.title = 'Kairos';
  try { const c = new (window.AudioContext || window.webkitAudioContext)(), o = c.createOscillator(), g = c.createGain(); o.connect(g); g.connect(c.destination); o.frequency.value = 880; g.gain.setValueAtTime(.0001, c.currentTime); g.gain.exponentialRampToValueAtTime(.25, c.currentTime + .05); g.gain.exponentialRampToValueAtTime(.0001, c.currentTime + .9); o.start(); o.stop(c.currentTime + 1); } catch (e) { /* ignorieren */ }
  try { if ('Notification' in window && Notification.permission === 'granted') new Notification('Fokus-Runde geschafft 🎯', { body: `${focus.startedMins} Minuten konzentriert gearbeitet.` }); } catch (e) { /* ignorieren */ }
  toast(`Fokus-Runde geschafft · ${focus.startedMins} Min 🎯`, 'good'); if (route === 'job') rerender();
}

  else { focus.startedMins = focus.mins; if (focus.left <= 0 || focus.left > focus.mins * 60) focus.left = focus.mins * 60; focus.end = Date.now() + focus.left * 1000; focus.running = true; focus.tick = setInterval(focusStep, 500); try { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission(); } catch (e) { /* ignorieren */ } }

/* =====================================================================
   KAIROS · Lifestyle: Gewohnheiten, Check-in, Ziele, Journal

const LIFE_TABS = [['habits', 'Gewohnheiten'], ['checkin', 'Check-in'], ['ziele', 'Ziele'], ['journal', 'Journal']];
const HABIT_EMOJI = ['💧', '🏃', '🧘', '📖', '🥗', '😴', '💊', '✍️', '🎸', '🧹', '🚭', '☀️'];

/* ---------- Gewohnheiten ---------- */
function lifeHabits() {
  const t = todayISO(), days = Array.from({ length: 7 }, (_, i) => addDays(t, i - 6));
  if (!S.habits.length) return `<section class="card glass"><div class="empty"><div class="em">🔥</div><b>Baue deine Routinen</b><p>Wasser trinken, Sport, Lesen … hake täglich ab und halte deine Serie. Per Kairos: „Habit Meditieren“.</p><button class="btn primary" data-act="life.habit.add">${icon('plus')}Gewohnheit anlegen</button></div></section>`;
  const done = S.habits.filter(h => h.days[t]).length;
  return `<div class="grid"><section class="card glass s12"><div class="row-flex"><div>${ring(done / S.habits.length, { size: 74, stroke: 8, color: 'var(--c-life)', label: `${done}/${S.habits.length}` })}</div><div style="flex:1"><b style="font-size:18px">${done === S.habits.length ? 'Alles geschafft 🎉' : `Noch ${S.habits.length - done} offen`}</b><div class="muted" style="font-size:14px">Heute · ${fmtDate(t)}</div></div><button class="btn primary" data-act="life.habit.add">${icon('plus')}Gewohnheit</button></div></section>
    <section class="card glass s12"><div class="hgrid"><div class="hh"><span></span>${days.map(d => `<span class="${d === t ? 'today' : ''}">${DAY_S[parseISO(d).getDay()]}<br><small>${parseISO(d).getDate()}</small></span>`).join('')}<span></span></div>
    ${S.habits.map(h => `<div class="hr"><button class="hname" data-act="life.habit.edit" data-id="${h.id}"><span class="he">${esc(h.emoji || '✨')}</span><span><b>${esc(h.name)}</b><small>${streakOf(h) ? `${icon('flame')} ${streakOf(h)} Tage` : 'Noch keine Serie'} · ${Object.keys(h.days).length}× gesamt</small></span></button>
      ${days.map(d => `<button class="hc ${h.days[d] ? 'on' : ''} ${d === t ? 'today' : ''}" data-act="life.habit.day" data-id="${h.id}" data-d="${d}" aria-label="${esc(h.name)} am ${fmtDate(d)}" aria-pressed="${!!h.days[d]}">${icon('check')}</button>`).join('')}<span></span></div>`).join('')}</div></section></div>`;
}
ACT['life.habit.toggle'] = el => { const h = S.habits.find(x => x.id === el.dataset.id), t = todayISO(); if (!h) return; h.days[t] ? delete h.days[t] : h.days[t] = 1; save(); rerender(); if (h.days[t] && streakOf(h) && [3, 7, 14, 21, 30, 50, 100].includes(streakOf(h))) toast(`🔥 ${streakOf(h)} Tage Serie: ${h.name}!`, 'good'); };
ACT['life.habit.day'] = el => { const h = S.habits.find(x => x.id === el.dataset.id), d = el.dataset.d; h.days[d] ? delete h.days[d] : h.days[d] = 1; save(); rerender(); };

/* ---------- Check-in ---------- */
function lifeCheckin() {
  const t = todayISO(), c = S.checkins[t] || {}, days = Array.from({ length: 14 }, (_, i) => addDays(t, i - 13));
  const series = k => days.map(d => (S.checkins[d] || {})[k]).map(v => v == null ? null : v);
  const avg = k => { const v = series(k).filter(x => x != null); return v.length ? (sum(v) / v.length) : null; };
  const spark = (k, color, max) => { const v = series(k); return v.some(x => x != null) ? sparkline(v.map(x => x == null ? 0 : x), { color, h: 50 }) : '<div class="faint" style="font-size:13px;padding:14px 0">Noch keine Daten</div>'; };
  const scale = (k, label) => `<div class="field"><label>${label}</label><div class="scale">${[1, 2, 3, 4, 5].map(n => `<button class="${c[k] === n ? 'on' : ''}" data-act="life.ci" data-k="${k}" data-v="${n}">${k === 'mood' ? MOODS[n - 1] : n}</button>`).join('')}</div></div>`;
  const n = Object.keys(S.checkins).length;
  return `<div class="grid"><section class="card glass s5"><h3>${icon('sun')} Heute · ${fmtDate(t)}</h3><div class="stack" style="gap:16px">${scale('mood', 'Stimmung')}${scale('energy', 'Energie')}
    <div class="field"><label>Schlaf (Stunden)</label><input class="inp" id="ciSleep" inputmode="decimal" placeholder="z. B. 7,5" value="${c.sleep != null ? String(c.sleep).replace('.', ',') : ''}"></div>
    <div class="field"><label>Kurze Notiz (optional)</label><input class="inp" id="ciNote" placeholder="Was war heute los?" value="${esc(c.note || '')}"></div></div></section>
    <section class="card glass s7"><h3>${icon('trend')} Letzte 14 Tage</h3>${n >= 2 ? `<div class="stack" style="gap:14px">${[['mood', 'Stimmung', 'var(--c-life)'], ['energy', 'Energie', 'var(--c-biz)'], ['sleep', 'Schlaf', 'var(--c-job)']].map(([k, l, col]) => `<div><div class="row-flex" style="justify-content:space-between"><b style="font-size:14px">${l}</b><span class="muted" style="font-size:13px">Ø ${avg(k) != null ? avg(k).toFixed(1).replace('.', ',') + (k === 'sleep' ? ' h' : ' / 5') : '–'}</span></div>${spark(k, col)}</div>`).join('')}</div>${checkinInsight()}` : `<div class="empty"><div class="em">📈</div><b>Muster entdecken</b><p>Nach ein paar Tagen zeigt Kairos Verläufe und Zusammenhänge – z. B. wie Schlaf und Stimmung zusammenhängen.</p></div>`}</section></div>`;
}
function checkinInsight() {
  const rows = Object.entries(S.checkins).filter(([, c]) => c.sleep != null && c.mood != null); if (rows.length < 6) return '';
  const good = rows.filter(([, c]) => c.sleep >= 7), bad = rows.filter(([, c]) => c.sleep < 7); if (good.length < 2 || bad.length < 2) return '';
  const g = sum(good, ([, c]) => c.mood) / good.length, b = sum(bad, ([, c]) => c.mood) / bad.length;
  return Math.abs(g - b) >= 0.4 ? `<div class="ins info" style="margin-top:14px"><span class="ie">🔎</span><div class="im"><b>Schlaf wirkt auf deine Stimmung</b><p>Nach ≥ 7 Stunden Schlaf liegt deine Stimmung im Schnitt bei ${g.toFixed(1).replace('.', ',')} – sonst bei ${b.toFixed(1).replace('.', ',')}.</p></div></div>` : '';
}

ACT['life.mood'] = el => { const c = S.checkins[todayISO()] = S.checkins[todayISO()] || {}; c.mood = +el.dataset.v; save(); rerender(); };

    if (dm) { const mo = /^\d+$/.test(dm[2]) ? +dm[2] : MONTH_IDX[norm(dm[2]).replace(/\.$/, '')] || MONTH_IDX[norm(dm[2]).slice(0, 3)]; const dd = mo && mkISO(dm[3], mo, dm[1]); if (dd) { v = dd; t = 'date'; } }
    else if (/^[-+]?\d[\d. ]*,\d{2}\s?(€|eur)?$/i.test(raw)) { const mv = parseMoney(raw); if (mv != null) { v = mv; t = 'money'; } }
    out.push({ k: prev ? prev.k : 'x' + out.length + norm(l).slice(0, 6), l, v, t, ...(prev && prev.per ? { per: prev.per } : {}) });

function deleteDoc(d) {

const earnDefault = () => ({ profile: null, saved: [], dismissed: [], exps: [], inc: [], missions: {}, lab: [], labSeed: 1, seen: {} });
function E() {
  if (!S.earn) S.earn = earnDefault();
  const d = earnDefault(); for (const k in d) if (S.earn[k] == null) S.earn[k] = d[k];
  return S.earn;
}
const hashStr = s => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
const expById = id => E().exps.find(x => x.id === id);
const activeExps = () => E().exps.filter(x => x.status === 'aktiv');
const eur = c => money(c, { round: 1 });

/* ---------- Passung ---------- */
function matchIdea(i, p) {
  p = p || E().profile; if (!p) return { score: 50, reasons: [] };
  let s = 30; const why = [];
  const hit = i.tags.filter(t => p.skills.includes(t));
  if (i.tags.length) {
    if (hit.length) { s += 28 + Math.min(12, (hit.length - 1) * 6); why.push('Passt zu deinen Stärken: ' + hit.map(t => SKILLS[t][0].split(' &')[0]).join(', ')); }
    else s -= 12;
  } else { s += 12; why.push('Ohne Vorkenntnisse machbar'); }
  if (i.mode === 'beides' || p.mode === 'beides' || i.mode === p.mode) s += 8; else s -= 28;
  const cap = (p.capital || 0) / 100;
  if (i.start <= cap) { if (i.start > 0) why.push('Startkosten (ca. ' + i.start + ' €) im Budget'); else why.push('Ohne Startkapital'); s += 6; }
  else s -= Math.min(30, 8 + (i.start - cap) / 10);
  if (i.h <= p.hours) { s += 8; why.push('Passt in ' + p.hours + ' Std./Woche'); } else s -= Math.min(24, (i.h - p.hours) * 3);
  if (p.pace === 'quick') { if (i.ttf <= 10) { s += 12; why.push('Erste Einnahmen oft binnen ' + i.ttf + ' Tagen'); } else if (i.ttf > 30) s -= 12; }
  else if (i.ttf >= 30) s += 5;
  if (i.lvl === 1) s += 4;
  return { score: Math.round(clamp(s * .9, 5, 96)), reasons: why.slice(0, 3) };
}
const rankedIdeas = () => {
  const p = E().profile, dis = E().dismissed;
  return IDEAS.filter(i => !dis.includes(i.id)).map(i => ({ i, m: matchIdea(i, p) })).sort((a, b) => b.m.score - a.m.score || a.i.ttf - b.i.ttf);
};

const ttfTxt = d => d <= 3 ? 'in Tagen' : d <= 10 ? 'in ca. 1 Woche' : d <= 21 ? 'in 2–3 Wochen' : d <= 45 ? 'in 1–2 Monaten' : 'in 2–4 Monaten';

/* ---------- Experimente ---------- */
function mkSteps(list) { return list.map(([t, min, tpl]) => ({ t, min: min || 10, tpl: tpl || '', done: false })); }
function startIdea(id, opts = {}) {
  const idea = ideaById(id); if (!idea) return null;
  const ex = E().exps.find(x => x.idea === id && (x.status === 'aktiv' || x.status === 'geplant'));
  if (ex) { if (ex.status === 'geplant') { if (activeExps().length >= 3) { toast('Maximal 3 aktive Experimente – pausiere oder beende eines.', 'bad'); return ex; } ex.status = 'aktiv'; save(); } return ex; }
  if (activeExps().length >= 3) { toast('Maximal 3 aktive Experimente – pausiere oder beende eines, damit du fokussiert bleibst.', 'bad'); return null; }
  const e = { id: uid(), idea: id, title: idea.t, e: idea.e, status: 'aktiv', steps: mkSteps(idea.steps), created: Date.now(), startDate: todayISO(), firstEuro: null, note: '' };
  E().exps.push(e); E().saved = E().saved.filter(x => x !== id); save(); return e;
}

  const dr = S.invoices.find(i => i.status === 'entwurf');
  if (dr) { const c = clientOf(dr.client); return { id: 'ctx-dr', e: '📤', t: `Verschicke Rechnung ${dr.no}${c ? ' an ' + c.name : ''}`, min: 5, why: 'Erst wenn sie draußen ist, läuft die Zahlungsfrist.', open: ['inv', dr.id], money: invGross(dr) }; }
  const fin = S.deals.find(d => d.stage === 'fertig' && d.value && !S.invoices.some(i => i.subject === d.title));
  if (fin) return { id: 'ctx-fin', e: '🧾', t: `Stelle eine Rechnung für „${fin.title}“`, min: 10, why: 'Das Projekt ist fertig – bis zur Rechnung ist das Geld nur verdient, nicht eingegangen.', open: ['finbill', fin.id], money: fin.value };
  const off = S.deals.filter(d => d.stage === 'angebot').sort((a, b) => (b.value || 0) - (a.value || 0))[0];
  if (off) { const c = clientOf(off.client); return { id: 'ctx-off', e: '📨', t: `Hake bei ${c ? c.name : 'deinem Kunden'} zu „${off.title}“ nach`, min: 5, why: `Ein Angebot über ${eur(off.value || 0)} liegt offen – ein kurzes Nachfassen entscheidet oft den Abschluss.`, tpl: 'followup', money: off.value };}
  const day = E().profile ? hashStr(t) : hashStr(t) + 1;
  const m = MOVES[day % MOVES.length]; return { ...m };
}
function primaryFor(skip) {
  const ex = E(); let list = [];
  activeExps().forEach(e => { const n = nextStep(e); if (n >= 0) list.push({ kind: 'step', exp: e.id, step: n }); });
  list.sort((a, b) => { const A = expById(a.exp), B = expById(b.exp); return (A.steps.filter(x => x.done).length ? 0 : 1) - (B.steps.filter(x => x.done).length ? 0 : 1) || A.created - B.created; });
  if (!ex.profile) list.push({ kind: 'profile' });
  ex.exps.filter(e => e.status === 'geplant').forEach(e => list.push({ kind: 'plan', exp: e.id }));
  ex.saved.forEach(id => { if (ideaById(id) && !ex.exps.some(e => e.idea === id && e.status === 'aktiv')) list.push({ kind: 'idea', idea: id }); });
  const rk = rankedIdeas().filter(r => !ex.saved.includes(r.i.id) && !ex.exps.some(e => e.idea === r.i.id && e.status !== 'verworfen')).slice(0, 8);
  if (rk.length) { const off = hashStr(todayISO() + 'x') % Math.min(5, rk.length); for (let k = 0; k < rk.length; k++) list.push({ kind: 'idea', idea: rk[(off + k) % rk.length].i.id }); }
  if (!list.length) list.push({ kind: 'move', move: MOVES[hashStr(todayISO()) % MOVES.length].id });
  return list[skip % list.length];
}
function missionToday() {
  const t = todayISO(), ex = E(); let m = ex.missions[t];
  if (!m) {
    m = ex.missions[t] = { skips: 0, pDone: false, bDone: false, p: null, b: null };
    Object.keys(ex.missions).sort().slice(0, -60).forEach(k => delete ex.missions[k]);
  }
  if (!m.pDone) m.p = primaryFor(m.skips);
  if (!m.bDone) m.b = moveCtx();
  return m;
}
function describeP(p) {
  if (p.kind === 'step') {
    const e = expById(p.exp); if (!e) return null; const s = e.steps[p.step]; if (!s) return null;
    return { e: e.e, title: s.t, why: `Schritt ${p.step + 1} von ${e.steps.length} · ${e.title}`, min: s.min, tpl: s.tpl, kind: 'step', exp: e.id, step: p.step, prog: expProgress(e) };
  }
  if (p.kind === 'profile') return { e: '🧭', title: 'Sag Kairos, was du kannst – dann bekommst du Ideen, die zu dir passen', why: 'Eine Minute: Stärken, Zeit pro Woche und Startkapital. Ohne Profil sind die Ideen nur Durchschnitt.', min: 2, kind: 'profile' };
  if (p.kind === 'plan') { const e = expById(p.exp); if (!e) return null; return { e: e.e, title: `Starte dein Experiment: ${e.title}`, why: 'Du hast diese Idee vorgemerkt. Der erste Schritt ist klein, der Rest ergibt sich.', min: e.steps[0] ? e.steps[0].min : 15, kind: 'plan', exp: e.id }; }
  if (p.kind === 'idea') {

}

async function putBytes(id, buf, type, name) {
  if (cryptoKey) { const e = await encBytes(buf); await filePutRaw(id, { enc: 1, iv: e.iv, ct: e.ct, type, name }); }
  else await filePutRaw(id, { blob: new Blob([buf], { type }), type, name });
}
async function exportBackup() {
  await saveNow(); const files = [];
  for (const d of S.docs) if (d.fileName) { try { const blob = await getFileBlob(d.id); if (blob) files.push({ id: d.id, name: d.fileName, type: d.fileType, b64: b64(await blob.arrayBuffer()) }); } catch (e) { /* Datei überspringen */ } }
  download(new Blob([JSON.stringify({ app: 'kairos', v: 2, exported: new Date().toISOString(), state: S, files })], { type: 'application/json' }), `kairos-backup-${todayISO()}.json`);
  lsSet('kairos-lastbackup', todayISO()); toast(`Backup gespeichert${files.length ? ` (inkl. ${plural(files.length, 'Datei', 'Dateien')})` : ''}`, 'good'); if (route === 'einstellungen') rerender();
}
async function importBackup(file) {
  let data; try { data = JSON.parse(await file.text()); } catch (e) { return toast('Das ist keine gültige Backup-Datei.', 'bad'); }
  if (!data || data.app !== 'kairos' || !data.state) return toast('Diese Datei stammt nicht von Kairos.', 'bad');
  if (!await confirmSheet('Backup einspielen?', `Alle aktuellen Daten werden durch das Backup vom ${(data.exported || '').slice(0, 10)} ersetzt.`, 'Einspielen', false)) return;
  try {
    for (const k of await fileKeys()) await fileDel(k);
    S = migrate(data.state); dirty = true;
    for (const f of data.files || []) await putBytes(f.id, unb64(f.b64).buffer, f.type, f.name);
    await saveNow(); toast('Backup eingespielt', 'good'); go('heute'); renderNav();
  } catch (e) { console.error(e); toast('Import fehlgeschlagen.', 'bad'); }
}
ACT['app.export'] = () => exportBackup();

      ${replay ? '<div class="onb-acts"><button class="btn primary lg" id="onbClose">Schließen</button></div>' : ''}</div></div>`;
    let mode = 'demo';
    if (replay) { $('#onbClose').onclick = () => { el.hidden = true; el.innerHTML = ''; res(); }; return; }
    $$('#onbForm button', el).forEach(b => b.addEventListener('click', () => mode = b.dataset.m));
